is afternoon.","effects":{"capital":-100000,"trust":2,"risk":3,"ttl":0,"capacity":0},"feedback":"Failover takes 14 minutes instead of four. The DR site holds the peak, and the review finds why it took 14."}],"situation":"Data-centre desk, 13:12: Grid power lost. Generator A running. Generator B failed to start. Data-centre desk, 13:20: Fuel for A at about five hours. Peak begins at 16:00. Data-centre desk, 13:24: Facilities can get a fuel delivery by 17:30 or a hired generator by 19:00. Technology, do we shed load, and who tells participants?","mediumLabel":"Message thread"},"I4":{"id":"I4","kind":"inject","title":"The CAB Is Moved","owner":"PLATFORM","ownerDept":"PMU","accounts":["ADEPA"],"engineStage":"activation","skills":["closing_plan","time_management"],"ccp":"A33","medium":"email","from":"efua","subject":"CAB moved by a week","situation":"The Change Advisory Board has been moved by a week to make room for the core switch major release. Adepa's go-live change was on this week's agenda. The next sitting is after month-end. An emergency CAB needs the chief executive's sign-off and a written risk assessment from Technology by tomorrow.","data":[{"label":"CAB","value":"Moved by one week","evidence":"A","source":"game figure"},{"label":"Sequence","value":"PMO convenes the CAB after certification","evidence":"C","source":"GhIPSS onboarding chain"},{"label":"Emergency CAB","value":"Chief executive's sign-off plus a risk assessment","evidence":"A","source":"game figure"},{"label":"Adepa payday","value":"Before the next scheduled sitting","evidence":"A","source":"game figure"}],"question":"What does Platform do?","options":[{"key":"A","text":"Deploy Adepa's change under the major release's approval, since the CAB has already reviewed that release window.","effects":{"capital":250000,"trust":2,"risk":12,"ttl":-5,"capacity":0},"feedback":"The change goes in with the release. The CAB register shows one approval for two changes, and Efua notices.","setFlags":["unapproved_change"]},{"key":"B","text":"Accept the week's delay, tell Adepa that the CAB has moved, and offer no alternative date for the change at all.","effects":{"capital":-150000,"trust":-7,"risk":-1,"ttl":8,"capacity":0},"feedback":"Adepa hears 'the CAB moved' as 'GhIPSS moved'. Its payday goes through a bank this month."},{"key":"C","text":"Ask the PMO to move the major release instead of Adepa's change, since Adepa's change was on the agenda first.","effects":{"capital":0,"trust":0,"risk":5,"ttl":3,"capacity":0},"feedback":"The PMO declines. A week is spent on the argument, and the emergency route is still there, unused."},{"key":"D","text":"Write the risk assessment tonight and request an emergency CAB for Adepa's change only, with the CEO's sign-off.","effects":{"capital":150000,"trust":5,"risk":-2,"ttl":-5,"capacity":0},"feedback":"The emergency CAB sits for 25 minutes on Thursday. Adepa's change is approved on its own evidence."}],"mediumLabel":"Email"},"I5":{"id":"I5","kind":"inject","title":"ID Check Down","owner":"SERVICE","ownerDept":"Shared Services (field support)","accounts":["NYEP"],"engineStage":"acquisition","skills":["customer_empathy","time_management"],"ccp":"A31","medium":"message","from":"regdesk","lines":[["Registration desk, 09:15","The national ID verification service is down. Queue of about 600 at this desk, more at the other four."],["Registration desk, 09:16","Banks cannot validate Ghana Cards, so no wallets can be opened. The vehicles are here until 17:00."],["Registration desk, 09:18","The service provider says 'later today'. What do we do with the queue?"]],"data":[{"label":"Queue","value":"About 600 at this desk; five desks","evidence":"A","source":"game figure"},{"label":"Registration","value":"Needs a Ghana Card validated at the bank","evidence":"C","source":"GhIPSS GhanaPay FAQ"},{"label":"Service restore","value":"'Later today'","evidence":"A","source":"game figure"},{"label":"Vehicles","value":"On site until 17:00","evidence":"A","source":"game figure"}],"question":"What does Shared Services do?","options":[{"key":"A","text":"Capture card details offline, issue numbered tokens with a return slot, and validate in batch when it returns.","effects":{"capital":50000,"trust":5,"risk":-1,"ttl":-2,"capacity":0},"feedback":"The service returns at 14:40. Four hundred wallets are validated before 17:00 and the rest have a slot for tomorrow."},{"key":"B","text":"Open the wallets now and validate the cards later, so that nobody in the queue goes home with nothing to show.","effects":{"capital":150000,"trust":3,"risk":12,"ttl":-2,"capacity":0},"feedback":"Six hundred wallets open without validation. Forty-one of them never validate, and the bank's compliance team writes."},{"key":"C","text":"Send the queue home with no return date, and resume the drive when the service provider confirms it is stable.","effects":{"capital":-150000,"trust":-6,"risk":0,"ttl":6,"capacity":0},"feedback":"The queue leaves. Half of them do not come back, and the region's payday runs on PayRoute again."},{"key":"D","text":"Keep the queue waiting for the service to return, and extend the vehicles and the desks into the evening.","effects":{"capital":-100000,"trust":-2,"risk":1,"ttl":2,"capacity":0},"feedback":"The queue waits five hours in the sun. The service returns at 14:40 and 200 people have already gone."}],"situation":"Registration desk, 09:15: The national ID verification service is down. Queue of about 600 at this desk, more at the other four. Registration desk, 09:16: Banks cannot validate Ghana Cards, so no wallets can be opened. The vehicles are here until 17:00. Registration desk, 09:18: The service provider says 'later today'. What do we do with the queue?","mediumLabel":"Message thread"},"I6":{"id":"I6","kind":"inject","title":"The Telco Objects","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["NYEP"],"engineStage":"acquisition","skills":["negotiation","stakeholder_map"],"ccp":"A31","medium":"letter","from":"telco","subject":"Proposed migration of NYEP stipends","situation":"Dear Programme Director, copied to GhIPSS. We have learned of a proposal to migrate NYEP stipends from telco wallets to GhanaPay. Our company has served these beneficiaries for four years at no cost to the programme. We ask that any migration preserve beneficiary choice of wallet. We would welcome a meeting. Yours faithfully, Head of Public Sector.","data":[{"label":"Telco","value":"Four years serving the programme","evidence":"A","source":"game figure"},{"label":"Ask","value":"Beneficiary choice of wallet","evidence":"A","source":"game figure"},{"label":"The telco's interest behind the ask","value":"Unknown","evidence":"U","source":null},{"label":"The programme's view","value":"Unknown","evidence":"U","source":null}],"question":"What does the Executive Office do?","options":[{"key":"A","text":"Ignore the letter, since the programme and not the telco decides where it pays its beneficiaries each month.","effects":{"capital":50000,"trust":-5,"risk":4,"ttl":0,"capacity":0},"feedback":"The telco writes to the ministry next. The migration now has a public objector and a question in parliament."},{"key":"B","text":"Meet the provider with the programme in the room, and propose GhanaPay as the rail while any wallet can receive.","effects":{"capital":100000,"trust":6,"risk":-2,"ttl":-2,"capacity":0},"feedback":"The telco's interest was its customers, not the rail. It keeps the customers who stay and stops writing letters."},{"key":"C","text":"Ask the programme to make GhanaPay the only wallet for the stipends, so that the full volume is secured for the rail.","effects":{"capital":250000,"trust":-8,"risk":9,"ttl":-3,"capacity":0},"feedback":"The programme hesitates. The telco's lawyers write about competition, and the regulator asks for a briefing."},{"key":"D","text":"Refer the matter to the regulator for a ruling on wallet choice before the migration proceeds any further at all.","effects":{"capital":-100000,"trust":-3,"risk":0,"ttl":10,"capacity":0},"feedback":"The regulator takes three months to decline to rule. The migration waits for all of them."}],"mediumLabel":"Letter"}}}</script>

<script>
const ENGINE = (function (module) {
/*ENGINE:BEGIN*//*
 * Rail to Revenue: reference game engine v2.0
 * Pure, deterministic, event-sourced. No I/O, no randomness, no clock.
 * state = replay(scenario, events). The build embeds this file byte for byte and treats it
 * as the single source of truth for scoring, routing, settlement, objectives, headlines and moods.
 *
 * Event types (unchanged from v1.0):
 *   { id, type: "choose", nodeId, optionKey }   a team locks an option on the node in front of it
 *   { id, type: "inject", injectId }            facilitator pushes an inject (queued, played after current lock-in)
 *   { id, type: "lifeline" }                    team uses Ask the Coach
 *   { id, type: "void", targetId }              facilitator voids an earlier choose/lifeline event (mis-tap)
 *
 * v2.0 additions:
 *   - fifth meter "capacity" (Squad Capacity, 0 to 6). Options with a capacity cost are locked when the
 *     squad cannot pay; settlement returns one unit after its checks, only when another round follows.
 *   - state flags capacity_low (capacity 2 or less) and trust_high (trust 60 or more), set at settlement.
 *   - curveball trigger cb_burnout (capacity 0 at settlement).
 *   - flagsEver: every flag ever set, read by objectives and achievements ("during the quarter").
 *   - objectives(), achievements(), headlines(), moods(): pure functions of scenario and state.
 *   - final settlement adds the Engine Bonus when all four cluster objectives are met.
 */
"use strict";

const METERS = ["capital", "trust", "risk", "ttl", "capacity"];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function initialState(scenario) {
  const s = scenario.config.startState;
  return {
    capital: s.capital, trust: s.trust, risk: s.risk, ttl: s.ttl, capacity: s.capacity,
    flags: [], flagsEver: [], played: [], round: 1, slot: 0, routeNext: null,
    pendingInjects: [], lifelinesUsed: 0, status: "playing",
    decisions: 0, log: [], presented: null,
    objectivesMet: null, engineBonus: 0,
  };
}

function newGame(scenario) { return advance(scenario, initialState(scenario)); }

function hasFlag(state, f) { return state.flags.indexOf(f) !== -1; }
function everFlag(state, f) { return state.flagsEver.indexOf(f) !== -1; }
function addFlag(state, f) {
  if (!hasFlag(state, f)) state.flags.push(f);
  if (!everFlag(state, f)) state.flagsEver.push(f);
}
function removeFlag(state, f) { state.flags = state.flags.filter((x) => x !== f); }

function triggerMet(state, trigger) {
  if (!trigger) return false;
  const all = trigger.all || [], any = trigger.any || [], none = trigger.none || [];
  if (!all.every((f) => hasFlag(state, f))) return false;
  if (any.length && !any.some((f) => hasFlag(state, f))) return false;
  if (none.some((f) => hasFlag(state, f))) return false;
  return true;
}

function compare(a, op, b) {
  switch (op) {
    case ">=": return a >= b;
    case ">": return a > b;
    case "<=": return a <= b;
    case "<": return a < b;
    case "==": return a === b;
    default: throw new Error("Unknown operator " + op);
  }
}

/** A requirement is { meter, op, value, reason } or { flag, reason }. An option may carry one or a list. */
function requirementsOf(option) {
  if (!option.requires) return [];
  return Array.isArray(option.requires) ? option.requires : [option.requires];
}

/** Returns null when the option is open, otherwise the reason it is locked. */
function lockedReason(state, option) {
  const reqs = requirementsOf(option);
  for (let i = 0; i < reqs.length; i++) {
    const req = reqs[i];
    if (req.meter) {
      if (!compare(state[req.meter], req.op, req.value)) {
        if (req.reason) return req.reason;
        if (req.meter === "capacity") return "Locked: needs " + req.value + " capacity unit" + (req.value === 1 ? "" : "s") + ", " + state.capacity + " available.";
        return "Locked: " + req.meter + " " + req.op + " " + req.value + ".";
      }
    } else if (req.flag) {
      if (!hasFlag(state, req.flag)) return req.reason || "Locked.";
    }
  }
  return null;
}

function optionLocked(state, option) { return lockedReason(state, option) !== null; }

/** Resolve which node comes next. Injects queued during a decision play after that decision locks. */
function resolveNext(scenario, state) {
  if (state.status !== "playing") return null;
  if (state.pendingInjects.length) return state.pendingInjects[0];
  const round = scenario.rounds[state.round - 1];
  const slot = round.slots[state.slot];
  if (slot.kind === "node") return slot.node;
  if (slot.kind === "route") {
    if (!state.routeNext) throw new Error("Route slot reached with no route set in " + round.id);
    return state.routeNext;
  }
  if (slot.kind === "consequence") {
    const picks = slot.candidates
      .map((id) => scenario.nodes[id])
      .filter((n) => n.eligibleRounds.indexOf(round.number) !== -1)
      .filter((n) => state.played.indexOf(n.id) === -1)
      .filter((n) => triggerMet(state, n.trigger))
      .sort((a, b) => b.priority - a.priority || (a.id < b.id ? -1 : 1));
    return picks.length ? picks[0].id : slot.default;
  }
  throw new Error("Unknown slot kind " + slot.kind);
}

/** The node currently in front of the team. Fixed until the team locks a choice. */
function currentNodeId(scenario, state) { return state.status === "playing" ? state.presented : null; }

function advance(scenario, state) { state.presented = resolveNext(scenario, state); return state; }

function getNode(scenario, id) {
  const n = scenario.nodes[id] || scenario.injects[id];
  if (!n) throw new Error("Unknown node " + id);
  return n;
}

function optionsFor(scenario, state, nodeId) {
  const node = getNode(scenario, nodeId);
  return node.options.map((o) => {
    const reason = lockedReason(state, o);
    return { key: o.key, text: o.text, locked: reason !== null, lockedReason: reason };
  });
}

function zeroFx() { return { capital: 0, trust: 0, risk: 0, ttl: 0, capacity: 0 }; }

function effectiveEffects(state, option) {
  const fx = zeroFx();
  METERS.forEach((m) => { fx[m] += (option.effects[m] || 0); });
  const applied = [];
  (option.effectsIf || []).forEach((c) => {
    if (hasFlag(state, c.flag)) {
      METERS.forEach((m) => { fx[m] += (c.effects[m] || 0); });
      applied.push(c.note);
    }
  });
  return { fx, applied };
}

function applyEffects(scenario, state, fx) {
  const b = scenario.config.bounds;
  state.capital += fx.capital || 0;
  state.trust = clamp(state.trust + (fx.trust || 0), b.trust[0], b.trust[1]);
  state.risk = clamp(state.risk + (fx.risk || 0), b.risk[0], b.risk[1]);
  state.ttl = clamp(state.ttl + (fx.ttl || 0), b.ttl[0], b.ttl[1]);
  state.capacity = clamp(state.capacity + (fx.capacity || 0), b.capacity[0], b.capacity[1]);
}

function snapshot(state) { return { capital: state.capital, trust: state.trust, risk: state.risk, ttl: state.ttl, capacity: state.capacity }; }

function band(bands, v) { return bands.find((x) => v >= x.min && v <= x.max); }

/** Round settlement. Order: bands, state flags and curveball flags, then the capacity unit (only when a round follows). */
function settleRound(scenario, state) {
  const rs = scenario.config.roundSettlement;
  const before = snapshot(state);
  const tb = band(rs.trust, state.trust);
  const rb = band(rs.risk, state.risk);
  state.capital += tb.capital + rb.capital;
  // State and curveball flags are re-evaluated at every settlement.
  const fired = [], stateFlags = [];
  (rs.stateFlags || []).forEach((t) => {
    if (compare(state[t.meter], t.op, t.value)) { addFlag(state, t.setFlag); stateFlags.push(t.setFlag); }
    else removeFlag(state, t.setFlag);
  });
  rs.triggers.forEach((t) => {
    if (compare(state[t.meter], t.op, t.value)) { addFlag(state, t.setFlag); fired.push(t.setFlag); }
    else removeFlag(state, t.setFlag);
  });
  const last = state.round >= scenario.rounds.length;
  let returned = 0;
  if (!last && rs.capacityReturn) {
    const b = scenario.config.bounds.capacity;
    const after = clamp(state.capacity + rs.capacityReturn, b[0], b[1]);
    returned = after - state.capacity;
    state.capacity = after;
  }
  state.log.push({
    type: "settlement", round: state.round, before, after: snapshot(state), trust: tb, risk: rb,
    curveballsArmed: fired, stateFlags, capacityReturned: returned,
    flags: state.flags.slice(), flagsEver: state.flagsEver.slice(),
  });
  state.round += 1;
  state.slot = 0;
  state.routeNext = null;
  if (state.round > scenario.rounds.length) finalSettle(scenario, state);
}

function finalSettle(scenario, state) {
  const fs = scenario.config.finalSettlement;
  const before = snapshot(state);
  const ttlValue = (fs.ttlBaseline - state.ttl) * fs.ttlValuePerDay;
  state.capital += ttlValue;
  const autoResolved = [];
  Object.keys(scenario.nodes).sort().forEach((id) => {
    const n = scenario.nodes[id];
    if (!n.autoResolve) return;
    if (state.played.indexOf(id) !== -1) return;
    if (!triggerMet(state, n.trigger)) return;
    applyEffects(scenario, state, Object.assign(zeroFx(), n.autoResolve.effects));
    autoResolved.push({ id, effects: n.autoResolve.effects, note: n.autoResolve.note });
  });
  const obj = objectives(scenario, state);
  const allMet = obj.length > 0 && obj.every((o) => o.met);
  const bonus = allMet ? (fs.engineBonus || 0) : 0;
  state.capital += bonus;
  state.objectivesMet = obj.filter((o) => o.met).length;
  state.engineBonus = bonus;
  state.log.push({ type: "final", before, ttlValue, autoResolved, objectives: obj, engineBonus: bonus, after: snapshot(state) });
  state.status = "finished";
}

function choose(scenario, state, nodeId, optionKey) {
  const expected = currentNodeId(scenario, state);
  if (nodeId !== expected) throw new Error("Out of turn: expected " + expected + ", got " + nodeId);
  const node = getNode(scenario, nodeId);
  const option = node.options.find((o) => o.key === optionKey);
  if (!option) throw new Error("Unknown option " + optionKey + " on " + nodeId);
  if (optionLocked(state, option)) throw new Error("Option " + optionKey + " on " + nodeId + " is locked");
  const before = snapshot(state);
  const { fx, applied } = effectiveEffects(state, option);
  applyEffects(scenario, state, fx);
  (option.setFlags || []).forEach((f) => addFlag(state, f));
  (option.clearFlags || []).forEach((f) => removeFlag(state, f));
  if (state.played.indexOf(nodeId) === -1) state.played.push(nodeId);
  state.decisions += 1;
  state.log.push({ type: "decision", round: state.round, slot: state.slot, nodeId, optionKey, quality: option.quality, effects: fx, conditionalNotes: applied, before, after: snapshot(state) });

  if (node.kind === "inject") { state.pendingInjects.shift(); return advance(scenario, state); }
  if (option.route) state.routeNext = option.route;
  state.slot += 1;
  const round = scenario.rounds[state.round - 1];
  if (state.slot >= round.slots.length) settleRound(scenario, state);
  return advance(scenario, state);

/* ---------- sound: synthesised with WebAudio, no files ---------- */
const SOUND = (() => {
  let ctx = null, muted = STORE.get("r2r2_mute", false);
  function ac() { if (muted) return null; try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; } catch (e) { return null; } }
  function tone(f, t0, dur, type, vol, glideTo) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
  }
  function bell(f, t0, vol) { tone(f, t0, 1.6, "sine", vol || 0.18); tone(f * 2.76, t0, 0.6, "sine", (vol || 0.18) * 0.25); }
  return {
    get muted() { return muted; },
    setMuted(m) { muted = !!m; STORE.set("r2r2_mute", muted); },
    unlock() { ac(); },
    tap() { tone(660, 0, 0.05, "triangle", 0.05); },
    lock() { tone(110, 0, 0.26, "sine", 0.3, 55); tone(220, 0.02, 0.1, "square", 0.03); },
    arrive() { tone(880, 0, 0.08, "sine", 0.06); tone(1175, 0.09, 0.14, "sine", 0.06); },
    ring() { for (let i = 0; i < 2; i++) { tone(440, i * 0.5, 0.18, "square", 0.04); tone(480, i * 0.5, 0.18, "square", 0.04); } },
    gain() { [523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.35, "triangle", 0.1)); },
    loss() { [392, 330, 262].forEach((f, i) => tone(f, i * 0.11, 0.4, "sawtooth", 0.04)); },
    alarm() { for (let i = 0; i < 3; i++) { tone(880, i * 0.36, 0.17, "square", 0.06); tone(660, i * 0.36 + 0.18, 0.17, "square", 0.06); } },
    roundStart() { bell(523, 0, 0.14); bell(659, 0.18, 0.14); bell(784, 0.36, 0.16); },
    settle() { bell(659, 0, 0.14); bell(523, 0.22, 0.14); },
    award() { [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.42]].forEach(([f, t]) => { tone(f, t, 0.9, "sawtooth", 0.05); tone(f, t, 0.9, "triangle", 0.09); }); },
    tick() { tone(1400, 0, 0.03, "square", 0.04); },
    bed(seconds) { // soft two-note drone for the cold open
      const c = ac(); if (!c) return;
      [[110, 0.05], [165, 0.03], [220, 0.02]].forEach(([f, v]) => { const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(v, c.currentTime + 2); g.gain.setValueAtTime(v, c.currentTime + seconds - 3); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + seconds); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + seconds + 0.1); });
    },
  };
})();

/* ---------- modal, toast, download, QR ---------- */
function modal(html, opts) {
  const o = opts || {};
  const wrap = document.createElement("div");
  wrap.className = "modal-wrap" + (o.cls ? " " + o.cls : "");
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(o.label || "Dialog")}">${html}</div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape" && !o.sticky) close(); };
  document.addEventListener("keydown", onKey);
  wrap.addEventListener("click", (e) => { if (e.target === wrap && !o.sticky) close(); });
  const first = $("input, button, [tabindex]", wrap); if (first) setTimeout(() => first.focus(), 30);
  return { el: wrap, close };
}
function toast(msg, kind) {
  let host = $("#toasts");
  if (!host) { host = document.createElement("div"); host.id = "toasts"; host.setAttribute("aria-live", "polite"); document.body.appendChild(host); }
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => t.classList.add("out"), 3600);
  setTimeout(() => t.remove(), 4200);
}
function qrSvg(text, cell) {
  /* global qrcode */
  const q = qrcode(0, "M");
  q.addData(text, "Byte");
  q.make();
  const n = q.getModuleCount(), c = cell || 6, m = 4;
  let d = "";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) d += `M${k + m},${r + m}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" width="${(n + 2 * m) * c}" height="${(n + 2 * m) * c}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#071E2E"/></svg>`;
}
function download(name, text, type) {
  const b = new Blob([text], { type: type || "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- transport seam ----------
 * Live sync via Railway backend (with 100% offline fallback to QR and typed codes):
 * push(record) after every saveRec, pull(session) on the console. */
const SYNC = {
  enabled: true,
  url: "https://tps-simulation-production.up.railway.app/api/r2r2/sync",
  push(rec) {
    if (!this.enabled || !rec || rec.practice || !rec.session || !rec.number) return;
    try {
      fetch(this.url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session: normSession(rec.session),
          number: rec.number,
          name: rec.name || "",
          counts: rec.counts || {},
          events: rec.events || [],
          ui: rec.ui || {},
          updatedAt: rec.updatedAt || Date.now()
        })
      }).catch(() => {});
    } catch (e) { /* offline-safe */ }
  },
  pull(session) {
    if (!this.enabled || !session) return Promise.resolve([]);
    const code = normSession(session);
    if (!code) return Promise.resolve([]);
    return fetch(this.url + "?session=" + encodeURIComponent(code))
      .then((r) => (r.ok ? r.json() : []))
      .then((rows) => (Array.isArray(rows) ? rows : []))
      .catch(() => []);
  }
};

/* ---------- service worker ---------- */
function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  navigator.serviceWorker.register("./sw.js").catch(() => { /* offline-first still works from the browser cache */ });
}

      if (ring) { const c = 2 * Math.PI * 19; const frac = clampN(M.capacity / 6, 0, 1); ring.setAttribute("stroke-dasharray", `${(c * frac).toFixed(1)} ${(c * (1 - frac)).toFixed(1)}`); ring.classList.toggle("rm-cap-empty", M.capacity <= 0); }
      ORDER.forEach((k) => {
        const st = root.querySelector(`.rm-station[data-k="${k}"]`);
        const mood = inst.moods[k] || "Neutral";
        st.setAttribute("class", `rm-station rm-${MOOD[mood] || "neutral"}${inst.focus === k ? " rm-focus" : ""}`);
        const t = st.querySelector(".rm-mood"); if (t) t.textContent = mood === "Neutral" && inst.focus !== k ? "" : (inst.focus === k ? "This round" : mood);
      });
      const want = Math.round(3 + M.trust / 9);
      rails.forEach((r) => {
        const mine = inst.packets.filter((p) => p.r === r);
        for (let i = mine.length; i < want; i++) {
          const c = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          c.setAttribute("width", "3.8"); c.setAttribute("height", "3.8"); c.setAttribute("rx", "1.9"); g.appendChild(c);
          inst.packets.push({ r, c, t: Math.random(), dir: Math.random() < 0.5 ? 1 : -1, v: 0.6 + Math.random() * 0.8 });
        }
        mine.slice(want).forEach((p) => { p.c.remove(); inst.packets.splice(inst.packets.indexOf(p), 1); });
      });
      inst.packets.forEach((p, i) => {
        const bad = ((i * 37) % 100) < M.risk * 0.55;
        p.bad = bad;

      inst.packets.forEach((p) => {
        const v = p.v * speed * (p.bad ? 0.35 : 1);
        p.t += p.dir * v * dt;
        if (p.t > 1) p.t -= 1; if (p.t < 0) p.t += 1;

        p.c.setAttribute("x", (a[0] + (b[0] - a[0]) * u - 1.9).toFixed(1));
        p.c.setAttribute("y", (a[1] + (b[1] - a[1]) * u - 1.9).toFixed(1));

    inst.destroy = () => { inst.alive = false; const i = live.indexOf(inst); if (i >= 0) live.splice(i, 1); };
    live.push(inst);

    return inst;
  }
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let prev = 0;
  function loop(ts) {
    const dt = prev ? Math.min(0.1, (ts - prev) / 1000) : 0;
    prev = ts;
    if (!document.hidden && !reduce) {
      for (let i = live.length - 1; i >= 0; i--) {
        const m = live[i];
        if (!m.root.isConnected) { live.splice(i, 1); continue; }
        m.draw(dt);
      }
    }
    requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(loop);
  /** Build the moods map the station rings need from the engine's moods() output. */
  function moodsOf(scn, state) { const out = {}; ENGINE.moods(scn, state).forEach((m) => { out[m.account] = m.mood; }); return out; }
  return { mount, svg, moodsOf, STATIONS: ST, ORDER };
})();

/* Rail to Revenue v2.0: team app. State = ENGINE.replay(SCN, events). Everything is saved locally before it renders. */
"use strict";

const APP = $("#app"), HDR = $("#hdr");
const UNDO_WINDOW_MS = 30000;

let TIMER = null;

/* ---------- records ---------- */
function recKey(session, number) { return "r2r2_rec:" + normSession(session) + ":" + number; }

function loadActive() { const k = STORE.get("r2r2_active", null); if (!k) return null; const r = STORE.get(k, null); return r && r.events ? r : null; }
function newRec(o) {

    key: recKey(o.session, o.number), session: normSession(o.session), number: o.number, name: "", counts: { PLATFORM: 0, CONTROL: 0, ENABLEMENT: 0, SERVICE: 0 },
    setupDone: false, events: [], seq: 0, practice: false, restored: false,
    ui: { released: [], started: [], ack: 0, ackSet: 0, handoff: {}, shownAt: {}, sel: {}, lastLockAt: 0 },
    createdAt: Date.now(), updatedAt: Date.now(), build: BUILD.version,

}
function appendEvent(ev) {

  return full;
}
function released(r) { return REC.practice || REC.ui.released.indexOf(r) !== -1; }
function started(r) { return REC.ui.started.indexOf(r) !== -1; }
function derive() { return safeReplay(SCN, effectiveEvents(REC.events)); }
function nodeKey(state) { return state.decisions + ":" + state.presented; }
function mapPanelHTML(id, title, sub) {
  return `<div class="mappanel"><div class="maphead"><b>${esc(title)}</b><span>${esc(sub || "")}</span></div><div id="${id}" class="mapbox"></div><div class="maplegend"><span><i></i>Payments flowing (more with Partner Trust)</span><span><i class="sq"></i>Failed payments (more with Risk Exposure)</span><span>Speed follows Time-to-Live. Ring on the hub: Squad Capacity.</span></div></div>`;
}
function mountMap(id, state, focus) {

}

function renderHeader(v) {

/* ---------- render ---------- */
function render() {
  if (TIMER) { clearInterval(TIMER); TIMER = null; }
  window.scrollTo(0, 0);
  if (!REC) { renderHeader({ state: null }); return renderJoin(); }
  if (!REC.setupDone) { renderHeader({ state: null }); return renderSetup(); }
  const v = derive();
  if (v.error) console.warn("replay error", v.error);
  const st = v.state;
  const decs = decisionsOf(st), sets = settlementsOf(st);
  if (decs.length > REC.ui.ack) { renderHeader({ state: st, showDeltas: true }); return renderFeedback(st, decs[REC.ui.ack]); }
  if (sets.length > REC.ui.ackSet) { renderHeader({ state: st, label: `Round ${sets[REC.ui.ackSet].round} closed` }); return renderSettlement(st, sets[REC.ui.ackSet]); }
  renderHeader({ state: st });
  if (st.status === "finished") return renderFinal(st);
  const r = st.round;
  if (!released(r)) return r === 1 ? renderLobby(st) : renderWaiting(st);
  if (!started(r)) return renderBrief(st);
  const key = nodeKey(st);
  if (!REC.ui.handoff[key]) return renderHandoff(st);
  return renderDecision(st);
}

function confirmLock(node, k) {

  const canUndo = Date.now() - (REC.ui.lastLockAt || 0) < UNDO_WINDOW_MS && d === lastDecision(st);
  const good = (fx.capital || 0) + (fx.trust || 0) * 20000 - (fx.risk || 0) * 20000 - (fx.ttl || 0) * 15000;
  APP.innerHTML = `<div class="screen feedback">
    <div class="sheet chosen"><div class="muted small">${esc(node.title)}, locked by ${esc(fnOf(SCN, node.owner).name)}</div><p style="margin-top:.4rem"><span class="k">${d.optionKey}</span>${esc(opt.text)}</p></div>
    <div class="sheet"><h2>What happened next</h2><p class="next">${esc(opt.feedback)}</p>${d.conditionalNotes && d.conditionalNotes.length ? d.conditionalNotes.map((n) => `<p class="note">Because of an earlier decision: ${esc(n)}</p>`).join("") : ""}
      <div class="fxrow" style="margin-top:1rem">
        ${fxCell("Revenue", fx.capital, "", "higher", fmtFx)}${fxCell("Partner Trust", fx.trust, "", "higher")}${fxCell("Risk Exposure", fx.risk, "", "lower")}${fxCell("Time-to-Live", fx.ttl, " days", "lower")}${fxCell("Squad Capacity", fx.capacity, "", "higher")}
      </div></div>
    <div class="row between"><span class="undo-hint" id="undoHint">${canUndo ? "Mis-tap? A facilitator can undo this within 30 seconds." : ""}</span><div class="row">${canUndo ? `<button class="btn ghost" id="undoBtn">Facilitator: undo</button>` : ""}<button class="btn primary big" id="nextBtn">Continue</button></div></div>
  </div>`;
  if (good >= 0) SOUND.gain(); else SOUND.loss();
  $("#nextBtn").onclick = () => { REC.ui.ack += 1; saveRec(); render(); };
  const ub = $("#undoBtn"); if (ub) ub.onclick = () => undoFlow(false);
}

/* ---------- settlement ---------- */
function renderSettlement(st, s) {
  const r = SCN.rounds[s.round - 1];
  const last = s.round === SCN.rounds.length;
  const hz = horizonLines(SCN, st);
  const code = encodeResults(SCN, REC);
  const total = (s.trust.capital || 0) + (s.risk.capital || 0);
  APP.innerHTML = `<div class="screen settle">
    <div class="sheet"><div class="muted">Round ${s.round} settled, day ${r.dayEnd}</div><h1>${esc(r.title)}: the books close</h1>
      <div class="bands">
        <div class="bandrow"><span>${esc(s.trust.note)}</span><b>${esc(fmtFx(s.trust.capital))}</b></div>
        <div class="bandrow"><span>${esc(s.risk.note)}</span><b>${esc(fmtFx(s.risk.capital))}</b></div>
        ${s.capacityReturned ? `<div class="bandrow"><span>Settlement checks done. One unit of Squad Capacity returns to the sprint.</span><b>+${s.capacityReturned} unit</b></div>` : last ? `<div class="bandrow"><span>No further sprint: no capacity returns after the final round.</span><b>0</b></div>` : `<div class="bandrow"><span>The sprint is already full; no capacity to return.</span><b>0</b></div>`}
      </div>
      <p style="margin-top:.75rem"><b>Revenue after settlement: ${esc(fmtGHSfull(s.after.capital))}</b>${total ? ` (${esc(fmtFx(total))} from the bands)` : ""}</p>
    </div>
    ${mapPanelHTML("setMap", "The rails after Round " + s.round, `Trust ${s.after.trust}, Risk ${s.after.risk}, ${s.after.ttl} days, Capacity ${s.after.capacity}`)}
    ${frontPageHTML(SCN, st, s.round)}
    ${hz.length ? `<div class="sheet tight"><h3>On the horizon</h3><div class="horizon">${hz.map((h) => `<div class="h${h.positive ? " good" : ""}"><i></i><span>${esc(h.text)}</span></div>`).join("")}</div></div>` : ""}
    <div class="sheet tight"><div class="row between"><div><b>Results code</b><div class="small muted">Hold it up when the facilitator scans the room.</div></div><button class="btn ghost" id="qrBtn">Show the code</button></div></div>
    <p class="anchor">${esc(SCN.meta.anchor)}</p>
    <div class="row end"><button class="btn primary big" id="nextBtn">${last ? "See the final position" : `Ready for Round ${s.round + 1}`}</button></div>
  </div>`;
  SOUND.settle();
  mountMap("setMap", st, last ? null : roundAccount(st));
  $("#qrBtn").onclick = showResultsCode;
  $("#nextBtn").onclick = () => { REC.ui.ackSet += 1; saveRec(); render(); };
}

/* ---------- final ---------- */
function objectiveReason(o, obj, st) {
  const reasons = (o.reasons || {});
  return obj.missed.map((m) => {
    if (m.startsWith("count:")) return (reasons.count || "won the room {n} times").replace("{n}", m.split(":")[1].split("/")[0]);
    if (reasons[m]) return reasons[m].replace("{v}", st[m]);
    return m;
  }).join("; ");
}
function renderFinal(st) {
  const f = finalOf(st);
  const objs = ENGINE.objectives(SCN, st);
  const code = encodeResults(SCN, REC);
  APP.innerHTML = `<div class="screen final">
    <div class="sheet"><div class="muted">Day 90. The quarter is closed.</div><h1>Final position</h1>
      <div class="big">${esc(fmtGHSfull(st.capital))}</div>
      <div class="fxrow" style="margin-top:1rem">
        <div class="fx"><div class="lbl">Partner Trust</div><div class="val">${st.trust}</div></div>
        <div class="fx"><div class="lbl">Risk Exposure</div><div class="val">${st.risk}</div></div>
        <div class="fx"><div class="lbl">Time-to-Live</div><div class="val">${st.ttl} days</div></div>
        <div class="fx"><div class="lbl">Squad Capacity</div><div class="val">${st.capacity}</div></div>
      </div>
      <hr class="rule">
      <dl class="kv">
        <dt>Time-to-Live settlement</dt><dd>${esc(fmtFx(f.ttlValue))} (${st.ttl} days against the 120-day baseline, GHS 15,000 a day)</dd>
        ${f.autoResolved.map((a) => `<dt>Settled without a decision</dt><dd>${esc(a.note)} ${esc(fmtFx(a.effects.capital || 0))}</dd>`).join("")}
      </dl>
    </div>
    ${mapPanelHTML("finalMap", "The rails at the close", `Trust ${st.trust}, Risk ${st.risk}, ${st.ttl} days, Capacity ${st.capacity}`)}
    <div class="sheet"><h2>One team, one engine</h2><p>Your four cluster objectives, revealed. The Engine Bonus needs all four together.</p>
      <div class="objs">${objs.map((obj) => { const o = SCN.clusterObjectives.find((x) => x.cluster === obj.cluster); const fn = fnOf(SCN, obj.cluster); return `<div class="obj${obj.met ? " met" : ""}" style="--c:#${fn.colour}"><div class="own">${esc(fn.name)}</div><div class="small muted">${esc(o.title)}</div><div class="state">${obj.met ? "Met" : "Not met"}</div><div class="why">${obj.met ? esc(o.card) : esc(objectiveReason(o, obj, st))}</div></div>`; }).join("")}</div>
      <div class="bonus${st.engineBonus ? "" : " none"}" style="margin-top:1rem">${st.engineBonus ? `Engine Bonus earned: ${esc(fmtFx(st.engineBonus))}. All four clusters met their objectives together.` : `No Engine Bonus: ${st.objectivesMet} of 4 objectives met.`}</div>
    </div>
    <div class="sheet"><h2>Results code</h2><p>Hold this up for the facilitator's scan. It is the whole quarter in one code.</p><div class="qrbox">${qrSvg(code, 6)}</div><details><summary>Type it instead</summary><p class="typedcode">${esc(typedResults(code).match(/.{1,4}/g).join(" "))}</p></details></div>
    <p class="anchor">${esc(SCN.meta.anchor)}</p>
    <div class="row end"><button class="btn ghost" id="dlBtn">Download the decision log</button></div>
  </div>`;
  mountMap("finalMap", st, null);
  $("#dlBtn").onclick = downloadLog;
}

/* ---------- lifeline, codes, undo ---------- */
function askCoach() {
  const v = derive(); const st = v.state;
  const l = SCN.config.lifelines.askTheCoach;
  if (st.status !== "playing") { toast("The quarter is closed.", "bad"); return; }
  if (st.lifelinesUsed >= l.perTeam) { toast("Both lifelines are used.", "bad"); return; }
  const m = modal(`<h2>Ask the Coach</h2><p>${esc(l.rule)}</p><p>Cost ${esc(fmtGHSfull(l.cost))} from Revenue. ${l.perTeam - st.lifelinesUsed} of ${l.perTeam} left.</p>
    <div class="row end"><button class="btn ghost" id="lNo">Not now</button><button class="btn primary" id="lYes">Use a lifeline</button></div>`, { label: "Ask the Coach" });
  $("#lNo", m.el).onclick = m.close;
  $("#lYes", m.el).onclick = () => {
    m.close(); appendEvent({ type: "lifeline" }); SOUND.tap();
    modal(`<h2>Raise a hand</h2><p>A cluster coach is coming to the table for 60 seconds. Show them this decision ID:</p><p class="code-in" style="font-size:36px">${esc(st.presented || "")}</p><div class="row end"><button class="btn primary" onclick="this.closest('.modal-wrap').remove()">Done</button></div>`, { label: "Coach" });
    render();
  };
}
function codeModal() {
  const m = modal(`<h2>Enter a facilitator code</h2><p>Round release, curveball or undo codes are four digits.</p>
    <div class="field"><input id="fCode" class="code-in" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code"></div><div class="err" id="fErr" role="alert"></div>
    <div class="row end"><button class="btn ghost" id="fNo">Cancel</button><button class="btn primary" id="fGo">Apply</button></div>`, { label: "Facilitator code" });
  $("#fNo", m.el).onclick = m.close;
  const go = () => { const r = applyFacilitatorCode($("#fCode", m.el).value); if (r.ok) { m.close(); toast(r.msg, "good"); render(); } else $("#fErr", m.el).textContent = r.msg; };
  $("#fGo", m.el).onclick = go;
  $("#fCode", m.el).addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}
function applyFacilitatorCode(raw) {
  const code = String(raw || "").replace(/\D/g, "");
  if (code.length !== 4) return { ok: false, msg: "Codes are four digits." };
  const c = codesFor();
  const rel = Object.keys(c.release).find((r) => c.release[r] === code);
  if (rel) { if (!released(+rel)) REC.ui.released.push(+rel); saveRec(); return { ok: true, msg: `Round ${rel} is open.` }; }
  const inj = Object.keys(c.inject).find((i) => c.inject[i] === code);
  if (inj) {
    const st = derive().state;
    if (st.status !== "playing") return { ok: false, msg: "The quarter is closed." };
    if (st.played.indexOf(inj) !== -1 || st.pendingInjects.indexOf(inj) !== -1) return { ok: false, msg: "That curveball has already arrived." };
    appendEvent({ type: "inject", injectId: inj }); SOUND.alarm();
    return { ok: true, msg: "A live development arrives after your current decision." };
  }
  if (code === c.undo) { undoFlow(true); return { ok: true, msg: "Undo authorised." }; }
  return { ok: false, msg: "That code is not for this session." };
}
function undoFlow(preAuthorised) {
  const v = derive(); const st = v.state;
  const last = effectiveEvents(REC.events).filter((e) => e.type === "choose").slice(-1)[0];
  if (!last) { toast("There is nothing to undo.", "bad"); return; }
  if (!preAuthorised && Date.now() - (REC.ui.lastLockAt || 0) > UNDO_WINDOW_MS) { toast("The 30-second window has passed. Ask the facilitator for the undo code.", "bad"); return; }
  const doUndo = () => {
    appendEvent({ type: "void", targetId: last.id });
    const st2 = derive().state;
    REC.ui.ack = Math.min(REC.ui.ack, decisionsOf(st2).length);
    REC.ui.ackSet = Math.min(REC.ui.ackSet, settlementsOf(st2).length);
    REC.ui.handoff[nodeKey(st2)] = true; REC.ui.shownAt[nodeKey(st2)] = Date.now(); delete REC.ui.sel[nodeKey(st2)];
    saveRec(); toast("The last decision was undone.", "good"); render();
  };
  if (preAuthorised) { doUndo(); return; }
  const m = modal(`<h2>Undo the last decision</h2><p>The facilitator enters the undo code or the PIN. The table then decides again.</p>
    <div class="field"><input id="uCode" class="code-in" autocomplete="off" autocapitalize="characters" aria-label="Undo code or PIN"></div><div class="err" id="uErr"></div>
    <div class="row end"><button class="btn ghost" id="uNo">Cancel</button><button class="btn primary" id="uGo">Undo</button></div>`, { label: "Undo" });
  $("#uNo", m.el).onclick = m.close;
  $("#uGo", m.el).onclick = () => { const val = $("#uCode", m.el).value.trim(); if (val.replace(/\D/g, "") === codesFor().undo || pinOk(val)) { m.close(); doUndo(); } else $("#uErr", m.el).textContent = "That is not the undo code or the PIN."; };
}

/* ---------- menu and utilities ---------- */
function openMenu() {
  const st = derive().state;
  const m = modal(`<h2>Menu</h2><div class="stack">
    <button class="btn wide" id="mCoach">Ask the Coach (${SCN.config.lifelines.askTheCoach.perTeam - st.lifelinesUsed} left)</button>
    <button class="btn ghost wide" id="mCode">Enter a facilitator code</button>
    <button class="btn ghost wide" id="mQr">Show our results code</button>
    <button class="btn ghost wide" id="mUndo">Undo the last decision</button>
    <button class="btn ghost wide" id="mRules">How the quarter works</button>
    <button class="btn ghost wide" id="mMute">${SOUND.muted ? "Turn sound on" : "Turn sound off"}</button>
    <button class="btn ghost wide" id="mLog">Download the decision log</button>
    <button class="btn quiet wide" id="mLeave">Leave this team</button>
    <a class="btn quiet wide" href="../index.html" style="text-align:center;text-decoration:none">&larr; Back to TPS Course Hub</a>
    </div><div class="row end"><button class="btn quiet" id="mClose">Close</button></div><p class="stamp">Build ${esc(BUILD.version)}, table ${REC.number}${REC.practice ? ", practice run" : ""}</p>`, { label: "Menu" });
  const wrap = (fn) => () => { m.close(); fn(); };
  $("#mClose", m.el).onclick = m.close;
  $("#mCoach", m.el).onclick = wrap(askCoach);
  $("#mCode", m.el).onclick = wrap(codeModal);
  $("#mQr", m.el).onclick = wrap(showResultsCode);
  $("#mUndo", m.el).onclick = wrap(() => undoFlow(false));
  $("#mRules", m.el).onclick = wrap(rulesModal);
  $("#mMute", m.el).onclick = wrap(() => { SOUND.setMuted(!SOUND.muted); toast(SOUND.muted ? "Sound off." : "Sound on."); });
  $("#mLog", m.el).onclick = wrap(downloadLog);
  $("#mLeave", m.el).onclick = wrap(leaveFlow);
}
function rulesModal() {
  modal(`<h2>How the quarter works</h2>
    <p>Five rounds, three decisions each, 15 in all. Every decision lands on one cluster's desk; the table discusses, the Decision Owner locks. Sixty seconds to discuss, two minutes to decide. Nothing submits by itself.</p>
    <p><b>Revenue</b> is what the squad earns or protects. <b>Partner Trust</b> at 70 or above adds GHS 250,000 at each settlement; below 40 removes it. <b>Risk Exposure</b> at 45 costs money and at 60 brings the regulator. <b>Time-to-Live</b> is worth GHS 15,000 a day below 120 at the end. <b>Squad Capacity</b> is Technology and Operations time: builds spend it, each settlement returns one unit, and an option locks when you cannot pay.</p>
    <p>Choices set things in motion. Some return as echoes; high Risk, low Trust, low Revenue or an empty sprint bring curveballs. Anything armed but never decided settles by itself at the end.</p>
    <p>Each cluster has a secret objective on its role card. Meet all four and the team earns the Engine Bonus of GHS 250,000.</p>
    <div class="row end"><button class="btn primary" onclick="this.closest('.modal-wrap').remove()">Close</button></div>`, { label: "Rules" });
}
function showResultsCode() {
  const code = encodeResults(SCN, REC);
  modal(`<h2>Results code</h2><p>The facilitator scans this to put your table on the leaderboard.</p><div class="qrbox">${qrSvg(code, 7)}</div>
    <details><summary>Type it instead</summary><p class="typedcode">${esc(typedResults(code).match(/.{1,4}/g).join(" "))}</p></details>
    <div class="row end"><button class="btn primary" onclick="this.closest('.modal-wrap').remove()">Close</button></div>`, { label: "Results code" });
}
function downloadLog() {
  const out = { kind: "rail-to-revenue-team-log", scenarioVersion: SCN.meta.version, build: BUILD.version, session: REC.session, team: REC.number, name: REC.name, counts: REC.counts, exportedAt: new Date().toISOString(), events: REC.events };
  download(`R2R2_${normSession(REC.session)}_Team${REC.number}.json`, JSON.stringify(out, null, 1));
}
function leaveFlow() {
  const m = modal(`<h2>Leave this team</h2><p>The device forgets which table it belongs to. The table's log stays on this device unless you tick the box.</p>
    <label class="row"><input type="checkbox" id="wipe"> <span>Also delete every Rail to Revenue log on this device (needs the PIN)</span></label>
    <div class="field" id="pinField" hidden><label for="lPin">Facilitator PIN</label><input id="lPin" autocomplete="off" autocapitalize="characters"></div><div class="err" id="lErr"></div>
    <div class="row end"><button class="btn ghost" id="lNo">Stay</button><button class="btn" id="lGo">Leave</button></div>`, { label: "Leave" });
  $("#wipe", m.el).onchange = (e) => { $("#pinField", m.el).hidden = !e.target.checked; };
  $("#lNo", m.el).onclick = m.close;
  $("#lGo", m.el).onclick = () => {
    if ($("#wipe", m.el).checked) {
      if (!pinOk($("#lPin", m.el).value)) { $("#lErr", m.el).textContent = "That PIN is not right."; return; }
      STORE.keys("r2r2_").forEach((k) => STORE.del(k));
    } else STORE.del("r2r2_active");
    m.close(); REC = null; render();
  };
}
function restoreFlow() {
  const m = modal(`<h2>Continue a team</h2><p>For a team moving to a new device. Open "Show our results code" on the old device, or ask the facilitator for the table's code.</p>
    <div class="field"><label for="rSess">Session code</label><input id="rSess" value="${esc(STORE.get("r2r2_lastSession", ""))}" autocapitalize="characters"></div>
    <div class="field"><label for="rCode">Results code</label><input id="rCode" autocapitalize="characters" spellcheck="false" placeholder="R2R2|..."></div>
    <div class="err" id="rErr" role="alert"></div>
    <div class="row end"><button class="btn ghost" id="rBack">Back</button><button class="btn primary" id="rGo">Continue the team</button></div>`, { label: "Continue a team" });
  $("#rBack", m.el).onclick = m.close;
  $("#rGo", m.el).onclick = () => {
    const sess = $("#rSess", m.el).value.trim().toUpperCase();
    let d;
    try { d = decodeResults(SCN, $("#rCode", m.el).value.replace(/\s+/g, "")); } catch (e) { $("#rErr", m.el).textContent = e.message; return; }
    if (d.fingerprint !== sessionFingerprint(sess)) { $("#rErr", m.el).textContent = "That code belongs to a different session."; return; }
    const evs = d.events.map((e, i) => Object.assign({}, e, { id: uuid(), seq: i + 1, at: Date.now() - 60000 }));
    let st;
    try { st = ENGINE.replay(SCN, evs); } catch (e) { $("#rErr", m.el).textContent = "The code does not replay cleanly: " + e.message; return; }
    const r = newRec({ session: sess, number: d.number, name: d.name || "", counts: d.counts, setupDone: !!d.name, events: evs, seq: evs.length, restored: true });
    r.ui.ack = decisionsOf(st).length; r.ui.ackSet = settlementsOf(st).length;
    for (let i = 1; i < st.round; i++) { r.ui.released.push(i); r.ui.started.push(i); }
    for (let i = st.round; i <= d.released; i++) r.ui.released.push(i);
    if (st.status === "playing" && decisionsOf(st).some((x) => x.round === st.round)) { if (r.ui.released.indexOf(st.round) === -1) r.ui.released.push(st.round); r.ui.started.push(st.round); }
    REC = r; saveRec(); STORE.set("r2r2_lastSession", sess); m.close(); render();
    toast(`Table ${d.number} continues on this device.`, "good");
  };
}
function practiceFlow() {
  const m = modal(`<h2>Faculty practice run</h2><p>A full quarter on this device with every round open. Nothing is shared.</p>
    <div class="field"><label for="pPin">Facilitator PIN</label><input id="pPin" autocomplete="off" autocapitalize="characters"></div><div class="err" id="pErr"></div>
    <div class="row end"><button class="btn ghost" id="pBack">Back</button><button class="btn primary" id="pGo">Start practice</button></div>`, { label: "Practice run" });
  $("#pBack", m.el).onclick = m.close;
  $("#pGo", m.el).onclick = () => {
    if (!pinOk($("#pPin", m.el).value)) { $("#pErr", m.el).textContent = "That PIN is not right."; return; }
    m.close(); SOUND.unlock();
    REC = newRec({ session: "PRACTICE", number: 0, practice: true, key: "r2r2_rec:PRACTICE:" + Date.now(), name: "Practice table", setupDone: true, counts: { PLATFORM: 1, CONTROL: 1, ENABLEMENT: 1, SERVICE: 1 } });
    saveRec(); render();
  };
}

/* ---------- boot ---------- */
function boot() {
  document.body.classList.add("team");
  REC = loadActive();
  if (REC && !REC.ui.sel) REC.ui.sel = {};
  render();
  registerSW();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && REC) render(); });
  // Codes typed while the session is offline still work: nothing here needs the network.
}
boot();

</script>
