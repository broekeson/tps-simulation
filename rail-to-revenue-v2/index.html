 clients promised a salary run through Adepa at month-end. Nineteen days. Your Legal says done, your Operations says UAT next month, your Finance wants a fee before anything moves. Nobody has given me a date. Squad: The usual run from signature to live is about 45 days. Yao Dzansi: Then say so and we stay bilateral. Give me a date.","mediumLabel":"Incoming call"},"N4.2a":{"id":"N4.2a","kind":"branch","round":4,"title":"Two Failed Test Cases","owner":"PLATFORM","ownerDept":"Technology","accounts":["ADEPA"],"engineStage":"activation","skills":["arg","sales_courage","closing_plan"],"ccp":"A33","medium":"ticket","from":"kwesi","subject":"Ticket #4590: Adepa UAT, 38 of 40","situation":"Adepa UAT: 38 of 40 test cases pass. Failed: reversal message format, case 31, and timeout handling, case 37. Adepa's developers say the fixes need a week they do not have. The CAB sits in six days and needs a certification report. The Executive Office has already told Adepa 'month-end'. Technology, what goes in the report?","data":[{"label":"Test cases","value":"38 of 40 pass","evidence":"A","source":"game figure"},{"label":"Failing","value":"Reversal message format; timeout handling","evidence":"A","source":"game figure"},{"label":"Sequence","value":"CAB convened after certification","evidence":"C","source":"GhIPSS onboarding chain"},{"label":"Days to payday","value":"12","evidence":"A","source":"game figure"}],"question":"What does Technology put in the certification report?","options":[{"key":"A","text":"Certify now with a waiver on both cases and fix them in production during the first week of live traffic.","effects":{"capital":300000,"trust":3,"risk":14,"ttl":-10,"capacity":0},"feedback":"The CAB approves on the report. The first live reversal fails on day two, in front of a corporate client's payroll team.","setFlags":["cert_waiver"]},{"key":"B","text":"Send Adepa the failure log and wait for its fix, and tell the CAB that the report follows once the fix lands.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":10,"capacity":0},"feedback":"Adepa's fix takes nine days. The CAB slot is gone, and the next one is after month-end."},{"key":"C","text":"Pair Adepa's developers with our Application Specialist for two days and retest both cases, one capacity unit.","effects":{"capital":200000,"trust":6,"risk":-4,"ttl":-5,"capacity":-1},"feedback":"Both cases pass on the retest. Kwesi's two days cost a unit and saved a week, and Adepa's team learned the formats.","capacityCost":1,"requires":[{"meter":"capacity","op":">=","value":1,"reason":"Locked: this needs 1 capacity unit and the squad has fewer. Settlement returns one unit."}]},{"key":"D","text":"Drop the two failing transaction types from the go-live scope, certify the rest, and add them in a later release.","effects":{"capital":100000,"trust":1,"risk":2,"ttl":-5,"capacity":0},"feedback":"Salaries go live without reversals. The first mistaken payment has to be fixed by phone, and Adepa asks when release two is."}],"mediumLabel":"Service ticket"},"N4.2b":{"id":"N4.2b","kind":"branch","round":4,"title":"No Fee, No Go-Live","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"engineStage":"activation","skills":["negotiation","value_prop"],"ccp":"A33","medium":"email","from":"selorm","subject":"Adepa joining fee","situation":"Certification is nine days away. Finance collects the one-time joining fee before go-live. Adepa's finance team says it cannot pay without a purchase order, and its PO cycle is three weeks. Yao Dzansi has asked whether we really intend to hold three salary runs for an administrative fee. I need a position to send back today.","data":[{"label":"Joining fee","value":"One-time administrative fee, collected before go-live","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Amount","value":"GHS 50,000","evidence":"A","source":"game figure"},{"label":"Deferred transaction revenue once live","value":"About GHS 10,000 a day","evidence":"A","source":"game figure"},{"label":"Adepa PO cycle","value":"Three weeks","evidence":"A","source":"game figure"}],"question":"What does Finance decide?","options":[{"key":"A","text":"Hold go-live until the fee clears, exactly as the policy says, and let Adepa's purchase order cycle set the live date.","effects":{"capital":-150000,"trust":-6,"risk":-2,"ttl":12,"capacity":0},"feedback":"Policy holds. Go-live moves three weeks for GHS 50,000, and Yao's month-end promise to three corporates moves with it.","setFlags":["date_promised"]},{"key":"B","text":"Invoice now, take a signed payment undertaking from Adepa's CFO, go live at certification, suspend if unpaid in 14 days.","effects":{"capital":250000,"trust":6,"risk":-2,"ttl":-10,"capacity":0},"feedback":"The undertaking is signed in a day. Adepa pays on day nine, and the policy now has a route for PSPs with slow PO cycles."},{"key":"C","text":"Waive the joining fee for Adepa to hit the date, and recover it later through transaction volume once it is live.","effects":{"capital":300000,"trust":5,"risk":5,"ttl":-8,"capacity":0},"feedback":"Adepa goes live on time and pays nothing. Two other PSPs in the pipeline ask for the same arrangement by Friday.","setFlags":["waiver"]},{"key":"D","text":"Ask the Sponsor to approve go-live before payment, and settle the fee in the first month's billing run instead of now.","effects":{"capital":150000,"trust":3,"risk":3,"ttl":-8,"capacity":0},"feedback":"The Sponsor approves. The fee is paid a month late, and the exception lives in an email rather than in the policy."}],"mediumLabel":"Email"},"N4.2c":{"id":"N4.2c","kind":"branch","round":4,"title":"Betting Winnings at Scale","owner":"CONTROL","ownerDept":"ERC, Fraud Management and Cybersecurity","accounts":["ADEPA"],"engineStage":"activation","skills":["time_management","arg"],"ccp":"A33","medium":"memo","from":"efua","subject":"A step on the path nobody owns","situation":"The critical path map shows a step nobody owns: no one has checked Adepa's AML/CFT programme. Its clients include two betting operators and a remittance firm, so payouts will include betting winnings and inbound remittances at scale. Fraud and Cybersecurity are not part of onboarding today. The CAB slot is booked for day 14. Control, is this a gate or not?","data":[{"label":"Fraud and Cybersecurity","value":"Not involved in onboarding today","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Adepa's clients","value":"Two betting operators, one remittance firm","evidence":"A","source":"game figure"},{"label":"Licence","value":"Valid, issued by the regulator","evidence":"A","source":"game figure"},{"label":"Adepa's AML/CFT programme","value":"Unknown","evidence":"U","source":null}],"question":"What does Control decide?","options":[{"key":"A","text":"Compliance runs participant due diligence in three days while Fraud sets monitoring rules and limits for betting.","effects":{"capital":200000,"trust":4,"risk":-8,"ttl":-3,"capacity":0},"feedback":"Due diligence finds a gap in Adepa's sanctions screening, fixed in two days. Monitoring rules are live before the first payout.","setFlags":["fraud_handled"]},{"key":"B","text":"Rely on the regulator's licence as the check, proceed to the CAB, and schedule a programme review after go-live.","effects":{"capital":300000,"trust":3,"risk":6,"ttl":-6,"capacity":0},"feedback":"The CAB approves. The review after go-live finds the same screening gap, with three weeks of payouts already through it.","setFlags":["licence_only"]},{"key":"C","text":"Run full enhanced due diligence with an on-site audit of Adepa before certification, which takes about three weeks.","effects":{"capital":-150000,"trust":-5,"risk":-6,"ttl":15,"capacity":0},"feedback":"Thorough, and the audit finishes after payday. Adepa's clients run their salaries through a bank this month."},{"key":"D","text":"Ask Adepa to self-certify its AML/CFT programme by letter, and file the letter with the onboarding pack for the CAB.","effects":{"capital":250000,"trust":1,"risk":12,"ttl":-4,"capacity":0},"feedback":"The letter arrives in an hour and says everything is fine. It is the only evidence in the file when somebody asks.","setFlags":["unscreened"]}],"mediumLabel":"Internal memo"},"N4.2d":{"id":"N4.2d","kind":"branch","round":4,"title":"Escort Required","owner":"SERVICE","ownerDept":"Shared Services (visitor management)","accounts":["ADEPA"],"engineStage":"activation","skills":["time_management","revenue_engine"],"ccp":"A33","medium":"log","from":"frontdesk","subject":"Front desk log, 16:40","situation":"Adepa Pay's two engineers need access to the data-centre floor tomorrow from 08:00 to configure their connection with our team. Visitor management: security clearance takes five working days, and the request arrived today. Tomorrow's escort roster has one trained escort, already assigned to the auditors. Technology says the connectivity window cannot move without losing a week.","data":[{"label":"Clearance","value":"Five working days; request received today","evidence":"A","source":"game figure"},{"label":"Escort roster tomorrow","value":"One trained escort, assigned to the auditors","evidence":"A","source":"game figure"},{"label":"ISMS Governance","value":"Reviews participants' information security","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Connectivity window","value":"Tomorrow, or plus one week","evidence":"A","source":"game figure"}],"question":"What does visitor management do?","options":[{"key":"A","text":"Issue day passes at reception tomorrow and let Technology sign the engineers in and out, with no escort at all.","effects":{"capital":250000,"trust":3,"risk":14,"ttl":-8,"capacity":0},"feedback":"The connection is up by lunchtime. The visitor log shows two unescorted outsiders on the floor for four hours.","setFlags":["unescorted"]},{"key":"B","text":"Insist on the five-day clearance process exactly as written, and move the connectivity window back by one week.","effects":{"capital":-150000,"trust":-5,"risk":-3,"ttl":12,"capacity":0},"feedback":"The process is followed. A week is lost on the path to payday, and Yao's next call is to the Sponsor."},{"key":"C","text":"Configure the connection remotely with Technology on a screen-share, and keep any physical access for next week.","effects":{"capital":50000,"trust":1,"risk":1,"ttl":-2,"capacity":0},"feedback":"Most of the configuration works remotely. One switch setting needs hands on the floor, and that waits for the clearance."},{"key":"D","text":"Fast-track the clearance tonight with ISMS sign-off, and pull a second trained escort from Shared Services.","effects":{"capital":200000,"trust":6,"risk":-2,"ttl":-8,"capacity":0},"feedback":"ISMS signs at 18:30. Both engineers are badged and escorted at 08:00, and the connection is up by lunchtime.","setFlags":["host_win_4"]}],"mediumLabel":"Front desk log"},"N4.3":{"id":"N4.3","kind":"default","round":4,"title":"Live, But Not Flowing","owner":"PLATFORM","ownerDept":"Technology","accounts":["ADEPA"],"engineStage":"activation","skills":["negotiation","objection","value_prop"],"ccp":"A31","medium":"letter","from":"wallet_ops","subject":"Posting of Adepa Pay credits","situation":"Dear GhIPSS Operations. Since Adepa Pay went live, credits from Adepa to our customers have been queued for posting within the day rather than instantly. We note that under the receiver-pays model our company now pays GhIPSS a fee on flows that previously reached us bilaterally at no cost. We will review the posting schedule at our next operations meeting. Yours faithfully, Head of Operations.","data":[{"label":"Mechanism","value":"Instant payment fees are charged to the receiving institution","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"PSP push transactions","value":"Carry no GhIPSS fee for the PSP","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Stated reason","value":"The posting schedule","evidence":"A","source":"game figure"},{"label":"Likely motive","value":"Lost bilateral income now replaced by a GIP cost","evidence":"A","source":"game figure"}],"question":"What does Technology do?","options":[{"key":"A","text":"Complain to the regulator that the provider is degrading an instant payment rail in breach of its participation terms.","effects":{"capital":-200000,"trust":-9,"risk":8,"ttl":5,"capacity":0},"feedback":"The regulator asks both parties for submissions. Posting stays slow for six weeks while the letters go back and forth."},{"key":"B","text":"Offer the provider a temporary fee rebate on Adepa flows until its posting schedule returns to instant for everyone.","effects":{"capital":250000,"trust":3,"risk":2,"ttl":-2,"capacity":0},"feedback":"Posting returns to instant within a day. The rebate has no end date, and the next provider with a grievance has a precedent.","setFlags":["waiver"]},{"key":"C","text":"Meet the provider with data on inbound value reaching its customers, and agree a posting service level with a review.","effects":{"capital":200000,"trust":7,"risk":-4,"ttl":-4,"capacity":0},"feedback":"The data shows GHS 2.1m a week landing in the provider's wallets. Instant posting resumes with a service level and a quarterly review.","setFlags":["slow_poster_fixed"]},{"key":"D","text":"Leave Adepa to settle the matter bilaterally with the provider, since the commercial relationship belongs to them.","effects":{"capital":-100000,"trust":-5,"risk":1,"ttl":8,"capacity":0},"feedback":"Adepa has no leverage and says so. Its corporate clients ask why wallet payouts take all day on GhIPSS."}],"mediumLabel":"Letter"},"N5.1":{"id":"N5.1","kind":"default","round":5,"title":"Three Asks, One Sprint","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["NYEP","ABUSUA","LENDING"],"engineStage":"growth","skills":["time_management","meddicc","closing_plan"],"ccp":"A28","medium":"memo","from":"sponsor","subject":"Next quarter's capacity","situation":"Next quarter's Technology and Operations capacity is wanted three times over: the NYEP scale-up to three more regions, the retailer real-time API for five more merchants, and the GhanaPay lending integration for 14 banks. The sprint holds two of the three. Each partner has written to the Sponsor. The Executive Office recommends the allocation by Friday.","data":[{"label":"Asks","value":"Three; the sprint holds two","evidence":"A","source":"game figure"},{"label":"NYEP scale-up","value":"About GHS 540,000 a year at GHS 0.50 a disbursement","evidence":"A","source":"game figure"},{"label":"Retailer API","value":"Five merchants waiting, about GHS 40,000 a quarter each","evidence":"A","source":"game figure"},{"label":"Lending","value":"14 banks aligned; scoring and repayment unresolved","evidence":"C","source":"GhIPSS case 4"}],"question":"What does the Executive Office recommend?","options":[{"key":"A","text":"Spread the capacity evenly across all three so that every partner sees progress, and extend every delivery date.","effects":{"capital":-100000,"trust":1,"risk":4,"ttl":10,"capacity":0},"feedback":"Everyone gets a third of an engineer. Nothing ships in the quarter, and three partners each have a reason to call the Sponsor."},{"key":"B","text":"Rank by revenue at stake and readiness evidence, fund the top two, and give the third a dated start next quarter.","effects":{"capital":250000,"trust":5,"risk":-3,"ttl":-6,"capacity":0},"feedback":"The ranking is written down with its evidence. The third partner gets a date it can plan around, and nobody escalates."},{"key":"C","text":"Fund whichever partner escalates loudest to the Sponsor, since that is the one most likely to leave the rail.","effects":{"capital":300000,"trust":-6,"risk":6,"ttl":5,"capacity":0},"feedback":"The loudest partner wins. The other two learn the lesson and escalate next time, and the quieter revenue walks."},{"key":"D","text":"Hire contractors for all three, returning two capacity units to the sprint at a cost against this quarter's revenue.","effects":{"capital":-300000,"trust":4,"risk":3,"ttl":-8,"capacity":2},"feedback":"The contractors arrive in week three. All three asks move, the budget line takes the hit, and knowledge leaves when they do."}],"mediumLabel":"Internal memo"},"N5.2":{"id":"N5.2","kind":"spine","round":5,"title":"Central or Bank-Led?","owner":"CONTROL","ownerDept":"Finance and Strategy, Legal and ERC","accounts":["LENDING","MERIDIAN"],"engineStage":"growth","skills":["meddicc","negotiation","stakeholder_map"],"ccp":"A28","medium":"memo","mediumLabel":"Board paper","from":"selorm","subject":"GhanaPay microcredit: credit scoring","situation":"The banks agree GhanaPay should offer microcredit. They are split on scoring: eight want a central GhIPSS credit score so that a borrower is scored once; six say credit risk frameworks are their own and will integrate their own engines. Loan stacking across banks is the shared fear. Repayment collection is a separate paper. The forum meets Friday. Recommendation required.","data":[{"label":"Banks","value":"Aligned on microcredit through GhanaPay; scoring and automatic repayment open","evidence":"C","source":"GhIPSS case 4, 14 Oct"},{"label":"Positions","value":"Eight for a central score, six against","evidence":"A","source":"game figure"},{"label":"ScoreBridge Analytics","value":"Offers a central engine on revenue share","evidence":"A","source":"game figure"},{"label":"Loan-stacking exposure across banks","value":"Unknown","evidence":"U","source":null}],"question":"What does the paper recommend?","options":[{"key":"A","text":"A shared borrower register with minimum standards to stop loan stacking, while each bank keeps its own engine.","effects":{"capital":250000,"trust":8,"risk":-5,"ttl":-4,"capacity":0},"feedback":"Both camps can say yes: the banks keep their engines and GhIPSS runs the register. The forum spends its time on repayment.","route":"N5.3a","setFlags":["register"]},{"key":"B","text":"A central GhIPSS credit score for every bank, built with ScoreBridge Analytics on a revenue-share basis from day one.","effects":{"capital":350000,"trust":-6,"risk":8,"ttl":-2,"capacity":0},"feedback":"The eight banks applaud. Six heads of risk sign a letter before the forum, and Meridian's name is near the top of it.","route":"N5.3b","setFlags":["central_push"]},{"key":"C","text":"Bank-led only: each bank integrates its own scoring engine through one standard GhanaPay lending API and nothing more.","effects":{"capital":100000,"trust":3,"risk":0,"ttl":2,"capacity":0},"feedback":"Every bank keeps its framework, and all fourteen want to present theirs at Friday's forum. The events desk has a room to find.","route":"N5.3c"},{"key":"D","text":"Defer the scoring decision until repayment collection is solved, and take only the repayment paper to Friday's forum.","effects":{"capital":-150000,"trust":-3,"risk":-2,"ttl":12,"capacity":0},"feedback":"Friday's forum is about one paper. The banks ask when scoring will be decided, and Okyeame's champion looks tired.","route":"N5.3c"}]},"N5.3a":{"id":"N5.3a","kind":"branch","round":5,"title":"Collect Without Asking?","owner":"PLATFORM","ownerDept":"Technology, with Legal","accounts":["LENDING","NYEP"],"engineStage":"growth","skills":["value_prop","customer_empathy"],"ccp":"A31","medium":"memo","mediumLabel":"Design note","from":"kwesi","subject":"Repayment collection from wallets","situation":"Lenders want repayments collected from GhanaPay wallets without chasing. Four designs are on the table. Legal's note: a debit the customer did not agree to in advance is a dispute waiting to happen, and NYEP stipends will be sitting in some of these wallets on payday. Technology, with Legal, picks the collection design that goes to the forum.","data":[{"label":"Automatic repayment","value":"Open decision among the banks","evidence":"C","source":"GhIPSS case 4"},{"label":"Wallet limits","value":"Low, Medium and High","evidence":"C","source":"GhIPSS GhanaPay FAQ"},{"label":"Stipends","value":"In some wallets on payday","evidence":"A","source":"game figure"},{"label":"Dispute volume under each design","value":"Unknown","evidence":"U","source":null}],"question":"Which collection design goes to the forum?","options":[{"key":"A","text":"Debit the full repayment from any wallet balance on the due date, and notify the lender of any shortfall at once.","effects":{"capital":300000,"trust":-8,"risk":12,"ttl":-4,"capacity":0},"feedback":"Collections are excellent for a month. Then the disputes arrive, and a consumer group writes to the regulator."},{"key":"B","text":"Sweep a share of the next inflow into the wallet, including NYEP stipends, until the instalment is covered in full.","effects":{"capital":250000,"trust":-5,"risk":9,"ttl":-2,"capacity":0},"feedback":"Collections rise. So does a radio story about young people whose stipend arrived short, with GhanaPay's name in it.","setFlags":["stipend_sweep"]},{"key":"C","text":"A mandate captured at loan origination, auto-debit on the due date, partial-collection rules and a dispute route.","effects":{"capital":200000,"trust":7,"risk":-5,"ttl":-3,"capacity":0},"feedback":"The banks accept it because their lawyers do. Collection rates hold, and disputes have somewhere to go.","setFlags":["mandate_design"]},{"key":"D","text":"Request-to-pay prompts only on the due date, with the lender chasing anything still unpaid after three prompts.","effects":{"capital":0,"trust":3,"risk":-2,"ttl":4,"capacity":0},"feedback":"Consent is clean and collections are weak. Two banks say they will lend less than planned until collection improves."}]},"N5.3b":{"id":"N5.3b","kind":"branch","round":5,"title":"Six Banks Say No","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["LENDING","MERIDIAN"],"engineStage":"growth","skills":["objection","active_listening","negotiation"],"ccp":"A31","medium":"letter","from":"bankrisk","subject":"Proposal for a central credit score","situation":"Dear Sponsor. The undersigned heads of risk of six GhanaPay participant banks note the proposal for a central GhIPSS credit score. Credit risk frameworks are the responsibility of each licensed bank and its board. We will not delegate them to a switch. We remain supportive of GhanaPay lending and will attend Friday's forum. Yours faithfully, six heads of risk.","data":[{"label":"Banks objecting","value":"Six of 14","evidence":"A","source":"game figure"},{"label":"Stated position","value":"Credit frameworks belong to each bank","evidence":"A","source":"game figure"},{"label":"Their interest behind the position","value":"Unknown","evidence":"U","source":null},{"label":"Meridian","value":"Among the six, if it was bypassed on the stipends","evidence":"A","source":"game figure"}],"question":"What does the Executive Office do before Friday?","options":[{"key":"A","text":"Press on with the central score; the eight banks in favour are a majority, and the six will follow once it works.","effects":{"capital":-200000,"trust":-10,"risk":6,"ttl":5,"capacity":0},"feedback":"The six do not follow. Two of them pause their GhanaPay lending plans, and Friday's forum is about the letter."},{"key":"B","text":"Drop the lending proposal from Friday's agenda, and return to it next year once the banks agree among themselves.","effects":{"capital":-250000,"trust":-3,"risk":-3,"ttl":12,"capacity":0},"feedback":"The forum goes ahead without its main item. Okyeame's champion asks, politely, what GhIPSS is for."},{"key":"C","text":"Ask the regulator to mandate a central score for every GhanaPay lender, so that the six have no choice in the matter.","effects":{"capital":250000,"trust":-8,"risk":8,"ttl":2,"capacity":0},"feedback":"The regulator declines to referee a commercial design. The six banks now know GhIPSS tried to go over their heads."},{"key":"D","text":"Listen and clarify one-to-one with each of the six risk heads this week, then return on Friday with conditions.","effects":{"capital":200000,"trust":8,"risk":-4,"ttl":-4,"capacity":0},"feedback":"Four of the six turn out to want a shared view of borrowers, not a shared score. Friday's paper has an option for that.","setFlags":["listened"]}],"mediumLabel":"Letter"},"N5.3c":{"id":"N5.3c","kind":"branch","round":5,"title":"The Forum Day","owner":"SERVICE","ownerDept":"Shared Services (facilities)","accounts":["LENDING"],"engineStage":"growth","skills":["revenue_engine","time_management"],"ccp":"A31","medium":"memo","from":"events","subject":"GhanaPay lending forum, Friday","situation":"Fourteen bank delegations have confirmed for Friday's GhanaPay lending forum, 46 people. The main boardroom seats 40 with working AV; the annex seats 30 with no screen. The hotel next door has a room for 60 at GHS 28,000 with its own AV. Technology would like to show a live wallet-repayment demonstration. Venue decision needed by Wednesday.","data":[{"label":"Delegations","value":"14 banks, 46 people","evidence":"A","source":"game figure"},{"label":"Main boardroom","value":"Seats 40, AV working","evidence":"A","source":"game figure"},{"label":"Hotel","value":"Seats 60, GHS 28,000, own AV","evidence":"A","source":"game figure"},{"label":"Live demo","value":"Requested by Technology","evidence":"A","source":"game figure"}],"question":"What does the events desk do?","options":[{"key":"A","text":"Book the hotel room for 60 with its own AV, and run the demonstration from a laptop over the hotel's connection.","effects":{"capital":-30000,"trust":3,"risk":2,"ttl":0,"capacity":0},"feedback":"The room is comfortable. The demo stalls twice on the hotel's connection, and the banks remember the stall."},{"key":"B","text":"Host at GhIPSS: boardroom plus annex with a relay screen, a live wallet-repayment demo, and AV tested the day before.","effects":{"capital":200000,"trust":7,"risk":-2,"ttl":-3,"capacity":0},"feedback":"The demo runs on the first attempt because it ran on Thursday. Three bank delegations ask to see the data centre after lunch.","setFlags":["host_win_5"]},{"key":"C","text":"Move the forum to a video call so that all 46 can attend from their offices, and send the demonstration as a recording.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":4,"capacity":0},"feedback":"Attendance is 31. The recording is watched by nine people, and the decision the forum existed for is not taken."},{"key":"D","text":"Postpone the forum to January when the new conference room opens, and brief the banks by letter in the meantime.","effects":{"capital":-250000,"trust":-8,"risk":2,"ttl":15,"capacity":0},"feedback":"The letters go out. Two banks launch wallet lending on their own apps before January, and the forum has less to decide."}],"mediumLabel":"Internal memo"},"E_WALLET_GAP":{"id":"E_WALLET_GAP","kind":"echo","title":"Payday, No Wallet","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["NYEP"],"trigger":{"all":["wallet_gap"]},"eligibleRounds":[2,3],"priority":60,"horizon":"A payday is coming for beneficiaries who have no wallet yet.","engineStage":"acquisition","skills":["recovery","closing_plan"],"ccp":"A31","medium":"news","from":"selasi","subject":"Stipends stuck: 31,000 young people unpaid on first GhanaPay payday","situation":"The programme director told morning radio that GhIPSS 'assured us the wallets would be ready'. Beneficiaries without an active GhanaPay wallet could not be paid, and PayRoute had already been switched off for the region. Regional offices are queuing. The ministry has asked GhIPSS for a statement by noon.","data":[{"label":"Beneficiaries unpaid","value":"About 31,000","evidence":"A","source":"game figure"},{"label":"Registration","value":"Needs a Ghana Card validated at the bank","evidence":"C","source":"GhIPSS GhanaPay FAQ"},{"label":"PayRoute","value":"Switched off in the region","evidence":"A","source":"game figure"},{"label":"Ministry deadline","value":"Noon today","evidence":"A","source":"game figure"}],"question":"What does Enablement do by noon?","options":[{"key":"A","text":"A statement that owns the gap, pays this month through PayRoute again, and publishes a dated registration plan by region.","effects":{"capital":-100000,"trust":6,"risk":-4,"ttl":5,"capacity":0},"feedback":"The programme accepts the plan on air that afternoon. Every beneficiary is paid by Friday, and the dates are now public.","clearFlags":["wallet_gap"]},{"key":"B","text":"A statement that the programme set the date against GhIPSS advice, and that registering beneficiaries was always its job.","effects":{"capital":50000,"trust":-12,"risk":6,"ttl":5,"capacity":0},"feedback":"Accurate, and the programme director reads it aloud on the evening news. The ministry stops copying GhIPSS on anything."},{"key":"C","text":"Pay the 31,000 through cash desks at the regional offices this week, with the desks staffed by the participating banks.","effects":{"capital":-300000,"trust":0,"risk":8,"ttl":8,"capacity":0},"feedback":"Cash moves in vans across three regions. Everyone is paid by Thursday, and the audit questions start on Friday."},{"key":"D","text":"A statement promising every beneficiary an active wallet by next payday, with GhIPSS staff joining the registration desks.","effects":{"capital":-150000,"trust":2,"risk":2,"ttl":0,"capacity":0},"feedback":"The promise lands. Twenty GhIPSS staff spend two weeks at desks in the north, and most of the wallets are open in time."}],"autoResolve":{"effects":{"capital":-300000,"trust":-6,"risk":4,"ttl":0,"capacity":0},"note":"The unpaid payday ran its course on the radio without a GhIPSS answer."},"mediumLabel":"The Settlement Times"},"E_MERIDIAN_COLD":{"id":"E_MERIDIAN_COLD","kind":"echo","title":"Meridian Remembers","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["MERIDIAN","LENDING"],"trigger":{"all":["meridian_bypassed"]},"eligibleRounds":[4,5],"priority":55,"horizon":"Someone at Meridian Bank has a long memory, and a seat at the lending forum.","engineStage":"growth","skills":["negotiation","active_listening"],"ccp":"A31","medium":"email","from":"abena","subject":"GhanaPay lending forum","situation":"We read about the NYEP migration in the newspaper. Meridian has disbursed those stipends for four years. You will understand that our board now reads every GhIPSS proposal, including microcredit on GhanaPay, with that experience in mind. We will attend the forum and share our view with the other banks.","data":[{"label":"Meridian","value":"Incumbent disbursing bank; GhanaPay participant","evidence":"A","source":"game figure"},{"label":"Relationship","value":"Cold since the stipend move","evidence":"A","source":"game figure"},{"label":"Forum","value":"Meridian attends and speaks","evidence":"A","source":"game figure"},{"label":"What Meridian wants now","value":"Unknown","evidence":"U","source":null}],"question":"What does Enablement do?","options":[{"key":"A","text":"Brief the other 13 banks on Meridian's grievance first, so that its view arrives at the forum already discounted.","effects":{"capital":150000,"trust":-8,"risk":6,"ttl":0,"capacity":0},"feedback":"The briefing reaches Meridian within a day. Its view at the forum is now about how GhIPSS treats partners."},{"key":"B","text":"Visit Abena with Adwoa before the forum, ask what Meridian needs from the move, and offer it a defined role in the pilot.","effects":{"capital":100000,"trust":8,"risk":-3,"ttl":-2,"capacity":0},"feedback":"Abena wanted to be asked. Meridian becomes the pilot's settlement bank and speaks for GhIPSS at the forum.","clearFlags":["meridian_bypassed"]},{"key":"C","text":"Send a formal letter of apology from the Sponsor, and leave the relationship to recover in its own time and way.","effects":{"capital":-50000,"trust":1,"risk":0,"ttl":3,"capacity":0},"feedback":"The letter is filed. At the forum Meridian is correct, courteous and unhelpful, and two banks notice."},{"key":"D","text":"Offer Meridian a fee rebate on its GhanaPay volume for two quarters, as compensation for the mandate it has lost.","effects":{"capital":-200000,"trust":4,"risk":2,"ttl":0,"capacity":0},"feedback":"Meridian accepts the rebate and says nothing at the forum. Two other banks ask what happened to earn it.","setFlags":["waiver"]}],"autoResolve":{"effects":{"capital":-200000,"trust":-6,"risk":0,"ttl":0,"capacity":0},"note":"Meridian lobbied against GhIPSS at the forum and two banks listened."},"mediumLabel":"Email"},"E_CAPACITY_CRUNCH":{"id":"E_CAPACITY_CRUNCH","kind":"echo","title":"The Sprint Is Full","owner":"PLATFORM","ownerDept":"Technology","accounts":["ABUSUA","ADEPA"],"trigger":{"all":["custom_api","capacity_low"]},"eligibleRounds":[3,4],"priority":79,"horizon":"The custom build is eating the sprint, and the PSP connection has no engineer.","engineStage":"activation","skills":["time_management","closing_plan"],"ccp":"A33","medium":"message","from":"sprint","lines":[["Sprint lead, 08:12","The Abusua API has taken three of our four engineers. The Adepa connectivity work is unassigned and the PSP's engineers are waiting on us."],["Sprint lead, 08:14","Something has to drop this sprint: the Abusua API, the Adepa connection, or the monthly release with the security patches."],["Sprint lead, 08:15","Tell me by 10:00 which one."]],"data":[{"label":"Engineers on the Abusua API","value":"Three of four","evidence":"A","source":"game figure"},{"label":"Adepa connectivity","value":"Unassigned","evidence":"A","source":"game figure"},{"label":"Monthly release","value":"Includes security patches","evidence":"A","source":"game figure"},{"label":"Squad Capacity","value":"Shown in the header","evidence":"A","source":"game figure"}],"question":"What does Platform drop?","options":[{"key":"A","text":"Skip the monthly release, security patches included, and keep both partner builds moving at their full pace.","effects":{"capital":200000,"trust":3,"risk":12,"ttl":-5,"capacity":0},"feedback":"Both builds move. The unpatched month is noted by ISMS Governance and nobody sleeps well until the next release."},{"key":"B","text":"Let the Adepa connection slip to next sprint; the PSP signed knowing the queue, and the retailer is already live.","effects":{"capital":-100000,"trust":-8,"risk":2,"ttl":15,"capacity":0},"feedback":"Adepa learns of the slip from the silence. Its chief executive's next call is about staying bilateral."},{"key":"C","text":"Pause the Abusua build for a fortnight, tell Dzifa why with a new date, and put the engineers on the Adepa link.","effects":{"capital":100000,"trust":2,"risk":-3,"ttl":-8,"capacity":1},"feedback":"Dzifa is unhappy and informed, which she prefers to happy and misled. Adepa's connection is up within the week."},{"key":"D","text":"Ask the four engineers to work the next three weekends so that nothing drops this sprint, with overtime paid.","effects":{"capital":-150000,"trust":2,"risk":5,"ttl":-3,"capacity":-1},"feedback":"Nothing drops for three weeks. Then two engineers ask People and Culture about the leave they have not taken.","capacityCost":1,"requires":[{"meter":"capacity","op":">=","value":1,"reason":"Locked: this needs 1 capacity unit and the squad has fewer. Settlement returns one unit."}]}],"autoResolve":{"effects":{"capital":-150000,"trust":0,"risk":0,"ttl":10,"capacity":0},"note":"The sprint overran and the PSP connection slipped a fortnight."},"situation":"Sprint lead, 08:12: The Abusua API has taken three of our four engineers. The Adepa connectivity work is unassigned and the PSP's engineers are waiting on us. Sprint lead, 08:14: Something has to drop this sprint: the Abusua API, the Adepa connection, or the monthly release with the security patches. Sprint lead, 08:15: Tell me by 10:00 which one.","mediumLabel":"Message thread"},"E_API_EXPOSED":{"id":"E_API_EXPOSED","kind":"echo","title":"The Exposed Endpoint","owner":"CONTROL","ownerDept":"Cybersecurity and Legal","accounts":["ABUSUA"],"trigger":{"all":["api_unsecured"]},"eligibleRounds":[3,4],"priority":78,"horizon":"A live data feed went out on a vendor's word. Somebody will look at it.","engineStage":"conversion","skills":["recovery","sales_courage"],"ccp":"A31","medium":"email","from":"researcher","subject":"Exposed credentials: responsible disclosure","situation":"While reviewing public code repositories I found API keys for a GhIPSS merchant notification endpoint, committed by a contractor working for Abusua Appliances. The keys appear live. I have not used them. I am notifying you in good faith and will publish a summary in 30 days, which is my standard disclosure practice.","data":[{"label":"Keys","value":"Live, in a public repository","evidence":"A","source":"game figure"},{"label":"Disclosure window","value":"30 days","evidence":"A","source":"game figure"},{"label":"Data reachable","value":"Transaction amounts, stores, times","evidence":"A","source":"game figure"},{"label":"Whether anyone else has used the keys","value":"Unknown","evidence":"U","source":null}],"question":"What does Control do?","options":[{"key":"A","text":"Rotate the keys quietly, and ask the researcher to sign a non-disclosure agreement before mentioning it to anyone.","effects":{"capital":100000,"trust":-3,"risk":6,"ttl":0,"capacity":0},"feedback":"The researcher declines the NDA and publishes on day 30 with the request attached. Quiet became the story."},{"key":"B","text":"Write to Abusua that its vendor breached the acknowledgement it signed, and that liability now sits with the retailer.","effects":{"capital":0,"trust":-9,"risk":8,"ttl":3,"capacity":0},"feedback":"Abusua's lawyers reply. The keys stay live for another nine days while the letters cross."},{"key":"C","text":"Shut the endpoint down until a full ISMS review of every merchant integration is complete, which takes about six weeks.","effects":{"capital":-200000,"trust":-5,"risk":-6,"ttl":12,"capacity":0},"feedback":"Secure and silent. Abusua's 42 stores go back to next-day reports, and its CFO goes back to her bank."},{"key":"D","text":"Rotate the keys today, notify Abusua and the regulator, thank the researcher, and put key handling in the addendum.","effects":{"capital":-50000,"trust":4,"risk":-10,"ttl":0,"capacity":0},"feedback":"Keys are dead within the hour. The regulator notes a prompt disclosure, and the researcher's summary says GhIPSS responded well.","setFlags":["data_secured"],"clearFlags":["api_unsecured"]}],"autoResolve":{"effects":{"capital":-250000,"trust":-5,"risk":10,"ttl":0,"capacity":0},"note":"The researcher published; the story named GhIPSS and the regulator asked questions."},"mediumLabel":"Email"},"E_SILENT_INCIDENT":{"id":"E_SILENT_INCIDENT","kind":"echo","title":"The Story Writes Itself","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["XXPAY"],"trigger":{"all":["silent_incident"]},"eligibleRounds":[4,5],"priority":82,"horizon":"A reporter has XxPay's version of Friday night and nobody else's.","engineStage":"retention","skills":["recovery","emotional_resilience"],"ccp":"A31","medium":"news","from":"selasi","subject":"Double debits: the night GhIPSS went quiet","situation":"Page 3 reconstructs Friday evening from XxPay's statement, customer screenshots and 'a source at a wallet provider'. GhIPSS is described as 'unavailable for comment'. Selasi Kumordzi has emailed Brand asking whether GhIPSS wishes to respond before the follow-up piece on Thursday.","data":[{"label":"Article","value":"Published, no GhIPSS voice","evidence":"A","source":"game figure"},{"label":"Follow-up","value":"Thursday","evidence":"A","source":"game figure"},{"label":"Errors in the piece","value":"Two, both on the timeline","evidence":"A","source":"game figure"},{"label":"Reversals","value":"Completed by Monday","evidence":"A","source":"game figure"}],"question":"What does Brand and Communications do?","options":[{"key":"A","text":"Write to the editor demanding a correction of the two timeline errors, and decline to make any further comment at all.","effects":{"capital":100000,"trust":-4,"risk":3,"ttl":0,"capacity":0},"feedback":"The correction runs in small type on Thursday, under a follow-up that still has no GhIPSS voice in it."},{"key":"B","text":"Brief Selasi on the record with the incident timeline, the reversal completion, and what has changed since that night.","effects":{"capital":50000,"trust":6,"risk":-3,"ttl":0,"capacity":0},"feedback":"Thursday's piece corrects the timeline and quotes GhIPSS on what changed. XxPay's CEO reads it and calls to say so.","setFlags":["incident_told"]},{"key":"C","text":"Ignore the follow-up entirely; responding now would only extend the story by another week of unwelcome coverage.","effects":{"capital":50000,"trust":-8,"risk":4,"ttl":2,"capacity":0},"feedback":"Thursday's piece runs with a second partner's quote. The quarter's story about GhIPSS is now written by others."},{"key":"D","text":"Buy a half-page advertorial on GhIPSS reliability for Thursday's edition instead of answering the reporter's questions.","effects":{"capital":-200000,"trust":-2,"risk":1,"ttl":0,"capacity":0},"feedback":"The advertorial sits opposite the follow-up. Readers notice the placement, and so does the reporter."}],"autoResolve":{"effects":{"capital":-200000,"trust":-6,"risk":0,"ttl":0,"capacity":0},"note":"The follow-up ran without GhIPSS and the story set the quarter's narrative."},"mediumLabel":"The Settlement Times"},"E_UNAPPROVED_CHANGE":{"id":"E_UNAPPROVED_CHANGE","kind":"echo","title":"The Timeout Returns","owner":"PLATFORM","ownerDept":"Technology","accounts":["XXPAY","ADEPA"],"trigger":{"all":["unapproved_change"]},"eligibleRounds":[4,5],"priority":80,"horizon":"Friday's restart changed something nobody wrote down.","engineStage":"retention","skills":["recovery","arg"],"ccp":"A31","medium":"ticket","from":"kwesi","subject":"Ticket #4688, month-end 18:20: wallet-route timeouts at 11%","situation":"The wallet-route timeouts are back at 11%. Root cause found: Friday's restart cleared the queue but left a configuration change that was never reviewed by the Change Advisory Board, and the month-end peak has exposed it. Adepa's salary files are in the queue behind it. Efua Badu asks why the change is not in the CAB register.","data":[{"label":"Timeouts","value":"11% at the month-end peak","evidence":"A","source":"game figure"},{"label":"Cause","value":"Unreviewed configuration left by the restart","evidence":"A","source":"game figure"},{"label":"CAB register","value":"No entry for the change","evidence":"A","source":"game figure"},{"label":"Salary files queued","value":"Three corporates","evidence":"A","source":"game figure"}],"question":"What does Technology do?","options":[{"key":"A","text":"Fix under an emergency change with the CAB chair's sign-off, log the original restart, and run a post-incident review.","effects":{"capital":100000,"trust":4,"risk":-8,"ttl":-2,"capacity":0},"feedback":"The emergency change is approved in 20 minutes and the queue clears. The review puts the restart in the register with a lesson.","clearFlags":["unapproved_change"]},{"key":"B","text":"Restart the service again to clear the month-end peak now, and raise the change paperwork once month-end is safely over.","effects":{"capital":200000,"trust":-4,"risk":12,"ttl":0,"capacity":0},"feedback":"The queue clears. The configuration fault is still there, and now there are two changes nobody reviewed."},{"key":"C","text":"Roll back to the pre-Friday configuration now, and accept that the duplicates risk returns until the CAB sits on Monday.","effects":{"capital":-100000,"trust":-5,"risk":4,"ttl":3,"capacity":0},"feedback":"Timeouts stop; duplicates start. XxPay's CTO sends one message: 'Again?'"},{"key":"D","text":"Pause the wallet route for the whole of month-end, and route Adepa's salary files through bank accounts only until then.","effects":{"capital":-150000,"trust":-3,"risk":-3,"ttl":8,"capacity":0},"feedback":"Salaries land in bank accounts. Wallet payouts wait a day, and two of Adepa's clients ask what they are paying for."}],"autoResolve":{"effects":{"capital":-250000,"trust":-4,"risk":8,"ttl":0,"capacity":0},"note":"The unreviewed change failed again at the next peak and the CAB opened an inquiry."},"mediumLabel":"Service ticket"},"E_SALARY_DAY":{"id":"E_SALARY_DAY","kind":"echo","title":"Salary Day Fails","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"trigger":{"all":["date_promised"],"none":["path_mapped"]},"eligibleRounds":[5],"priority":88,"horizon":"Month-end is coming for a date that was promised before the path was mapped.","engineStage":"activation","skills":["recovery","sales_courage"],"ccp":"A33","medium":"call","from":"yao","lines":[["Yao Dzansi","It is month-end. Four thousand workers at my largest client have not been paid. Your CAB moved, your certification came with conditions, and nobody told me until this morning. The client is leaving us for a bank."],["Squad","What do you need from us today?"],["Yao Dzansi","A reason to stay. And a number."]],"data":[{"label":"Workers unpaid","value":"About 4,000","evidence":"A","source":"game figure"},{"label":"Client lost","value":"Adepa's largest corporate","evidence":"A","source":"game figure"},{"label":"Promise","value":"Month-end, made without a mapped path","evidence":"A","source":"game figure"},{"label":"Whether Adepa stays on GhIPSS","value":"Unknown","evidence":"U","source":null}],"question":"What does Control offer?","options":[{"key":"A","text":"Refund Adepa's joining fee and offer three months free, and leave the client relationship for Adepa itself to repair.","effects":{"capital":-250000,"trust":2,"risk":2,"ttl":0,"capacity":0},"feedback":"Yao takes the money and says it changes nothing. His workers are still unpaid at 17:00.","setFlags":["waiver"]},{"key":"B","text":"Point out that Adepa's own UAT delays caused the slip, and that GhIPSS met every commitment that it made in writing.","effects":{"capital":0,"trust":-12,"risk":6,"ttl":5,"capacity":0},"feedback":"True in the file, fatal on the phone. Adepa goes back to bilateral and tells the next PSP why."},{"key":"C","text":"Invoke the SLA's limitation clause and offer a goodwill credit of one month's fees, with no admission of any fault.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":2,"capacity":0},"feedback":"The credit is accepted in silence. Adepa's lawyers read the SLA more carefully than anyone at GhIPSS did."},{"key":"D","text":"Run today's salaries through PDM via a partner bank at GhIPSS's cost, give Yao an honest account and a dated plan.","effects":{"capital":-200000,"trust":6,"risk":-2,"ttl":-3,"capacity":0},"feedback":"The 4,000 are paid by 16:00 through a bank. Yao loses the client anyway, and keeps the other two because of the afternoon."}],"autoResolve":{"effects":{"capital":-400000,"trust":-10,"risk":5,"ttl":0,"capacity":0},"note":"Adepa's largest client left and Adepa went back to bilateral."},"situation":"Yao Dzansi: It is month-end. Four thousand workers at my largest client have not been paid. Your CAB moved, your certification came with conditions, and nobody told me until this morning. The client is leaving us for a bank. Squad: What do you need from us today? Yao Dzansi: A reason to stay. And a number.","mediumLabel":"Incoming call"},"E_WAIVER_PRECEDENT":{"id":"E_WAIVER_PRECEDENT","kind":"echo","title":"Everyone Wants the Waiver","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA","ABUSUA","NYEP"],"trigger":{"all":["waiver"]},"eligibleRounds":[3,4,5],"priority":70,"horizon":"Participants talk to each other, and one of them has heard about an arrangement.","engineStage":"conversion","skills":["negotiation","sales_courage"],"ccp":"A28","medium":"email","from":"adwoa","subject":"Three asks citing 'the arrangement'","situation":"Three participants have written this week citing the arrangement we gave on fees. A rural bank wants its joining fee waived, a PSP wants a free quarter on GIP, and a biller wants the GhQR trial 'everyone else got'. They talk to each other. Finance, I need one answer I can give all three by Friday.","data":[{"label":"Requests","value":"Three, worth about GHS 420,000","evidence":"A","source":"game figure"},{"label":"Precedent","value":"One waiver already granted this quarter","evidence":"A","source":"game figure"},{"label":"Published rebate schedule","value":"None","evidence":"A","source":"game figure"},{"label":"Joining fee","value":"One-time administrative fee","evidence":"C","source":"GhIPSS answers, 14 Oct"}],"question":"What does Finance answer?","options":[{"key":"A","text":"Grant all three to stay consistent, and budget for waivers from now on as a cost of growing volume on the rails.","effects":{"capital":-400000,"trust":5,"risk":6,"ttl":-3,"capacity":0},"feedback":"Consistency achieved. Four more requests arrive the following week, and the budget line has a name."},{"key":"B","text":"Refuse all three and state that the first arrangement was a one-off that will not be repeated for anyone, ever.","effects":{"capital":200000,"trust":-8,"risk":2,"ttl":3,"capacity":0},"feedback":"The three compare notes. 'One-off' becomes the word for GhIPSS pricing, and the rural bank writes to the Sponsor."},{"key":"C","text":"Publish one stepped launch rebate with a fee floor and an end date for all, and name the first waiver the last one.","effects":{"capital":150000,"trust":4,"risk":-4,"ttl":0,"capacity":0},"feedback":"All three get the same published offer. Two take it, one grumbles, and nobody has a special arrangement any more.","clearFlags":["waiver"]},{"key":"D","text":"Handle each request on its own merits with the Sponsor's sign-off, and keep the agreed terms confidential each time.","effects":{"capital":-150000,"trust":-2,"risk":5,"ttl":2,"capacity":0},"feedback":"Three separate deals, three separate secrets. The participants compare them anyway."}],"autoResolve":{"effects":{"capital":-300000,"trust":-3,"risk":3,"ttl":0,"capacity":0},"note":"The three requests were granted one by one by people who did not know about each other."},"mediumLabel":"Email"},"E_LOG_FILE":{"id":"E_LOG_FILE","kind":"echo","title":"The Log File","owner":"CONTROL","ownerDept":"Audit and ERC","accounts":["ADEPA"],"trigger":{"any":["unescorted","cert_waiver","unscreened","licence_only"]},"eligibleRounds":[5],"priority":72,"horizon":"There is a gap in an onboarding record, and a review is coming.","engineStage":"activation","skills":["sales_courage","time_management"],"ccp":"A33","medium":"memo","from":"isms","subject":"Regulator's annual review: onboarding files","situation":"The regulator's annual review starts next week and has requested the onboarding file for every participant that went live this quarter. Our own pre-review found a gap: an exception granted during the quarter without its control evidence, whether an unescorted data-centre visit, a certification waiver, or a participant screening that relied on a licence or a letter. The file goes to the regulator on Monday.","data":[{"label":"Review","value":"Starts next week","evidence":"A","source":"game figure"},{"label":"Gap","value":"An exception with no control evidence","evidence":"A","source":"game figure"},{"label":"Onboarding chain","value":"Legal, ISMS, Technology, Operations, PMO, Finance","evidence":"C","source":"GhIPSS case 1 and answers"},{"label":"Remediation window","value":"Five days","evidence":"A","source":"game figure"}],"question":"What does Control do?","options":[{"key":"A","text":"Disclose the gap in the file with the remediation already done and dated, and a control change that closes it.","effects":{"capital":-50000,"trust":3,"risk":-10,"ttl":0,"capacity":0},"feedback":"The regulator reads a self-identified gap with a dated fix and moves on. The control change is the finding that never was."},{"key":"B","text":"Backfill the missing evidence with dated sign-offs now, so that the file reads as complete when it goes on Monday.","effects":{"capital":100000,"trust":0,"risk":14,"ttl":0,"capacity":0},"feedback":"The file reads well. The regulator's reviewer compares the sign-off dates with the visitor log."},{"key":"C","text":"Leave that participant's file out of the pack entirely, and provide it only if the regulator asks for it by name.","effects":{"capital":50000,"trust":-2,"risk":8,"ttl":2,"capacity":0},"feedback":"The regulator asks for it by name on day two."},{"key":"D","text":"Ask the regulator to move the review by a month while the onboarding records are being migrated to a new system.","effects":{"capital":-100000,"trust":-4,"risk":3,"ttl":6,"capacity":0},"feedback":"The review moves by two weeks, not a month. The gap is the same size when it arrives."}],"autoResolve":{"effects":{"capital":-300000,"trust":0,"risk":12,"ttl":0,"capacity":0},"note":"The regulator found the gap and issued a finding against GhIPSS."},"mediumLabel":"Internal memo"},"P_NORTHERN_PILOT":{"id":"P_NORTHERN_PILOT","kind":"echo","positive":true,"title":"Eight Thousand Paid in Minutes","owner":"SERVICE","ownerDept":"Shared Services (fleet)","accounts":["NYEP"],"trigger":{"all":["nyep_pilot"]},"eligibleRounds":[3,4,5],"priority":50,"horizon":"The pilot payday is coming, and if it works the programme will want more.","engineStage":"growth","skills":["arg","time_management","closing_plan"],"ccp":"A31","medium":"email","from":"fuseini","subject":"Pilot result and next steps","situation":"8,112 beneficiaries in the pilot region were paid into GhanaPay wallets in under fourteen minutes on payday. The minister has asked for three more regions before the end of the quarter, in the same weeks as your lending forum. We will need vehicles, drivers and registration desks again, at twice the scale. Can Shared Services do it?","data":[{"label":"Pilot","value":"8,112 paid in under 14 minutes","evidence":"A","source":"game figure"},{"label":"Request","value":"Three more regions this quarter","evidence":"A","source":"game figure"},{"label":"Clash","value":"Same weeks as the lending forum","evidence":"A","source":"game figure"},{"label":"Fleet","value":"Three vehicles; the retreat is over","evidence":"A","source":"game figure"}],"question":"What does Shared Services commit to?","options":[{"key":"A","text":"Commit to all three regions in the same weeks, and pull the forum's facilities staff across onto the registration drives.","effects":{"capital":350000,"trust":4,"risk":8,"ttl":-3,"capacity":0},"feedback":"Three regions start. The forum's AV is set up by whoever is left, and the demo for 14 banks is the thing that suffers."},{"key":"B","text":"Commit to two regions now with hired vehicles and bank desks, and give the third region a dated start after the forum.","effects":{"capital":250000,"trust":6,"risk":-2,"ttl":-5,"capacity":0},"feedback":"Two regions go live on the next payday. The third has a date the minister can announce, and the forum keeps its staff."},{"key":"C","text":"Decline until next quarter, because the fleet and facilities teams are already fully committed to the lending forum.","effects":{"capital":-150000,"trust":-8,"risk":0,"ttl":8,"capacity":0},"feedback":"The minister announces the three regions anyway, with a different rail named in the press release."},{"key":"D","text":"Hand the regional drives to the participating banks entirely, with GhIPSS providing only the registration kit itself.","effects":{"capital":100000,"trust":-3,"risk":4,"ttl":2,"capacity":0},"feedback":"Two banks run good drives; one does not. The programme asks why GhIPSS was there for the pilot and not for the scale-up."}],"autoResolve":{"effects":{"capital":100000,"trust":2,"risk":0,"ttl":0,"capacity":0},"note":"The programme scaled with its own resources and thanked GhIPSS in passing."},"mediumLabel":"Email"},"P_API_PRODUCT":{"id":"P_API_PRODUCT","kind":"echo","positive":true,"title":"Five Retailers in the Queue","owner":"PLATFORM","ownerDept":"Technology","accounts":["ABUSUA"],"trigger":{"all":["api_product"]},"eligibleRounds":[4,5],"priority":42,"horizon":"Other retailers have heard what Abusua is getting.","engineStage":"growth","skills":["arg","time_management"],"ccp":"A28","medium":"email","from":"adwoa","subject":"The API is selling itself","situation":"Five merchants have asked for the real-time notification API since Abusua's finance director spoke at the retail association. Two are supermarket chains. Technology has the product; onboarding each merchant takes about a week of an engineer's time. The sprint is also carrying the lending integration. How do we onboard five without breaking the sprint?","data":[{"label":"Merchants waiting","value":"Five, two of them supermarket chains","evidence":"A","source":"game figure"},{"label":"Onboarding effort","value":"About one engineer-week each","evidence":"A","source":"game figure"},{"label":"Revenue per merchant","value":"About GHS 40,000 a quarter","evidence":"A","source":"game figure"},{"label":"Sprint","value":"Lending integration in flight","evidence":"A","source":"game figure"}],"question":"What does Technology do?","options":[{"key":"A","text":"Onboard all five this month with two capacity units, and push the lending integration back by one sprint for them.","effects":{"capital":350000,"trust":3,"risk":5,"ttl":-4,"capacity":-2},"feedback":"Five merchants live in a month. Fourteen banks hear that their integration moved for five shops.","capacityCost":2,"requires":[{"meter":"capacity","op":">=","value":2,"reason":"Locked: this needs 2 capacity units and the squad has fewer. Settlement returns one unit."}]},{"key":"B","text":"Put all five in the standard queue behind the lending integration, and give each of them a start date next quarter.","effects":{"capital":0,"trust":-4,"risk":0,"ttl":8,"capacity":0},"feedback":"Two merchants wait. Three sign with the bank whose QR comes with evening reports and a relationship manager."},{"key":"C","text":"Publish a self-serve onboarding kit with a sandbox, and book two assisted go-lives a month in order of readiness.","effects":{"capital":250000,"trust":5,"risk":-2,"ttl":-6,"capacity":-1},"feedback":"Three merchants self-serve in a fortnight. The two chains take the assisted slots, and the sprint never notices.","capacityCost":1,"requires":[{"meter":"capacity","op":">=","value":1,"reason":"Locked: this needs 1 capacity unit and the squad has fewer. Settlement returns one unit."}]},{"key":"D","text":"Certify Abusua's integrator to onboard the five for a fee, with GhIPSS reviewing each integration before go-live.","effects":{"capital":150000,"trust":2,"risk":3,"ttl":-3,"capacity":0},"feedback":"The integrator onboards four well and one badly. The review catches the bad one, and the model mostly works."}],"autoResolve":{"effects":{"capital":100000,"trust":1,"risk":0,"ttl":0,"capacity":0},"note":"Two of the five merchants waited; three went live slowly through Business Development."},"mediumLabel":"Email"},"P_XXPAY_WALLETS":{"id":"P_XXPAY_WALLETS","kind":"echo","positive":true,"title":"XxPay Moves Its Wallet Flows","owner":"PLATFORM","ownerDept":"Technology","accounts":["XXPAY"],"trigger":{"any":["xxpay_test","incident_handled"],"all":["trust_high"]},"eligibleRounds":[4,5],"priority":52,"horizon":"XxPay's board is watching the wallet route's numbers, and they are good.","engineStage":"growth","skills":["arg","closing_plan"],"ccp":"A31","medium":"email","from":"dela","subject":"Decision","situation":"Your wallet route has done what you said it would since that Friday: 99.6% completion, and a report in my inbox every morning at 07:00. We are moving all wallet flows to GIP from the first of next month. That is roughly 1.4 million transactions a month, and your switch had better be ready. I have told my board. Do not make me look foolish.","data":[{"label":"Completion since the incident","value":"99.6%","evidence":"A","source":"game figure"},{"label":"Volume moving","value":"About 1.4 million transactions a month","evidence":"A","source":"game figure"},{"label":"Wallet-route capacity today","value":"About 1.0 million a month at peak","evidence":"A","source":"game figure"},{"label":"Start","value":"First of next month","evidence":"A","source":"game figure"}],"question":"How does Platform absorb the volume?","options":[{"key":"A","text":"Take the full volume on day one as promised, since the switch has headroom on paper and the route has run clean.","effects":{"capital":400000,"trust":3,"risk":12,"ttl":-5,"capacity":0},"feedback":"Day one holds. Day three is month-end, and the queue on the wallet route reaches 20 minutes at the peak."},{"key":"B","text":"Ask Dela to delay the move by a quarter while the capacity upgrade goes through procurement and installation.","effects":{"capital":-100000,"trust":-8,"risk":-2,"ttl":10,"capacity":0},"feedback":"Dela has told his board. He does not delay; he moves half the volume to a competitor's rail instead."},{"key":"C","text":"Accept the move and throttle XxPay at 1.0 million a month until the upgrade lands, with the cap agreed in writing.","effects":{"capital":150000,"trust":-2,"risk":2,"ttl":0,"capacity":0},"feedback":"The cap holds the switch together. XxPay routes the overflow bilaterally and asks every week when the cap goes."},{"key":"D","text":"Phase the migration over three weeks by XxPay region, order the capacity upgrade now, and run a daily joint call.","effects":{"capital":300000,"trust":6,"risk":-3,"ttl":-5,"capacity":-1},"feedback":"Week one takes a third of the volume cleanly. The upgrade lands in week two, and Dela's board gets its numbers.","capacityCost":1,"requires":[{"meter":"capacity","op":">=","value":1,"reason":"Locked: this needs 1 capacity unit and the squad has fewer. Settlement returns one unit."}]}],"autoResolve":{"effects":{"capital":150000,"trust":2,"risk":0,"ttl":0,"capacity":0},"note":"XxPay moved its wallet flows and the switch coped, just."},"mediumLabel":"Email"},"CB_REGULATOR":{"id":"CB_REGULATOR","kind":"curveball","title":"The Regulator Writes","owner":"CONTROL","ownerDept":"ERC and Legal","accounts":[],"trigger":{"all":["cb_regulator"]},"eligibleRounds":[2,3,4,5],"priority":100,"horizon":"Risk Exposure is high enough that a letter is on its way.","engineStage":"retention","skills":["recovery","sales_courage"],"ccp":"A31","medium":"letter","from":"regulator","subject":"Operational and conduct events in the current quarter","situation":"Dear Managing Director. The regulator has noted a pattern of operational and conduct events at GhIPSS during the current quarter. Please provide, within ten working days, an explanation of each event, the controls that failed, and a remediation plan with named owners and dates. The regulator reserves its position on further action. Yours faithfully, Payment Systems Oversight.","data":[{"label":"Risk Exposure at last settlement","value":"60 or above","evidence":"A","source":"game figure"},{"label":"Deadline","value":"Ten working days","evidence":"A","source":"game figure"},{"label":"Scope","value":"Every logged event this quarter","evidence":"A","source":"game figure"},{"label":"Further action","value":"Reserved","evidence":"A","source":"game figure"}],"question":"What does Control send?","options":[{"key":"A","text":"A short letter confirming that every event was handled under existing procedures, with no remediation plan attached to it.","effects":{"capital":0,"trust":-2,"risk":6,"ttl":0,"capacity":0},"feedback":"The regulator writes again, shorter and firmer, and this time copies the board."},{"key":"B","text":"A full account of every event, the control that failed, and a dated remediation plan with owners, signed by the Sponsor.","effects":{"capital":-100000,"trust":3,"risk":-15,"ttl":2,"capacity":0},"feedback":"The regulator acknowledges a complete response. Two of the remediation dates fall this quarter, and the squad owns them."},{"key":"C","text":"A response drafted by external counsel contesting the regulator's description of the quarter's events as any kind of pattern.","effects":{"capital":-200000,"trust":-4,"risk":8,"ttl":3,"capacity":0},"feedback":"Counsel's letter is excellent. The regulator schedules an on-site review for the following month."},{"key":"D","text":"A request for a 30-day extension to allow a full internal audit of the quarter before any explanation of the events is given.","effects":{"capital":-100000,"trust":-1,"risk":2,"ttl":6,"capacity":0},"feedback":"Ten days are granted, not 30. The audit starts, and the explanation is still owed."}],"autoResolve":{"effects":{"capital":-350000,"trust":0,"risk":10,"ttl":0,"capacity":0},"note":"The regulator's deadline passed and a formal finding followed."},"mediumLabel":"Letter"},"CB_PARTNER":{"id":"CB_PARTNER","kind":"curveball","title":"Two CEOs Ask for a Meeting","owner":"ENABLEMENT","ownerDept":"Executive","accounts":[],"trigger":{"all":["cb_partner"]},"eligibleRounds":[2,3,4,5],"priority":90,"horizon":"Partner Trust is low enough that two chief executives are comparing notes.","engineStage":"retention","skills":["active_listening","objection","closing_plan"],"ccp":"A31","medium":"email","from":"twoceos","subject":"Urgent joint meeting","situation":"We write together because our concerns are the same. Our boards are asking why we route through GhIPSS when alternatives exist. We request a meeting this week with the squad and the Sponsor to hear what GhIPSS will change. We are copying our regulatory affairs teams for information.","data":[{"label":"Partner Trust at last settlement","value":"Below 35","evidence":"A","source":"game figure"},{"label":"Alternatives cited","value":"Bilateral and proprietary routes","evidence":"A","source":"game figure"},{"label":"Volume at risk","value":"About 30% of the quarter's revenue","evidence":"A","source":"game figure"},{"label":"Copied","value":"Both regulatory affairs teams","evidence":"A","source":"game figure"}],"question":"How does Enablement handle the meeting?","options":[{"key":"A","text":"Hold it this week with the Sponsor: listen and clarify first, then make three commitments with dates and owners.","effects":{"capital":100000,"trust":10,"risk":-3,"ttl":0,"capacity":0},"feedback":"The meeting runs 40 minutes over because the CEOs keep talking. Three commitments leave the room with dates on them."},{"key":"B","text":"Decline the joint format, and offer each chief executive a separate meeting with Business Development next month.","effects":{"capital":-200000,"trust":-10,"risk":4,"ttl":5,"capacity":0},"feedback":"Both decline the separate meetings. One moves volume the following week, and the other waits to see."},{"key":"C","text":"Open the meeting with a fee concession for both partners, so that the conversation starts on good terms for everyone.","effects":{"capital":-250000,"trust":5,"risk":3,"ttl":0,"capacity":0},"feedback":"The concession is accepted and the conversation stays on price. Nothing else changes, and both know it.","setFlags":["waiver"]},{"key":"D","text":"Send Business Development with a roadmap presentation, and keep the Sponsor out of it until positions are clearer.","effects":{"capital":150000,"trust":-3,"risk":1,"ttl":2,"capacity":0},"feedback":"The roadmap is admired. The CEOs ask where the Sponsor is, and the answer sets the tone for the next quarter."}],"autoResolve":{"effects":{"capital":-300000,"trust":-8,"risk":0,"ttl":0,"capacity":0},"note":"The meeting never happened and both partners moved volume to bilateral routes."},"mediumLabel":"Email"},"CB_EXCO":{"id":"CB_EXCO","kind":"curveball","title":"ExCo Review","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":[],"trigger":{"all":["cb_exco"]},"eligibleRounds":[2,3,4,5],"priority":85,"horizon":"Revenue has slipped far enough that ExCo wants an explanation.","engineStage":"growth","skills":["sales_courage","time_management"],"ccp":"A28","medium":"memo","from":"exco","subject":"Squad spending review, Thursday","situation":"The squad's revenue position has fallen below GHS 9.0 million against a GHS 10.0 million opening. ExCo asks the squad to present on Thursday: what was spent, what it bought, and what the squad will stop doing. Finance and Strategy leads the paper. Twenty minutes, nothing beyond three pages.","data":[{"label":"Revenue position","value":"Below GHS 9.0 million","evidence":"A","source":"game figure"},{"label":"Opening position","value":"GHS 10.0 million","evidence":"A","source":"game figure"},{"label":"Paper","value":"Three pages, Thursday","evidence":"A","source":"game figure"},{"label":"ExCo's question","value":"What stops","evidence":"A","source":"game figure"}],"question":"What does Finance and Strategy present?","options":[{"key":"A","text":"A defence of every decision as necessary, with a request for a further GHS 1.0 million to finish the quarter properly.","effects":{"capital":-150000,"trust":0,"risk":4,"ttl":0,"capacity":0},"feedback":"The request is declined. The defence is remembered the next time the squad asks for anything."},{"key":"B","text":"A paper attributing the shortfall to partner delays and to market conditions outside the squad's control entirely.","effects":{"capital":-100000,"trust":-6,"risk":5,"ttl":3,"capacity":0},"feedback":"ExCo asks which partner delayed what. Two partners hear they were named, and neither forgets it."},{"key":"C","text":"A freeze on all discretionary spend, including partner support, until the position recovers above GHS 9.5 million.","effects":{"capital":250000,"trust":-7,"risk":2,"ttl":10,"capacity":0},"feedback":"Spending stops. So do two onboarding clinics and a registration drive, and the recovery takes longer than the freeze."},{"key":"D","text":"An honest ledger of each decision, its cost and what it bought, with two things the squad will stop, savings dated.","effects":{"capital":150000,"trust":2,"risk":-4,"ttl":0,"capacity":0},"feedback":"ExCo spends its time on the two stops rather than the losses. The squad leaves with its budget and a sharper list."}],"autoResolve":{"effects":{"capital":-200000,"trust":-3,"risk":0,"ttl":0,"capacity":0},"note":"ExCo cut the squad's budget without hearing its case."},"mediumLabel":"Internal memo"},"CB_BURNOUT":{"id":"CB_BURNOUT","kind":"curveball","title":"The Exit Interviews","owner":"ENABLEMENT","ownerDept":"People and Culture","accounts":[],"trigger":{"all":["cb_burnout"]},"eligibleRounds":[2,3,4,5],"priority":92,"horizon":"The sprint has nothing left, and the people in it have noticed.","engineStage":"activation","skills":["time_management","emotional_resilience"],"ccp":"A28","medium":"memo","from":"people","subject":"Two resignations in the integration team","situation":"Two engineers from the integration team resigned this week. Both exit interviews cite the same thing: every partner build this quarter was urgent, nobody said no, and the weekends stopped being optional. Recruitment takes four months. People and Culture asks the squad what will change before the next sprint is planned, and wants the answer in writing for the team that remains.","data":[{"label":"Resignations","value":"Two integration engineers","evidence":"A","source":"game figure"},{"label":"Squad Capacity at last settlement","value":"Zero","evidence":"A","source":"game figure"},{"label":"Replacement time","value":"About four months","evidence":"A","source":"game figure"},{"label":"Remaining team","value":"Two engineers and contractors","evidence":"A","source":"game figure"}],"question":"What does the squad change?","options":[{"key":"A","text":"Hire four contractors immediately to backfill and keep every partner date, and review working hours next quarter.","effects":{"capital":-300000,"trust":3,"risk":4,"ttl":-3,"capacity":1},"feedback":"Contractors arrive in three weeks and need six to be useful. Every date holds on paper and one more engineer resigns."},{"key":"B","text":"Thank the leavers, repost the roles and keep every commitment; partners do not care about the staffing at GhIPSS.","effects":{"capital":50000,"trust":-4,"risk":10,"ttl":12,"capacity":0},"feedback":"Partners find out about the staffing when their dates slip. The remaining two engineers start returning recruiters' calls."},{"key":"C","text":"A written rule that no build starts without a free capacity unit, one build deferred by name, and a retention plan.","effects":{"capital":-100000,"trust":2,"risk":-5,"ttl":5,"capacity":1},"feedback":"The deferred build's partner is told the same day. The two engineers who stayed read the rule and stay."},{"key":"D","text":"Pause every partner build for a month while the team recovers, and tell the partners that new dates will follow.","effects":{"capital":-250000,"trust":-8,"risk":-3,"ttl":15,"capacity":0},"feedback":"The team recovers. Four partners each lose a month and two of them write to the Sponsor."}],"autoResolve":{"effects":{"capital":-250000,"trust":0,"risk":6,"ttl":10,"capacity":0},"note":"Two more engineers left and every partner date slipped."},"mediumLabel":"Internal memo"}},"injects":{"I1":{"id":"I1","kind":"inject","title":"Month-End Collision","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"engineStage":"activation","skills":["time_management","closing_plan"],"ccp":"A33","medium":"memo","from":"selorm","subject":"Month-end close and the Adepa go-live need the same two people","situation":"Finance's month-end close starts tomorrow. The same two analysts who confirm settlement figures for Adepa's go-live reconciliation also run the close. Operations cannot move the go-live slot without a two-week delay, and the close cannot slip without the CFO's sign-off. Three working days of close, one day of go-live reconciliation, two people.","data":[{"label":"Analysts","value":"Two","evidence":"A","source":"game figure"},{"label":"Month-end close","value":"Three working days","evidence":"A","source":"game figure"},{"label":"Cost of moving the go-live","value":"Two weeks","evidence":"A","source":"game figure"},{"label":"Reconciliation template","value":"Drafted, untested","evidence":"A","source":"game figure"}],"question":"What does Finance do?","options":[{"key":"A","text":"Split the pair: one runs the close, the other supports the go-live from a pre-agreed reconciliation template.","effects":{"capital":150000,"trust":5,"risk":0,"ttl":-4,"capacity":0},"feedback":"Both happen. The template does most of the go-live work, and the close finishes a few hours late."},{"key":"B","text":"Put both analysts on the close, and move the go-live back by two weeks to protect the month-end reporting cycle.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":10,"capacity":0},"feedback":"Reporting is safe. The partner loses two weeks and asks why a go-live was scheduled on top of month-end."},{"key":"C","text":"Put both analysts on the go-live, and tell the CFO that the close will be three days late this month as a result.","effects":{"capital":250000,"trust":3,"risk":9,"ttl":-4,"capacity":0},"feedback":"The go-live lands. Late reporting draws questions from the board and the auditors."},{"key":"D","text":"Ask Adepa to reconcile its own settlement figures for the go-live, and confirm them after the close is done.","effects":{"capital":-150000,"trust":-8,"risk":5,"ttl":2,"capacity":0},"feedback":"Adepa's figures do not match GhIPSS's. The go-live is delayed anyway, and the relationship takes the hit."}],"mediumLabel":"Internal memo"},"I2":{"id":"I2","kind":"inject","title":"The Journalist Calls","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":[],"engineStage":"retention","skills":["sales_courage","emotional_resilience"],"ccp":"A31","medium":"call","from":"selasi","lines":[["Selasi Kumordzi","I am writing about how GhIPSS handles its partners this quarter. I have spoken to two of them. I want GhIPSS's comment on the record by 16:00: specifically, what the squad has changed since the last incident."],["Squad","Which two partners?"],["Selasi Kumordzi","You know which two. 16:00."]],"data":[{"label":"Deadline","value":"16:00 today","evidence":"A","source":"game figure"},{"label":"Which two partners spoke","value":"Unknown","evidence":"U","source":null},{"label":"Publication","value":"Tomorrow's edition","evidence":"A","source":"game figure"},{"label":"Previous coverage this quarter","value":"None","evidence":"A","source":"game figure"}],"question":"What does Brand and Communications do?","options":[{"key":"A","text":"Decline to comment, and refer the reporter to the published annual report and the corporate website instead.","effects":{"capital":0,"trust":-4,"risk":3,"ttl":0,"capacity":0},"feedback":"The piece runs with 'GhIPSS declined to comment' in the second paragraph, and the partners' version in the first."},{"key":"B","text":"Give a factual on-record comment by 16:00 naming two changes made this quarter and who owns each of them.","effects":{"capital":50000,"trust":5,"risk":-2,"ttl":0,"capacity":0},"feedback":"The piece quotes both changes with their owners. One partner calls to say it read better than expected."},{"key":"C","text":"Speak off the record about the partners' own failings, so that the piece is balanced without a GhIPSS quote.","effects":{"capital":100000,"trust":-8,"risk":8,"ttl":0,"capacity":0},"feedback":"The piece is balanced. Both partners recognise the details and know exactly where they came from."},{"key":"D","text":"Ask for 48 hours to prepare a full statement, and accept that the piece may well run without it tomorrow.","effects":{"capital":-50000,"trust":-2,"risk":2,"ttl":2,"capacity":0},"feedback":"The piece runs tomorrow without GhIPSS. The full statement, two days later, answers questions nobody is still asking."}],"situation":"Selasi Kumordzi: I am writing about how GhIPSS handles its partners this quarter. I have spoken to two of them. I want GhIPSS's comment on the record by 16:00: specifically, what the squad has changed since the last incident. Squad: Which two partners? Selasi Kumordzi: You know which two. 16:00.","mediumLabel":"Incoming call"},"I3":{"id":"I3","kind":"inject","title":"Generator Day","owner":"PLATFORM","ownerDept":"Technology","accounts":[],"engineStage":"retention","skills":["recovery","time_management"],"ccp":"A31","medium":"message","from":"datacentre","lines":[["Data-centre desk, 13:12","Grid power lost. Generator A running. Generator B failed to start."],["Data-centre desk, 13:20","Fuel for A at about five hours. Peak begins at 16:00."],["Data-centre desk, 13:24","Facilities can get a fuel delivery by 17:30 or a hired generator by 19:00. Technology, do we shed load, and who tells participants?"]],"data":[{"label":"Fuel","value":"About five hours","evidence":"A","source":"game figure"},{"label":"Peak","value":"16:00 to 19:00","evidence":"A","source":"game figure"},{"label":"Fuel delivery","value":"17:30; hired generator 19:00","evidence":"A","source":"game figure"},{"label":"Participants affected if load is shed","value":"All","evidence":"A","source":"game figure"}],"question":"What does Technology do?","options":[{"key":"A","text":"Say nothing to participants; the fuel should last, and a notice now would only cause alarm for no good reason.","effects":{"capital":0,"trust":-6,"risk":10,"ttl":0,"capacity":0},"feedback":"The fuel lasts. A participant's engineer notices the generator on a site visit, and the silence becomes the story."},{"key":"B","text":"Shed all load at 15:30 to be safe, and reopen the rails only when the hired generator arrives at 19:00.","effects":{"capital":-300000,"trust":-8,"risk":-2,"ttl":2,"capacity":0},"feedback":"Three and a half hours of downtime at peak. Every participant's evening volume goes somewhere else."},{"key":"C","text":"Order the fuel delivery now, notify every participant by 14:00 with the plan, and shed non-critical systems.","effects":{"capital":-50000,"trust":5,"risk":-3,"ttl":0,"capacity":0},"feedback":"The fuel arrives at 17:10. Participants had the plan three hours before peak and nobody called the service desk."},{"key":"D","text":"Fail over to the disaster-recovery site now, and notify participants of a short switchover window th
