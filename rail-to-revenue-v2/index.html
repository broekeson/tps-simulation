/* Rail to Revenue v2.0: shared styles (team app, console, projector).
   Tokens: Intreensic navy 071E2E, blue 2B4DF7, green 12CC6F, teal 1F7A72. Carlito throughout. */
:root {
  --ink: #071E2E; --ink-70: rgba(7, 30, 46, .72); --ink-50: rgba(7, 30, 46, .5); --ink-20: rgba(7, 30, 46, .18); --ink-08: rgba(7, 30, 46, .08);
  --desk: #E9EDF1; --desk-2: #DFE5EB; --paper: #FFFFFF; --cream: #FBF8F1; --newsprint: #F3EFE6; --thread: #DDE7E1;
  --blue: #2B4DF7; --blue-deep: #1D37B8; --blue-soft: #E7EBFE;
  --teal: #1F7A72; --teal-soft: #E1F0EE;
  --green: #12CC6F; --green-ink: #0B6B3B; --green-soft: #DDF7E9;
  --brick: #B3261E; --brick-soft: #FBE4E1;
  --amber: #8A5A00; --amber-soft: #FBEFD5;
  --platform: #2B4DF7; --control: #1F7A72; --enablement: #0E9E57; --service: #071E2E;
  --radius: 10px; --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(7, 30, 46, .08), 0 8px 24px rgba(7, 30, 46, .08);
  --fs-body: 18px; --fs-small: 15px; --fs-h1: 28px; --fs-h2: 22px; --fs-num: 48px;
  --font: Carlito, Calibri, "Segoe UI", Arial, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --max: 780px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: var(--fs-body); line-height: 1.45; color: var(--ink); background: var(--desk); min-height: 100vh; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 .5rem; font-weight: 700; }
h1 { font-size: var(--fs-h1); } h2 { font-size: var(--fs-h2); } h3 { font-size: 19px; }
p { margin: 0 0 .75rem; }
p:last-child { margin-bottom: 0; }
a { color: var(--blue-deep); }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--ink); }
small, .small { font-size: var(--fs-small); }
.muted { color: var(--ink-70); }
.num, .tabular { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 52px; padding: .6rem 1.25rem; border-radius: var(--radius-sm); border: 2px solid var(--ink); background: var(--ink); color: #fff; font-weight: 700; font-size: 18px; cursor: pointer; text-decoration: none; }
.btn:hover { background: #0d2c42; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink-20); }
.btn.ghost:hover { background: var(--ink-08); }
.btn.quiet { background: transparent; color: var(--ink-70); border-color: transparent; min-height: 40px; padding: .3rem .6rem; font-weight: 400; }
.btn.quiet:hover { color: var(--ink); background: var(--ink-08); }
.btn.wide { width: 100%; }
.btn.big { min-height: 60px; font-size: 20px; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 1rem; }

/* ---------- fields ---------- */
.field { margin-bottom: 1rem; }
.field label { display: block; font-weight: 700; margin-bottom: .35rem; }
.field input, .field select, .field textarea { width: 100%; min-height: 52px; padding: .5rem .75rem; border: 2px solid var(--ink-20); border-radius: var(--radius-sm); background: #fff; }
.field input:focus { border-color: var(--blue); outline: none; }
.field .hint { color: var(--ink-70); font-size: var(--fs-small); margin-top: .3rem; }
.err { color: var(--brick); font-weight: 700; min-height: 1.4em; }
.code-in { font-family: var(--mono); font-size: 28px; letter-spacing: .25em; text-align: center; text-transform: uppercase; }

/* ---------- chips and badges ---------- */
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .6rem; border-radius: 999px; font-size: var(--fs-small); font-weight: 700; line-height: 1.6; border: 1.5px solid currentColor; }
.owner { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; }
.owner::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--c, var(--ink)); flex: none; }
.cl-PLATFORM { --c: var(--platform); } .cl-CONTROL { --c: var(--control); } .cl-ENABLEMENT { --c: var(--enablement); } .cl-SERVICE { --c: var(--service); }
.ev { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; font-size: 14px; font-weight: 700; flex: none; }
.ev-C { background: var(--teal); color: #fff; }
.ev-A { background: var(--ink-08); color: var(--ink); border: 1.5px solid var(--ink-20); }
.ev-U { background: #fff; color: var(--brick); border: 1.5px dashed var(--brick); }
.avatar { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--c, var(--ink)); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: .02em; flex: none; }
.avatar.desk { border-radius: 10px; }
.avatar.sm { width: 34px; height: 34px; font-size: 14px; }

/* ---------- meters ---------- */
.meters { display: flex; gap: .25rem 1.1rem; flex-wrap: wrap; align-items: flex-end; }
.meter { min-width: 88px; }
.meter .lbl { font-size: 13px; color: var(--ink-70); line-height: 1.2; }
.meter .val { font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: .35rem; }
.meter .d { font-size: 14px; font-weight: 700; }
.meter .d.up { color: var(--green-ink); } .meter .d.down { color: var(--brick); } .meter .d.flat { color: var(--ink-50); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pip { width: 12px; height: 18px; border-radius: 3px; background: var(--ink-20); }
.pip.on { background: var(--blue); }
.pip.spent { background: var(--brick-soft); border: 1.5px dashed var(--brick); }
.fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: .5rem; }
.fx { background: var(--ink-08); border-radius: var(--radius-sm); padding: .5rem .75rem; }
.fx .lbl { font-size: 14px; color: var(--ink-70); }
.fx .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fx.up .val { color: var(--green-ink); } .fx.down .val { color: var(--brick); }

/* ---------- surfaces ---------- */
.sheet { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.5rem; }
.sheet.tight { padding: 1rem 1.25rem; }
.band { padding: .75rem 1.5rem; border-radius: var(--radius); }
.band.info { background: var(--blue-soft); }
.band.warn { background: var(--amber-soft); }
.band.bad { background: var(--brick-soft); }
.band.good { background: var(--green-soft); }

/* ---------- artefacts: one treatment per medium ---------- */
.art { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.art.arrive { animation: arrive .32s ease-out both; }
@keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.art-slip { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .6rem 1.25rem; background: var(--ink); color: #fff; font-size: var(--fs-small); }
.art-slip .owner { color: #fff; }
.art-slip .owner::before { outline: 2px solid rgba(255,255,255,.65); }
.art-slip .kind { font-weight: 700; }
.art-head { display: flex; gap: .9rem; align-items: center; padding: 1rem 1.25rem .5rem; }
.art-head .who { line-height: 1.25; }
.art-head .who b { display: block; font-size: 19px; }
.art-head .who span { color: var(--ink-70); font-size: var(--fs-small); }
.art-body { padding: .25rem 1.25rem 1.25rem; font-size: 19px; line-height: 1.5; }
.art-body p { margin-bottom: .6rem; }
.art-title { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 0 0 .4rem; }
.art-meta { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .9rem; font-size: var(--fs-small); margin: .25rem 0 .75rem; }
.art-meta dt { color: var(--ink-70); } .art-meta dd { margin: 0; }

/* email */
.art-email .art-head { border-bottom: 1px solid var(--ink-08); padding-bottom: .75rem; }
.art-email .subject { font-weight: 700; font-size: 21px; margin: .75rem 0 .25rem; }
/* call */
.art-call { background: var(--ink); color: #fff; }
.art-call .art-head .who span { color: rgba(255,255,255,.7); }
.art-call .art-head .avatar { background: rgba(255,255,255,.16) !important; outline: 2px solid rgba(255,255,255,.55); }
.art-call .callbar { display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem .75rem; }
.art-call .wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.art-call .wave i { display: block; width: 4px; border-radius: 2px; background: var(--green); height: var(--h, 8px); opacity: .9; }
.art-call .live { color: var(--green); font-weight: 700; font-size: var(--fs-small); }
.art-call .lines { padding: .25rem 1.25rem 1.25rem; display: grid; gap: .6rem; }
.art-call .line { display: grid; grid-template-columns: 40px 1fr; gap: .7rem; align-items: start; }
.art-call .line .avatar { width: 40px; height: 40px; font-size: 15px; background: rgba(255,255,255,.14); color: #fff; }
.art-call .line.squad .avatar { background: var(--blue); }
.art-call .line .t { font-size: 19px; line-height: 1.45; }
.art-call .line .t b { display: block; font-size: 14px; color: rgba(255,255,255,.65); font-weight: 400; margin-bottom: .1rem; }
/* message thread */
.art-message .thread { background: var(--thread); padding: 1rem 1.25rem; display: grid; gap: .6rem; }
.art-message .bubble { background: #fff; border-radius: 12px 12px 12px 3px; padding: .55rem .8rem; max-width: 86%; box-shadow: 0 1px 1px rgba(7,30,46,.1); font-size: 18px; }
.art-message .bubble .from { display: flex; justify-content: space-between; gap: 1rem; font-size: 14px; color: var(--teal); font-weight: 700; margin-bottom: .15rem; }
.art-message .bubble .from time { color: var(--ink-50); font-weight: 400; font-variant-numeric: tabular-nums; }
/* ticket */
.art-ticket { border-left: 10px solid var(--blue); }
.art-ticket .tkt { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.25rem .25rem; }
.art-ticket .tkt code { font-family: var(--mono); font-size: 17px; background: var(--blue-soft); padding: .15rem .5rem; border-radius: 4px; }
.art-ticket .status { font-size: var(--fs-small); font-weight: 700; color: var(--amber); }
/* memo, meeting note, board paper, design note */
.art-memo .memohead { padding: 1rem 1.25rem 0; }
.art-memo .memohead .label { font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--ink-70); }
.art-memo .memohead .rule { height: 4px; background: var(--ink); margin: .5rem 0 .25rem; }
.art-meeting .art-body { border-left: 4px solid var(--teal); margin: 0 1.25rem 1.25rem; padding: .25rem 0 .25rem 1rem; }
/* letter */
.art-letter { background: var(--cream); }
.art-letter .letterhead { padding: 1.25rem 1.5rem .25rem; text-align: center; }
.art-letter .letterhead b { font-size: 20px; letter-spacing: .06em; }
.art-letter .letterhead span { display: block; font-size: 14px; color: var(--ink-70); }
.art-letter .art-body { padding: .75rem 1.5rem 1.5rem; }
/* news */
.art-news { background: var(--newsprint); }
.art-news .masthead { text-align: center; padding: 1rem 1.25rem .5rem; border-bottom: 3px double var(--ink); margin: 0 1.25rem; }
.art-news .masthead b { display: block; font-size: 34px; letter-spacing: -.01em; line-height: 1; }
.art-news .masthead span { font-size: 13px; color: var(--ink-70); }
.art-news .kicker { font-size: 14px; font-weight: 700; color: var(--brick); margin: .9rem 1.25rem 0; }
.art-news .headline { font-size: 27px; font-weight: 700; line-height: 1.12; margin: .2rem 1.25rem .35rem; }
.art-news .byline { font-size: 14px; color: var(--ink-70); margin: 0 1.25rem .6rem; }
.art-news .art-body { font-size: 18px; }
.art-news .art-body p:first-child::first-letter { font-size: 2.4em; float: left; line-height: .9; padding: .1em .12em 0 0; font-weight: 700; }
/* front desk log */
.art-log .loghead { display: flex; justify-content: space-between; padding: .9rem 1.25rem 0; font-size: var(--fs-small); color: var(--ink-70); font-weight: 700; }
.art-log .art-body { background: repeating-linear-gradient(to bottom, transparent 0 31px, var(--ink-08) 31px 32px); line-height: 32px; padding-top: 0; }
/* data lines */
.data { margin: 0 1.25rem 1.25rem; border-top: 1px solid var(--ink-08); padding-top: .75rem; display: grid; gap: .4rem; }
.art-call .data { border-top-color: rgba(255,255,255,.14); }
.data .d { display: grid; grid-template-columns: 24px 1fr; gap: .6rem; align-items: start; font-size: 17px; line-height: 1.35; }
.data .d .l { color: var(--ink-70); }
.art-call .data .d .l { color: rgba(255,255,255,.7); }
.data .d .v { font-weight: 700; }
.data .d .src { font-weight: 400; color: var(--ink-50); font-size: 14px; }
.art-call .data .d .src { color: rgba(255,255,255,.55); }
.data-title { font-size: 14px; font-weight: 700; color: var(--ink-70); margin-bottom: .2rem; }
.art-call .data-title { color: rgba(255,255,255,.7); }
.breaking { display: flex; align-items: center; gap: .75rem; background: var(--brick); color: #fff; padding: .5rem 1.25rem; font-weight: 700; }
.breaking i { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- options ---------- */
.opts { display: grid; gap: .6rem; }
.opt { display: grid; grid-template-columns: 48px 1fr; gap: .9rem; align-items: center; width: 100%; text-align: left; padding: .75rem .9rem .75rem .75rem; border-radius: var(--radius); border: 2px solid var(--ink-20); background: #fff; cursor: pointer; font-size: 18px; line-height: 1.4; min-height: 64px; }
.opt .k { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 8px; background: var(--ink-08); font-weight: 700; font-size: 22px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.sel .k { background: var(--blue); color: #fff; }
.opt:disabled { cursor: not-allowed; background: var(--desk-2); color: var(--ink-50); }
.opt:disabled .k { background: var(--ink-20); color: var(--ink-50); }
.opt .lock { display: block; color: var(--brick); font-size: var(--fs-small); font-weight: 700; margin-top: .25rem; }
.opt .cost { display: inline-flex; gap: 3px; margin-left: .5rem; vertical-align: middle; }
.opt .cost .pip { width: 9px; height: 14px; background: var(--blue); }

/* ---------- skills ---------- */
.skills { display: flex; flex-wrap: wrap; gap: .4rem; }
.skill { border: 1.5px solid var(--teal); color: var(--teal); background: #fff; border-radius: 999px; padding: .15rem .7rem; font-size: var(--fs-small); font-weight: 700; cursor: pointer; }
.skill[aria-expanded="true"] { background: var(--teal); color: #fff; }
.skill-def { background: var(--teal-soft); border-radius: var(--radius-sm); padding: .6rem .9rem; font-size: 16px; margin-top: .5rem; }

/* ---------- front page strip ---------- */
.front { background: var(--newsprint); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.25rem; }
.front .mast { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: .4rem; margin-bottom: .75rem; }
.front .mast b { font-size: 28px; display: block; line-height: 1; }
.front .mast span { font-size: 13px; color: var(--ink-70); }
.front .hl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .75rem; align-items: baseline; padding: .35rem 0; border-top: 1px solid var(--ink-08); }
.front .hl:first-of-type { border-top: 0; }
.front .hl .k { font-size: 13px; font-weight: 700; color: var(--brick); }
.front .hl .t { font-size: 19px; font-weight: 700; line-height: 1.2; }
.front .quiet { color: var(--ink-70); font-style: italic; }

/* ---------- mood board ---------- */
.moods { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; }
.mood { background: #fff; border-radius: var(--radius-sm); padding: .6rem .75rem; border: 1.5px solid var(--ink-08); }
.mood b { display: block; font-size: 16px; line-height: 1.2; }
.mood span { display: inline-block; margin-top: .25rem; font-size: var(--fs-small); font-weight: 700; padding: .05rem .5rem; border-radius: 999px; }
.m-Champion { background: var(--green-soft); color: var(--green-ink); }
.m-Supportive { background: var(--teal-soft); color: var(--teal); }
.m-Neutral { background: var(--ink-08); color: var(--ink-70); }
.m-Sceptical { background: var(--amber-soft); color: var(--amber); }
.m-Hostile { background: var(--brick-soft); color: var(--brick); }

/* ---------- horizon ---------- */
.horizon { display: grid; gap: .35rem; }
.horizon .h { display: grid; grid-template-columns: 20px 1fr; gap: .6rem; align-items: start; }
.horizon .h i { width: 12px; height: 12px; border-radius: 50%; margin-top: .45rem; background: var(--amber); }
.horizon .h.good i { background: var(--green); }

/* ---------- modal and toast ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(7, 30, 46, .55); display: grid; place-items: center; padding: 1rem; z-index: 50; }
.modal { background: #fff; border-radius: var(--radius); padding: 1.5rem; width: min(560px, 100%); max-height: 92vh; overflow: auto; box-shadow: var(--shadow); }
.modal h2 { margin-bottom: .75rem; }
.modal .row { margin-top: 1rem; }
#toasts { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); display: grid; gap: .5rem; z-index: 60; width: min(520px, calc(100% - 2rem)); }
.toast { background: var(--ink); color: #fff; padding: .7rem 1rem; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-weight: 700; opacity: 1; transition: opacity .4s; }
.toast.good { background: var(--green-ink); } .toast.bad { background: var(--brick); }
.toast.out { opacity: 0; }
.qrbox { display: grid; place-items: center; padding: .5rem; }
.qrbox svg { max-width: 100%; height: auto; }
.typedcode { font-family: var(--mono); font-size: 14px; word-break: break-all; background: var(--ink-08); padding: .5rem; border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
.kv dt { color: var(--ink-70); } .kv dd { margin: 0; font-weight: 700; }
hr.rule { border: 0; border-top: 1px solid var(--ink-08); margin: 1rem 0; }
.anchor { font-style: italic; color: var(--ink-70); border-left: 3px solid var(--green); padding-left: .75rem; }

/* ---------- the rail map ---------- */
.mappanel { background: var(--ink); border-radius: var(--radius); padding: .9rem 1rem .6rem; box-shadow: var(--shadow); position: relative; }
.mappanel .maphead { display: flex; justify-content: space-between; align-items: baseline; color: rgba(255,255,255,.75); font-size: var(--fs-small); margin-bottom: .25rem; }
.mappanel .maphead b { color: #fff; font-size: 16px; }
.mappanel .maplegend { display: flex; gap: 1rem; flex-wrap: wrap; color: rgba(255,255,255,.7); font-size: 13px; margin-top: .25rem; }
.mappanel .maplegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 4px; vertical-align: middle; }
.mappanel .maplegend i.sq { border-radius: 1px; background: #fff; }
.railmap { width: 100%; height: auto; display: block; overflow: visible; --map-land: #143D5B; --map-land-line: #2E6E9E; --map-lake: #0B2E47; --map-bed: rgba(255,255,255,.07); --map-rail: #3F78B5; --map-pk: #12CC6F; --map-bad: #FFFFFF; --map-hub: #12CC6F; }
.rm-land { fill: var(--map-land); stroke: var(--map-land-line); stroke-width: 1.1; stroke-linejoin: round; }
.rm-lake { fill: var(--map-lake); stroke: #1F5A80; stroke-width: .8; }
.rm-rail { fill: none; stroke-linecap: round; }
.rm-rail-bed { stroke: var(--map-bed); stroke-width: 7; }
.rm-rail-line { stroke: var(--map-rail); stroke-width: 2.4; opacity: .9; }
.rm-pk { fill: var(--map-pk); }
.rm-pk-bad { fill: var(--map-bad); opacity: .85; }
.rm-st-focus { fill: none; stroke: transparent; stroke-width: 1.6; }
.rm-focus .rm-st-focus { stroke: #fff; stroke-dasharray: 4 3; animation: rmspin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rmspin { to { transform: rotate(360deg); } }
.rm-st-ring { fill: var(--ink); stroke: #9FB3C8; stroke-width: 2; }
.rm-st-core { fill: #CFE3FF; }
.rm-champion .rm-st-ring { stroke: #12CC6F; stroke-width: 4; } .rm-champion .rm-st-core { fill: #12CC6F; }
.rm-supportive .rm-st-ring { stroke: #7FE0D1; stroke-width: 3; } .rm-supportive .rm-st-core { fill: #7FE0D1; }
.rm-neutral .rm-st-ring { stroke: #9FB3C8; stroke-width: 2; }
.rm-sceptical .rm-st-ring { stroke: #F2B544; stroke-width: 2; stroke-dasharray: 3 2; } .rm-sceptical .rm-st-core { fill: #F2B544; }
.rm-hostile .rm-st-ring { stroke: #FF6B5E; stroke-width: 1.6; stroke-dasharray: 2 2; } .rm-hostile .rm-st-core { fill: #FF6B5E; }
.rm-hub-box { fill: var(--green); stroke: #E8FFF2; stroke-width: 1.5; }
.rm-hub-mark { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.rm-cap-track { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 3; }
.rm-cap-ring { fill: none; stroke: #12CC6F; stroke-width: 3; stroke-linecap: round; transition: stroke-dasharray .6s; }
.rm-cap-ring.rm-cap-empty { stroke: #FF6B5E; }
.rm-label { fill: #E6EEF6; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--ink); stroke-width: 3px; stroke-linejoin: round; }
.rm-label .rm-mood, .rm-label .rm-hubstate { font-size: 9px; font-weight: 400; fill: #B8C9DA; }
.rm-focus .rm-label .rm-mood { fill: #fff; font-weight: 700; }
.rm-label-hub { fill: #fff; font-size: 12px; }
.rm-glow { transition: opacity .6s; opacity: .55; }
.railmap.rm-warm .rm-hub-box { fill: #F2B544; }
.railmap.rm-hot .rm-hub-box { fill: #FF6B5E; animation: hubpulse 1.2s infinite; transform-box: fill-box; transform-origin: center; }
.railmap.rm-hot { --map-hub: #FF6B5E; } .railmap.rm-hot .rm-glow { opacity: .95; }
.railmap.rm-warm { --map-hub: #F2B544; }
@keyframes hubpulse { 50% { transform: scale(1.12); } }

/* Team app layout */
body.team { padding-bottom: 2rem; }
#hdr { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff; padding: .55rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; box-shadow: 0 2px 10px rgba(7,30,46,.25); }
#hdr .who { display: flex; align-items: baseline; gap: .75rem; min-width: 0; }
#hdr .who b { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
#hdr .who span { color: rgba(255,255,255,.72); font-size: var(--fs-small); white-space: nowrap; }
#hdr .meters { color: #fff; }
#hdr .meter .lbl { color: rgba(255,255,255,.7); }
#hdr .meter .d.up { color: var(--green); } #hdr .meter .d.down { color: #FF8A80; } #hdr .meter .d.flat { color: rgba(255,255,255,.5); }
#hdr .pip { background: rgba(255,255,255,.22); } #hdr .pip.on { background: var(--green); }
#hdr .menu { background: transparent; border: 2px solid rgba(255,255,255,.35); color: #fff; border-radius: var(--radius-sm); min-height: 44px; padding: .3rem .8rem; font-weight: 700; cursor: pointer; }
#hdr .menu:hover { background: rgba(255,255,255,.1); }
#app { max-width: var(--max); margin: 0 auto; padding: 1.25rem 1rem 3rem; }
.screen > * + * { margin-top: 1rem; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.title-row .count { color: var(--ink-70); font-weight: 700; }
.lead { font-size: 20px; }
.ghlogo { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--green); color: var(--ink); font-weight: 700; font-size: 26px; letter-spacing: -.03em; }
.stamp { color: var(--ink-50); font-size: 13px; font-family: var(--mono); }

/* join */
.join { max-width: 1040px; margin: 2vh auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; }
.join .joinmap .mappanel { position: sticky; top: 1rem; }
.mapbox .railmap { max-height: 62vh; margin: 0 auto; }
.brief-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 1rem; align-items: start; }
.brief-text > * + * { margin-top: 1rem; }
.brief-map .mappanel { position: sticky; top: 76px; }
.settle .mapbox .railmap, .final .mapbox .railmap { max-height: 52vh; }
@media (max-width: 900px) { .join, .brief-cols { grid-template-columns: 1fr; } .join .joinmap .mappanel, .brief-map .mappanel { position: static; } .mapbox .railmap { max-height: 46vh; } }
.join .sheet { padding: 2rem; }
.join h1 { font-size: 34px; margin-top: 1rem; }
.join .sub { color: var(--ink-70); font-size: 19px; margin-bottom: 1.5rem; }

/* setup */
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; }
.cnt { background: #fff; border: 2px solid var(--ink-20); border-radius: var(--radius); padding: .75rem; display: grid; gap: .5rem; }
.cnt .nm { font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.cnt .nm::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--c); }
.cnt .ctl { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: .25rem; }
.cnt .ctl button { min-height: 48px; border-radius: 8px; border: 2px solid var(--ink-20); background: #fff; font-size: 24px; font-weight: 700; cursor: pointer; }
.cnt .ctl output { text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* lobby, brief */
.cold { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 1.5rem; }
.cold p { font-size: 21px; line-height: 1.4; }
.cold .mandate { font-size: 24px; font-weight: 700; border-left: 4px solid var(--green); padding-left: 1rem; margin-top: 1rem; }
.brief h1 { font-size: 32px; }
.brief .days { color: var(--ink-70); font-weight: 700; }
.tools { font-size: 16px; color: var(--ink-70); }

/* handoff */
.handoff { text-align: center; padding: 3rem 1rem; }
.handoff .big-owner { display: inline-grid; place-items: center; width: 120px; height: 120px; border-radius: 28px; background: var(--c, var(--ink)); color: #fff; font-size: 44px; font-weight: 700; margin-bottom: 1rem; }
.handoff h1 { font-size: 36px; }

/* decision */
.dec-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.dec-top .dnum { font-weight: 700; color: var(--ink-70); }
.timer { display: inline-flex; align-items: center; gap: .5rem; font-variant-numeric: tabular-nums; font-weight: 700; padding: .2rem .7rem; border-radius: 999px; background: #fff; border: 1.5px solid var(--ink-20); }
.timer .ph { font-weight: 400; color: var(--ink-70); font-size: var(--fs-small); }
.timer.decide { border-color: var(--blue); }
.timer.over { border-color: var(--amber); background: var(--amber-soft); }
.question { font-size: 22px; font-weight: 700; margin: .25rem 0 .5rem; }
.lockbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--desk) 70%, transparent); padding: 1rem 0 .5rem; }
.lockbar .btn { box-shadow: var(--shadow); }
.readaloud { display: inline-flex; gap: .4rem; align-items: center; }

/* feedback */
.feedback .chosen { border-left: 6px solid var(--blue); }
.feedback .chosen .k { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 700; margin-right: .5rem; }
.feedback .next { font-size: 21px; }
.note { font-size: 16px; color: var(--ink-70); }
.undo-hint { font-size: var(--fs-small); color: var(--ink-70); }

/* settlement */
.settle .bands { display: grid; gap: .5rem; }
.settle .bandrow { display: grid; grid-template-columns: 1fr max-content; gap: 1rem; align-items: baseline; padding: .5rem .75rem; border-radius: var(--radius-sm); background: var(--ink-08); }
.settle .bandrow b { font-variant-numeric: tabular-nums; }
.wait { text-align: center; color: var(--ink-70); padding: 1rem; }

/* final */
.final .big { font-size: var(--fs-num); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.objs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .75rem; }
.obj { border-radius: var(--radius); padding: 1rem; background: #fff; border: 2px solid var(--ink-08); }
.obj.met { border-color: var(--green); background: var(--green-soft); }
.obj .own { display: flex; align-items: center; gap: .5rem; font-weight: 700; }
.obj .own::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--c); }
.obj .state { font-weight: 700; margin: .4rem 0 .2rem; }
.obj.met .state { color: var(--green-ink); }
.obj .why { font-size: 15px; color: var(--ink-70); }
.bonus { background: var(--green-ink); color: #fff; border-radius: var(--radius); padding: 1rem 1.25rem; font-size: 20px; font-weight: 700; }
.bonus.none { background: var(--ink-08); color: var(--ink-70); font-weight: 400; }

@media (max-width: 640px) {
  :root { --fs-body: 17px; --fs-h1: 24px; }
  #hdr .who b { max-width: 50vw; }
  .meter { min-width: 72px; } .meter .val { font-size: 19px; }
  .art-body, .art-call .line .t { font-size: 18px; }
  .opt { font-size: 17px; }
}
@media print { #hdr, .lockbar, .menu { display: none !important; } body { background: #fff; } }

story":"H_SILENT_INCIDENT"},{"id":"H_INCIDENT_TOLD","priority":40,"when":{"all":["incident_told"],"rounds":[3,4]},"kicker":"Fintech","text":"Joint note from XxPay and GhIPSS sets reversal timeline and calms customers","story":"H_INCIDENT_TOLD"},{"id":"H_INCIDENT_HANDLED","priority":39,"when":{"all":["incident_handled"],"rounds":[3]},"kicker":"Operations","text":"Switch engineers 'on the bridge till midnight' as wallet-route fault is traced","story":"H_INCIDENT_HANDLED"},{"id":"H_FRAUD_IGNORED","priority":59,"when":{"all":["fraud_ignored"],"rounds":[3,4]},"kicker":"Fraud","text":"'Refund' scam callers target XxPay customers; switch calls it 'not our problem'","story":"H_FRAUD_IGNORED"},{"id":"H_FRAUD_HANDLED","priority":41,"when":{"all":["fraud_handled"],"rounds":[3,4]},"kicker":"Fraud","text":"Scam alert from GhIPSS reaches every participant within hours","story":"H_FRAUD_HANDLED"},{"id":"H_XXPAY_TEST","priority":43,"when":{"all":["xxpay_test"],"rounds":[3,4]},"kicker":"Fintech","text":"XxPay to route a quarter of wallet flows through GIP in 30-day test","story":"H_XXPAY_TEST"},{"id":"H_HOST_WIN_3","priority":33,"when":{"all":["host_win_3"],"rounds":[3]},"kicker":"Fintech","text":"XxPay chief 'arrived angry, left early and calmer', says a person in the room","story":"H_HOST_WIN_3"},{"id":"H_DATE_PROMISED","priority":61,"when":{"all":["date_promised"],"rounds":[4]},"kicker":"PSPs","text":"Adepa Pay promised month-end salaries; departments 'working backwards from a date'","story":"H_DATE_PROMISED"},{"id":"H_PATH_MAPPED","priority":47,"when":{"all":["path_mapped"],"rounds":[4]},"kicker":"PSPs","text":"Switch maps the 45-day onboarding path and runs three steps at once","story":"H_PATH_MAPPED"},{"id":"H_CERT_WAIVER","priority":63,"when":{"all":["cert_waiver"],"rounds":[4,5]},"kicker":"PSPs","text":"PSP certified 'with conditions' days before its first salary run","story":"H_CERT_WAIVER"},{"id":"H_WAIVER","priority":53,"when":{"all":["waiver"]},"kicker":"Pricing","text":"Fee waiver at GhIPSS sets a precedent other participants are watching","story":"H_WAIVER"},{"id":"H_UNESCORTED","priority":60,"when":{"all":["unescorted"],"rounds":[4,5]},"kicker":"Security","text":"Visiting engineers on data-centre floor with day passes and no escort","story":"H_UNESCORTED"},{"id":"H_LICENCE_ONLY","priority":46,"when":{"all":["licence_only"],"rounds":[4,5]},"kicker":"Compliance","text":"PSP with betting payouts went to the CAB on its licence alone","story":"H_LICENCE_ONLY"},{"id":"H_UNSCREENED","priority":60,"when":{"all":["unscreened"],"rounds":[4,5]},"kicker":"Compliance","text":"PSP with betting payouts onboarded on a self-certified AML letter","story":"H_UNSCREENED"},{"id":"H_HOST_WIN_4","priority":32,"when":{"all":["host_win_4"],"rounds":[4]},"kicker":"Operations","text":"Overnight clearance gets PSP engineers onto the floor by 08:00","story":"H_HOST_WIN_4"},{"id":"H_SLOW_POSTER","priority":37,"when":{"all":["slow_poster_fixed"],"rounds":[4]},"kicker":"Wallets","text":"Wallet provider agrees instant posting service level after seeing its own inflow data","story":"H_SLOW_POSTER"},{"id":"H_CENTRAL_PUSH","priority":58,"when":{"all":["central_push"],"rounds":[5]},"kicker":"Lending","text":"GhIPSS proposes one credit score for every bank; six risk chiefs object","story":"H_CENTRAL_PUSH"},{"id":"H_REGISTER","priority":49,"when":{"all":["register"],"rounds":[5]},"kicker":"Lending","text":"Shared borrower register to stop loan stacking wins bank support","story":"H_REGISTER"},{"id":"H_STIPEND_SWEEP","priority":66,"when":{"all":["stipend_sweep"],"rounds":[5]},"kicker":"Lending","text":"Lenders could sweep stipends from wallets under proposed repayment design","story":"H_STIPEND_SWEEP"},{"id":"H_MANDATE_DESIGN","priority":45,"when":{"all":["mandate_design"],"rounds":[5]},"kicker":"Lending","text":"Repayment by mandate: lending design puts borrower consent first","story":"H_MANDATE_DESIGN"},{"id":"H_LISTENED","priority":44,"when":{"all":["listened"],"rounds":[5]},"kicker":"Lending","text":"Executive Office tours six bank risk heads before the lending forum","story":"H_LISTENED"},{"id":"H_HOST_WIN_5","priority":42,"when":{"all":["host_win_5"],"rounds":[5]},"kicker":"Lending","text":"Fourteen banks see live wallet repayment demo at GhIPSS forum","story":"H_HOST_WIN_5"}],"nodes":{"N1.1":{"id":"N1.1","kind":"spine","round":1,"title":"Ninety Thousand Reasons","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["NYEP","MERIDIAN"],"engineStage":"acquisition","skills":["icp","meddicc","pind"],"ccp":"A28","medium":"email","from":"adwoa","subject":"NYEP stipends: your qualification call by Friday","situation":"The programme pays about 90,000 young people GHS 500 to 1,500 a month. Today Meridian Bank disburses through PayRoute into telco wallets. We want it on PDM into GhanaPay wallets, direct or through Meridian. I need the squad's qualification call by Friday: pursue, investigate, nurture or deprioritise. Finance, model the money, and tell me what we know for certain and what we are assuming.","data":[{"label":"Beneficiaries","value":"About 90,000","evidence":"C","source":"GhIPSS case 3, 14 Oct"},{"label":"Stipend","value":"GHS 500 to 1,500 a month","evidence":"C","source":"GhIPSS, 14 Oct"},{"label":"Current rail","value":"Meridian Bank through PayRoute into telco wallets","evidence":"C","source":"GhIPSS case 3"},{"label":"PDM fee per disbursement","value":"GHS 0.50","evidence":"A","source":"game figure"},{"label":"Beneficiaries with an active GhanaPay wallet","value":"Unknown","evidence":"U","source":null},{"label":"Economic buyer and decision process","value":"Unknown","evidence":"U","source":null}],"question":"What is the squad's qualification call?","options":[{"key":"A","text":"Pursue: pitch to run the stipends direct on PDM from next month, and open with the fee saving to the programme.","effects":{"capital":350000,"trust":-8,"risk":10,"ttl":-5,"capacity":0},"feedback":"The programme likes the saving. Meridian hears about the pitch from a journalist. Nobody has checked who signs.","route":"N1.2a","setFlags":["meridian_bypassed"]},{"key":"B","text":"Partner: offer Meridian PDM as its disbursement engine, so the stipends change rails without changing banks.","effects":{"capital":200000,"trust":4,"risk":0,"ttl":0,"capacity":0},"feedback":"Meridian is relieved and interested. It now needs file formats, a test window and an integration slot from Technology.","route":"N1.2c"},{"key":"C","text":"Investigate: a one-week MEDDICC check on the economic buyer, the decision process and wallet readiness first.","effects":{"capital":150000,"trust":6,"risk":-4,"ttl":-5,"capacity":0},"feedback":"A week later the squad knows who signs, what the ministry must approve and how few wallets exist. The pitch can wait.","route":"N1.2b","setFlags":["nyep_investigated"]},{"key":"D","text":"Nurture: park it until GhanaPay wallet numbers grow, and come back when the programme next invites proposals.","effects":{"capital":-200000,"trust":-5,"risk":3,"ttl":12,"capacity":0},"feedback":"Three weeks later a rival PSP pitches the programme. The facts the squad did not gather arrive from someone else's deck.","route":"N1.2b","setFlags":["nyep_parked"]}],"mediumLabel":"Email"},"N1.2a":{"id":"N1.2a","kind":"branch","round":1,"title":"The Launch Date","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["NYEP"],"engineStage":"acquisition","skills":["stakeholder_map","sales_courage","closing_plan"],"ccp":"A31","medium":"call","from":"fuseini","lines":[["Fuseini Yakubu","Your BD lead told my director that GhanaPay could pay our beneficiaries next month. The minister now wants a public launch in three weeks, on the first payday."],["Squad","How many beneficiaries have a GhanaPay wallet today?"],["Fuseini Yakubu","Nobody has counted. Most have telco wallets through PayRoute. The announcement is being drafted as we speak."],["Squad","And Meridian?"],["Fuseini Yakubu","Meridian has not been told."]],"data":[{"label":"Launch wanted","value":"Public launch in three weeks, first payday","evidence":"A","source":"game figure"},{"label":"Wallets registered","value":"Unknown","evidence":"U","source":null},{"label":"Registration","value":"Needs a Ghana Card validated at the selected bank","evidence":"C","source":"GhIPSS GhanaPay FAQ"},{"label":"First payday value","value":"GHS 45m to 135m, from the confirmed stipend range","evidence":"A","source":"game figure"}],"question":"What does the Executive Office tell the programme?","options":[{"key":"A","text":"Back the public launch in three weeks and let wallet registration catch up over the first two paydays.","effects":{"capital":350000,"trust":-5,"risk":12,"ttl":-10,"capacity":0},"feedback":"The announcement goes out. Registration desks open a week later than the date. The first payday is now a promise.","setFlags":["wallet_gap"]},{"key":"B","text":"Launch on the date for beneficiaries whose wallets are already active, and keep PayRoute running for the rest.","effects":{"capital":100000,"trust":2,"risk":2,"ttl":-5,"capacity":0},"feedback":"Two rails run side by side. It works, and the programme asks why the migration is taking so long."},{"key":"C","text":"Decline to set any date until Meridian has been consulted and has agreed its own role in the migration.","effects":{"capital":-100000,"trust":-2,"risk":-2,"ttl":12,"capacity":0},"feedback":"Correct about Meridian, silent about the programme. The minister's office stops returning calls for a fortnight."},{"key":"D","text":"Propose a regional pilot on the first payday, with the public launch once most wallets are active and tested.","effects":{"capital":200000,"trust":6,"risk":-4,"ttl":-5,"capacity":0},"feedback":"The minister accepts a pilot with a date. Registration starts in one region, and the squad has a payday it can defend.","setFlags":["nyep_pilot"]}],"situation":"Fuseini Yakubu: Your BD lead told my director that GhanaPay could pay our beneficiaries next month. The minister now wants a public launch in three weeks, on the first payday. Squad: How many beneficiaries have a GhanaPay wallet today? Fuseini Yakubu: Nobody has counted. Most have telco wallets through PayRoute. The announcement is being drafted as we speak. Squad: And Meridian? Fuseini Yakubu: Meridian has not been told.","mediumLabel":"Incoming call"},"N1.2b":{"id":"N1.2b","kind":"branch","round":1,"title":"Who Signs?","owner":"CONTROL","ownerDept":"Legal","accounts":["NYEP","MERIDIAN"],"engineStage":"acquisition","skills":["meddicc","stakeholder_map","closing_plan"],"ccp":"A33","medium":"meetingNote","from":"selorm","situation":"Whether from our own MEDDICC check or from the rival PSP's pitch that landed while we waited, the facts are on the table. Economic buyer: the programme finance director. Decision process: ministry approval, then programme sign-off. Decision criteria: payday reliability first, cost second. Meridian's disbursement contract runs to March. Champion: none yet. Legal, we need a route to a signature that survives the ministry step.","data":[{"label":"Economic buyer","value":"The programme finance director, Fuseini Yakubu","evidence":"A","source":"game figure"},{"label":"Decision process","value":"Ministry approval, then programme sign-off","evidence":"A","source":"game figure"},{"label":"Meridian contract","value":"Runs to March","evidence":"A","source":"game figure"},{"label":"Champion inside the programme","value":"Unknown","evidence":"U","source":null}],"question":"What does Legal propose?","options":[{"key":"A","text":"A tripartite pilot MoU with the programme, Meridian and GhIPSS, scoped to one region and one payday to start.","effects":{"capital":250000,"trust":8,"risk":-4,"ttl":-8,"capacity":0},"feedback":"Meridian signs because it keeps its client. The ministry approves a pilot faster than a migration. There is now a date.","setFlags":["nyep_pilot"],"effectsIf":[{"flag":"nyep_parked","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":0,"capacity":0},"note":"The rival PSP got there first; the programme is listening to someone else's pitch."}]},{"key":"B","text":"A letter of intent direct with the programme, leaving Meridian to find out when the ministry approves the move.","effects":{"capital":350000,"trust":-10,"risk":8,"ttl":-5,"capacity":0},"feedback":"The letter is signed in a week. Meridian learns of it from the newspaper and remembers who it is dealing with.","setFlags":["meridian_bypassed"],"effectsIf":[{"flag":"nyep_parked","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":0,"capacity":0},"note":"The rival PSP got there first; the programme is listening to someone else's pitch."}]},{"key":"C","text":"A pilot agreement that waives PDM fees for the first quarter, so the ministry sees no cost line to approve at all.","effects":{"capital":-300000,"trust":4,"risk":4,"ttl":-5,"capacity":0},"feedback":"Approval is quick. The programme now expects the rail to be free, and three other participants will hear about it.","setFlags":["waiver"],"effectsIf":[{"flag":"nyep_parked","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":0,"capacity":0},"note":"The rival PSP got there first; the programme is listening to someone else's pitch."}]},{"key":"D","text":"Wait for the programme to issue a formal call for proposals, then respond on the published terms and timeline.","effects":{"capital":-150000,"trust":-3,"risk":-2,"ttl":15,"capacity":0},"feedback":"Proper, and slow. The call for proposals is scheduled for next quarter, and the rival PSP is already in the room.","effectsIf":[{"flag":"nyep_parked","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":0,"capacity":0},"note":"The rival PSP got there first; the programme is listening to someone else's pitch."}]}],"mediumLabel":"Meeting note"},"N1.2c":{"id":"N1.2c","kind":"branch","round":1,"title":"Teach the Incumbent","owner":"PLATFORM","ownerDept":"Technology","accounts":["MERIDIAN","NYEP"],"engineStage":"acquisition","skills":["time_management","value_prop","arg"],"ccp":"A33","medium":"ticket","from":"meridian_it","subject":"PDM bulk disbursement: formats, test window and integration slot","situation":"Meridian accepts the proposal to run the NYEP stipends on PDM through its own channel. It needs the PDM bulk file formats, a test window and an integration slot within two weeks, or the next payday runs on PayRoute as before. The Technology sprint is fully booked with the quarter's certifications. Three other banks have asked about bulk disbursement this year and were told to wait.","data":[{"label":"Meridian's ask","value":"Formats, test window, integration slot inside two weeks","evidence":"A","source":"game figure"},{"label":"Sprint","value":"Fully booked; the squad holds 4 capacity units","evidence":"A","source":"game figure"},{"label":"Disbursements a year if migrated","value":"About 1.08 million, from the confirmed beneficiary count","evidence":"A","source":"game figure"},{"label":"Other banks waiting for bulk onboarding","value":"Three","evidence":"A","source":"game figure"}],"question":"How does Technology respond?","options":[{"key":"A","text":"Assign two capacity units to onboard Meridian inside two weeks, with the file formats and test window included.","effects":{"capital":150000,"trust":5,"risk":0,"ttl":-8,"capacity":-2},"feedback":"Meridian is live on PDM for the next payday. The three other banks are still waiting for the same work to be done again.","capacityCost":2,"requires":[{"meter":"capacity","op":">=","value":2,"reason":"Locked: this needs 2 capacity units and the squad has fewer. Settlement returns one unit."}]},{"key":"B","text":"Build a reusable bulk-disbursement onboarding kit for any bank, two units, and make Meridian its first user.","effects":{"capital":250000,"trust":6,"risk":-3,"ttl":-10,"capacity":-2},"feedback":"Meridian goes live on the kit. The three waiting banks get the same kit next month without a new sprint slot.","setFlags":["bulk_kit"],"capacityCost":2,"requires":[{"meter":"capacity","op":">=","value":2,"reason":"Locked: this needs 2 capacity units and the squad has fewer. Settlement returns one unit."}]},{"key":"C","text":"Send Meridian the PDM specification and test credentials, and let its own team integrate at its own pace.","effects":{"capital":0,"trust":-4,"risk":3,"ttl":10,"capacity":0},"feedback":"Meridian's team has questions nobody answers quickly. The next two paydays run on PayRoute and the moment passes."},{"key":"D","text":"Offer Meridian a dedicated engineer for the fortnight at a daily rate, so the integration slot pays for itself.","effects":{"capital":350000,"trust":-8,"risk":6,"ttl":-5,"capacity":0},"feedback":"Meridian pays, and tells two other banks that GhIPSS charges partners to bring it volume. The invoice is remembered."}],"mediumLabel":"Service ticket"},"N1.3":{"id":"N1.3","kind":"default","round":1,"title":"Registration Road Trip","owner":"SERVICE","ownerDept":"Shared Services (fleet)","accounts":["NYEP"],"engineStage":"acquisition","skills":["revenue_engine","time_management"],"ccp":"A31","medium":"memo","from":"transport","subject":"Vehicles for the northern registration drives","situation":"Registration drives for the NYEP migration need three vehicles and drivers in the northern regions for three weeks, starting Monday. The fleet is booked for the executive retreat in the same period. The programme has asked whether GhIPSS can move. Participating banks are sending registration desks but have no transport budget. Decision needed by Thursday.","data":[{"label":"Vehicles needed","value":"Three, with drivers, for three weeks","evidence":"A","source":"game figure"},{"label":"Fleet available","value":"None: all booked for the executive retreat","evidence":"A","source":"game figure"},{"label":"Commercial hire","value":"GHS 1,800 a day per vehicle","evidence":"A","source":"game figure"},{"label":"Registration","value":"Ghana Card validated at the selected bank","evidence":"C","source":"GhIPSS GhanaPay FAQ"}],"question":"What does Shared Services do?","options":[{"key":"A","text":"Hire three vehicles at the commercial rate for three weeks and recharge the cost to the NYEP project line.","effects":{"capital":50000,"trust":3,"risk":0,"ttl":-6,"capacity":0},"feedback":"The drives start on Monday. Finance queries the recharge in week two, and the project line absorbs it."},{"key":"B","text":"Ask the participating banks to run the drives with their own vans, since the registrations belong to them.","effects":{"capital":250000,"trust":-6,"risk":6,"ttl":5,"capacity":0},"feedback":"Two banks send vans. One does not, and its region starts ten days late. The programme notices which rail asked."},{"key":"C","text":"Ask the Sponsor to release two retreat vehicles and hire a third, with drivers rostered by the fleet desk.","effects":{"capital":200000,"trust":5,"risk":-2,"ttl":-8,"capacity":0},"feedback":"The Sponsor releases two cars and asks for a photo from the first drive. Desks open Monday in all three regions.","setFlags":["host_win_1"],"requires":[{"meter":"trust","op":">=","value":45,"reason":"Locked: Partner Trust below 45. The Sponsor will not release vehicles for a squad that partners do not yet trust."}]},{"key":"D","text":"Postpone the drives until the retreat ends, and move the first GhanaPay payday back by one month to match it.","effects":{"capital":-250000,"trust":-6,"risk":4,"ttl":15,"capacity":0},"feedback":"The retreat goes ahead. The programme's first payday on GhanaPay moves, and the minister's office asks why.","setFlags":["wallet_gap"]}],"mediumLabel":"Internal memo"},"N2.1":{"id":"N2.1","kind":"spine","round":2,"title":"The Visitor in Reception","owner":"SERVICE","ownerDept":"Shared Services (front office)","accounts":["ABUSUA"],"engineStage":"conversion","skills":["customer_empathy","revenue_engine"],"ccp":"A31","medium":"log","from":"frontdesk","subject":"Front desk log, 10:02","situation":"Visitor: Dzifa Ahiable, Chief Finance Officer, Abusua Appliances, 42 stores. Not on today's visitor list. Says she has a 10:00 with Business Development about GhQR reporting. Adwoa Quaye is in another meeting until 10:20. Boardroom 2 shows double-booked with the audit committee. Mrs Ahiable has been offered water and is checking her watch. Front office needs a decision.","data":[{"label":"Abusua","value":"42 stores; needed real-time ERP updates on Day 1","evidence":"C","source":"GhIPSS case 2"},{"label":"Contract","value":"Unsigned, four weeks after Day 1","evidence":"A","source":"game figure"},{"label":"Boardroom 2","value":"Double-booked with the audit committee","evidence":"A","source":"game figure"},{"label":"Business Development lead","value":"Free at 10:20","evidence":"A","source":"game figure"}],"question":"What does the front office do?","options":[{"key":"A","text":"Start the meeting in whichever corner is free right now, and move to a proper room as soon as one becomes available.","effects":{"capital":200000,"trust":-3,"risk":4,"ttl":0,"capacity":0},"feedback":"The meeting starts by the lift lobby. She keeps her coat on, asks for the price, and leaves at 10:25.","route":"N2.2b"},{"key":"B","text":"Seat her in reception with the visitor magazine until Boardroom 2 clears at 10:30, then begin the meeting.","effects":{"capital":-150000,"trust":-8,"risk":2,"ttl":5,"capacity":0},"feedback":"She waits 28 minutes watching the lift. By the time Adwoa appears she has drafted an email on her phone.","route":"N2.2c","setFlags":["visitor_fail"]},{"key":"C","text":"Explain the booking clash politely, apologise, and offer to reschedule for a day when the boardroom is free.","effects":{"capital":-100000,"trust":-5,"risk":-1,"ttl":10,"capacity":0},"feedback":"She accepts a new date in nine days. Her email that afternoon asks only for the price, with no mention of the ERP.","route":"N2.2b"},{"key":"D","text":"Apologise, move her to a prepared room, bring Adwoa out of her meeting within five minutes, and log the failure.","effects":{"capital":150000,"trust":8,"risk":-2,"ttl":-3,"capacity":0},"feedback":"She is seated with coffee by 10:06 and Adwoa walks in at 10:08. The logged failure gets the visitor process fixed.","route":"N2.2a","setFlags":["host_win_2"]}],"mediumLabel":"Front desk log"},"N2.2a":{"id":"N2.2a","kind":"branch","round":2,"title":"Twenty-Four Hours Too Late","owner":"PLATFORM","ownerDept":"Technology","accounts":["ABUSUA"],"engineStage":"conversion","skills":["need_chain","value_prop","time_management"],"ccp":"A28","medium":"meetingNote","from":"dzifa","situation":"\"Your bulk report arrives the next morning. By then 42 store managers have already decided what to restock and which customers to extend credit to, without knowing what was paid by GhQR yesterday. I do not need a prettier report. I need the ERP to know within minutes.\" Asked what the stores do today: each manager reconciles by phone with head office at close of business.","data":[{"label":"Confirmed need","value":"Real-time updates into the ERP","evidence":"C","source":"GhIPSS case 2"},{"label":"Standard GhQR","value":"Bulk updates with next-day reports","evidence":"C","source":"GhIPSS case 2"},{"label":"Abusua GhQR value","value":"About GHS 6m a month across 42 stores","evidence":"A","source":"game figure"},{"label":"Technology estimate","value":"Custom API six weeks; product API eight weeks","evidence":"A","source":"game figure"}],"question":"What does Technology propose?","options":[{"key":"A","text":"Productise a real-time notification API for all GhQR merchants, Abusua first, eight weeks, two capacity units.","effects":{"capital":250000,"trust":6,"risk":-2,"ttl":-3,"capacity":-2},"feedback":"Abusua waits two more weeks and signs. Four other retailers ask for the same product before it ships.","setFlags":["api_product","need_validated"],"capacityCost":2,"requires":[{"meter":"capacity","op":">=","value":2,"reason":"Locked: this needs 2 capacity units and the squad has fewer. Settlement returns one unit."}]},{"key":"B","text":"Build a custom real-time API for Abusua's ERP in six weeks, three capacity units, at no extra charge to Abusua.","effects":{"capital":300000,"trust":6,"risk":2,"ttl":-5,"capacity":-3},"feedback":"Abusua signs the same week. Three engineers disappear into one retailer's ERP for six weeks, and the sprint feels it.","setFlags":["custom_api"],"capacityCost":3,"requires":[{"meter":"capacity","op":">=","value":3,"reason":"Locked: this needs 3 capacity units and the squad has fewer. Settlement returns one unit."}]},{"key":"C","text":"Send intraday report files every two hours from next week, while the real-time need is scoped with her finance team.","effects":{"capital":100000,"trust":4,"risk":0,"ttl":0,"capacity":0},"feedback":"Store managers get afternoon numbers within days. Dzifa calls it a start and asks when the real thing arrives.","setFlags":["need_validated"]},{"key":"D","text":"Offer standard GhQR with next-day reports at a 20% discount, since the real-time ERP link is a nice-to-have.","effects":{"capital":-200000,"trust":-8,"risk":0,"ttl":10,"capacity":0},"feedback":"She thanks you for your time. Abusua's bank offers evening reports the following week, and the price was never the point.","setFlags":["abusua_cold"]}],"mediumLabel":"Meeting note"},"N2.2b":{"id":"N2.2b","kind":"branch","round":2,"title":"Just Tell Me the Price","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ABUSUA"],"engineStage":"conversion","skills":["genuine_curiosity","need_chain","objection"],"ccp":"A28","medium":"email","from":"dzifa","subject":"GhQR pricing","situation":"Thank you for seeing me this morning in the circumstances. Our bank has offered its own QR acceptance at 0.45% with reports every evening. Before I take anything to my board, please send me your best price per transaction and your reporting frequency. I do not need a presentation. I need two numbers by Thursday.","data":[{"label":"Bank's QR offer","value":"0.45% with evening reports","evidence":"A","source":"game figure"},{"label":"Standard GhQR tariff","value":"Published merchant rate, next-day reports","evidence":"A","source":"game figure"},{"label":"Day 1 finding","value":"The need was real-time ERP updates, not price","evidence":"C","source":"GhIPSS case 2"},{"label":"How the 42 stores reconcile today","value":"Unknown","evidence":"U","source":null}],"question":"What does Finance send?","options":[{"key":"A","text":"Match the bank's 0.45% and add evening reports, so that price is off the table before her board meets next week.","effects":{"capital":250000,"trust":3,"risk":4,"ttl":-3,"capacity":0},"feedback":"She signs at the matched price within the week. Two merchants in the queue hear the number and ask for the same.","setFlags":["waiver"]},{"key":"B","text":"Send the standard tariff sheet with the published reporting schedule, exactly as it goes out to every merchant.","effects":{"capital":-150000,"trust":-6,"risk":0,"ttl":8,"capacity":0},"feedback":"The tariff sheet answers a question she did not ask. Abusua's next email comes from its bank's relationship manager.","setFlags":["abusua_cold"]},{"key":"C","text":"Reply with two questions about how the 42 stores reconcile today, and promise a price within a day of her answer.","effects":{"capital":200000,"trust":6,"risk":-2,"ttl":-5,"capacity":0},"feedback":"She answers that evening: phone reconciliation costs her stores 42 hours a day. Technology scopes a notification API for every merchant.","setFlags":["need_validated","api_product"]},{"key":"D","text":"Quote a bundle of GhQR with gh-link POS acceptance at a blended rate, to beat the bank on total cost of acceptance.","effects":{"capital":100000,"trust":-2,"risk":4,"ttl":2,"capacity":0},"feedback":"The bundle is cheaper on paper. Her reply asks what POS acceptance has to do with knowing what was paid yesterday."}],"mediumLabel":"Email"},"N2.2c":{"id":"N2.2c","kind":"branch","round":2,"title":"We Are Evaluating Alternatives","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["ABUSUA"],"engineStage":"conversion","skills":["customer_empathy","need_chain","opp_status"],"ccp":"A31","medium":"email","from":"dzifa","subject":"Our discussion","situation":"I waited 28 minutes in your reception this morning, which told me something about how GhIPSS treats a customer that has not yet signed. Abusua is now evaluating an alternative provider for store payments. If you wish to remain in consideration, I am available by email only until the end of the month. Kindly do not call the stores.","data":[{"label":"Abusua","value":"42 stores; real-time ERP need","evidence":"C","source":"GhIPSS case 2"},{"label":"Alternative","value":"A bank's own QR acceptance offer","evidence":"A","source":"game figure"},{"label":"Reception wait","value":"28 minutes","evidence":"A","source":"game figure"},{"label":"Contact allowed","value":"Email only, until month-end","evidence":"A","source":"game figure"}],"question":"What does Brand and Communications propose?","options":[{"key":"A","text":"Ask our chief executive to call Abusua's chief executive, apologise, and request one more meeting at their offices.","effects":{"capital":100000,"trust":4,"risk":0,"ttl":-2,"capacity":0},"feedback":"The call is taken warmly. Abusua's CEO refers it back to Dzifa, who still wants to know what GhIPSS would do differently."},{"key":"B","text":"Reply with an apology and one request: to observe end-of-day reconciliation in two stores before proposing anything.","effects":{"capital":250000,"trust":7,"risk":-2,"ttl":-4,"capacity":0},"feedback":"She agrees to Thursday. Two hours in a store shows the phone reconciliation, and the proposal becomes a product API for every merchant.","setFlags":["need_validated","api_product"]},{"key":"C","text":"Send three merchant case studies and the GhQR brochure, and offer a product demonstration whenever Abusua is ready.","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":8,"capacity":0},"feedback":"The brochure is read by nobody. The alternative provider visits two stores the following week.","setFlags":["abusua_cold"]},{"key":"D","text":"Offer a free three-month GhQR trial across all 42 stores, with reporting at whatever frequency she prefers to have.","effects":{"capital":300000,"trust":3,"risk":5,"ttl":-3,"capacity":0},"feedback":"She accepts the trial. Reports still arrive the next day, because the frequency was never the problem, and the trial is free.","setFlags":["waiver"]}],"mediumLabel":"Email"},"N2.3":{"id":"N2.3","kind":"default","round":2,"title":"Who Owns the Data?","owner":"CONTROL","ownerDept":"Legal and Cybersecurity","accounts":["ABUSUA"],"engineStage":"conversion","skills":["arg","time_management"],"ccp":"A33","medium":"memo","from":"legal","subject":"Merchant data in a real-time feed","situation":"Any real-time link to a merchant's ERP sends transaction data outside GhIPSS to a system we do not control. Today's merchant terms cover reports, not live feeds. The retailer's IT vendor has asked for API keys to start testing. ISMS Governance reviews participants' information security; nobody has yet reviewed a merchant's vendor. We need a position before any key is issued.","data":[{"label":"Merchant terms","value":"Cover reports; silent on live feeds","evidence":"A","source":"game figure"},{"label":"ISMS Governance","value":"Reviews participants' information security","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Vendor request","value":"API keys to begin testing","evidence":"A","source":"game figure"},{"label":"Data in the feed","value":"Amount, store, time, masked payer","evidence":"A","source":"game figure"}],"question":"What does Legal recommend?","options":[{"key":"A","text":"Ship on the standard merchant terms now and update the terms at the next annual review of the tariff guide.","effects":{"capital":200000,"trust":2,"risk":8,"ttl":-5,"capacity":0},"feedback":"The feed goes live on terms that never mention it, and nobody tests the vendor's endpoint before the keys go out.","setFlags":["api_unsecured"]},{"key":"B","text":"Let the retailer's IT vendor self-certify its security and sign a one-page acknowledgement of its responsibility.","effects":{"capital":300000,"trust":1,"risk":14,"ttl":-8,"capacity":0},"feedback":"Keys are issued the same day. The vendor's developers commit them to a code repository that is public.","setFlags":["api_unsecured"]},{"key":"C","text":"Hold the link until ISMS Governance completes a full audit of the retailer and its vendor, about six weeks.","effects":{"capital":-150000,"trust":-4,"risk":-4,"ttl":15,"capacity":0},"feedback":"Safe, and six weeks is longer than the retailer's patience. The audit starts; the go-live date quietly stops existing."},{"key":"D","text":"Cybersecurity tests the endpoint while Legal drafts a data-sharing addendum, both finished before go-live.","effects":{"capital":200000,"trust":5,"risk":-5,"ttl":-3,"capacity":0},"feedback":"Testing finds two weak defaults in the vendor's set-up. The addendum takes four days and Abusua signs it without comment.","setFlags":["data_secured"]}],"mediumLabel":"Internal memo"},"N3.1":{"id":"N3.1","kind":"spine","round":3,"title":"Friday, 17:42","owner":"PLATFORM","ownerDept":"Technology","accounts":["XXPAY"],"engineStage":"retention","skills":["recovery","emotional_resilience"],"ccp":"A31","medium":"call","from":"kobina","lines":[["Kobina Essel","Since 17:10, 14% of wallet transfers on your test route are timing out. Our customers are retrying. We can see duplicates posting. This is why our wallet flows stay bilateral."],["Squad","Is the timeout at our switch or at the receiving wallet provider?"],["Kobina Essel","Your dashboard says green. Ours says 14%. Dela is already asking me why we started this test. What are you doing in the next ten minutes?"]],"data":[{"label":"Timeout rate","value":"14% since 17:10 on the wallet test route","evidence":"A","source":"game figure"},{"label":"XxPay today","value":"Bank transfers through GhIPSS; wallet flows bilateral","evidence":"C","source":"GhIPSS case 5"},{"label":"Duplicates posted","value":"212 so far, rising","evidence":"A","source":"game figure"},{"label":"Receiving wallet provider's endpoint status","value":"Unknown","evidence":"U","source":null}],"question":"What does Technology do now?","options":[{"key":"A","text":"Restart the service now to clear the queue, and raise the change request on Monday when the Change Advisory Board sits.","effects":{"capital":300000,"trust":2,"risk":12,"ttl":0,"capacity":0},"feedback":"The queue clears in eleven minutes and the timeouts stop. Nobody records what else the restart changed, and customers are still posting.","route":"N3.2a","setFlags":["unapproved_change"]},{"key":"B","text":"Ask XxPay to pause wallet transfers on the test route until Monday, and keep its bank transfers running as normal.","effects":{"capital":-50000,"trust":1,"risk":-3,"ttl":3,"capacity":0},"feedback":"XxPay pauses. The weekend is quiet, the cause is still unknown, and Dela arrives on Monday to ask why the test was ever on.","route":"N3.2c"},{"key":"C","text":"Switch on duplicate checks, open a bridge call with the wallet provider, and update XxPay every 30 minutes, one unit.","effects":{"capital":200000,"trust":8,"risk":-5,"ttl":-2,"capacity":-1},"feedback":"Duplicates stop at 18:05. The provider finds a saturated endpoint by 19:00. Kobina gets four updates before midnight.","route":"N3.2c","setFlags":["incident_handled"],"capacityCost":1,"requires":[{"meter":"capacity","op":">=","value":1,"reason":"Locked: this needs 1 capacity unit and the squad has fewer. Settlement returns one unit."}]},{"key":"D","text":"Log the ticket with the wallet provider and wait for its endpoint fix, since the fault sits outside GhIPSS's rail.","effects":{"capital":-200000,"trust":-10,"risk":6,"ttl":5,"capacity":0},"feedback":"The ticket sits in the provider's queue until Monday. Customers keep retrying all weekend, and by Saturday someone is phoning them.","route":"N3.2b","setFlags":["silent_incident"]}],"situation":"Kobina Essel: Since 17:10, 14% of wallet transfers on your test route are timing out. Our customers are retrying. We can see duplicates posting. This is why our wallet flows stay bilateral. Squad: Is the timeout at our switch or at the receiving wallet provider? Kobina Essel: Your dashboard says green. Ours says 14%. Dela is already asking me why we started this test. What are you doing in the next ten minutes?","mediumLabel":"Incoming call"},"N3.2a":{"id":"N3.2a","kind":"branch","round":3,"title":"Who Tells the Customers?","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["XXPAY"],"engineStage":"retention","skills":["recovery","customer_empathy"],"ccp":"A31","medium":"message","from":"xxpay_comms","lines":[["XxPay comms, 19:05","Customers are posting screenshots of double debits. Social media is naming GhIPSS. We are drafting a statement that says the fault is on your rail."],["XxPay comms, 19:06","Dela wants it out by 20:00."],["XxPay comms, 19:09","If you want a joint line, send it in the next 30 minutes. Otherwise we go alone."]],"data":[{"label":"Screenshots posted","value":"More than 40","evidence":"A","source":"game figure"},{"label":"Reversals pending","value":"212 duplicates","evidence":"A","source":"game figure"},{"label":"XxPay deadline","value":"20:00 tonight","evidence":"A","source":"game figure"},{"label":"Root cause","value":"Unknown","evidence":"U","source":null}],"question":"What does Brand and Communications send?","options":[{"key":"A","text":"A joint factual note with XxPay: what happened, when reversals land, who to contact, and no blame on anyone.","effects":{"capital":150000,"trust":8,"risk":-4,"ttl":0,"capacity":0},"feedback":"The joint note is out at 19:50. Replies on social media turn from anger to questions about timing within the hour.","setFlags":["incident_told"]},{"key":"B","text":"A GhIPSS statement naming the wallet provider's endpoint as the cause, so that the rail's reputation is protected.","effects":{"capital":200000,"trust":-6,"risk":6,"ttl":0,"capacity":0},"feedback":"The provider's lawyers write on Monday. XxPay's statement still names GhIPSS, and now two parties are blaming each other."},{"key":"C","text":"Say nothing until the root cause is confirmed, since any statement sent now could be wrong and quoted back later.","effects":{"capital":-150000,"trust":-9,"risk":5,"ttl":3,"capacity":0},"feedback":"XxPay goes alone at 20:00. By morning the only account of the night is XxPay's, and GhIPSS is the villain in it.","setFlags":["silent_incident"]},{"key":"D","text":"Let XxPay issue its own statement, and give it a reversal timeline it can quote, with no separate GhIPSS statement.","effects":{"capital":0,"trust":1,"risk":1,"ttl":0,"capacity":0},"feedback":"XxPay's statement carries the timeline and softens its tone. GhIPSS is mentioned once, neutrally. It could have been worse."}],"situation":"XxPay comms, 19:05: Customers are posting screenshots of double debits. Social media is naming GhIPSS. We are drafting a statement that says the fault is on your rail. XxPay comms, 19:06: Dela wants it out by 20:00. XxPay comms, 19:09: If you want a joint line, send it in the next 30 minutes. Otherwise we go alone.","mediumLabel":"Message thread"},"N3.2b":{"id":"N3.2b","kind":"branch","round":3,"title":"The Refund Callers","owner":"CONTROL","ownerDept":"Fraud Management","accounts":["XXPAY"],"engineStage":"retention","skills":["recovery","sales_courage"],"ccp":"A31","medium":"ticket","from":"frauddesk","subject":"Ticket #4502, Saturday 09:40: refund scam calls","situation":"Callers claiming to be 'GhIPSS refunds' are phoning XxPay customers affected by last night's duplicates and asking for wallet PINs to process the reversal. Eleven customers have reported it; three have lost money. The numbers used are prepaid and rotate. Reversals from the restart are still posting, so every affected customer is expecting a credit.","data":[{"label":"Reports so far","value":"Eleven, three with losses","evidence":"A","source":"game figure"},{"label":"Reversals","value":"Still posting through Saturday","evidence":"A","source":"game figure"},{"label":"Fraud and Cybersecurity","value":"Not part of participant onboarding today","evidence":"C","source":"GhIPSS answers, 14 Oct"},{"label":"Mule accounts receiving many small credits","value":"Unknown","evidence":"U","source":null}],"question":"What does Fraud Management do?","options":[{"key":"A","text":"Treat it as XxPay's customer problem, since the callers are not GhIPSS and the losses sit on XxPay's wallets.","effects":{"capital":200000,"trust":-9,"risk":10,"ttl":0,"capacity":0},"feedback":"Losses reach 30 customers by Monday. XxPay's statement says GhIPSS was told on Saturday morning and did nothing.","setFlags":["fraud_ignored"]},{"key":"B","text":"Ask Brand to post a public warning on GhIPSS channels only, and leave the participant alerts until Monday morning.","effects":{"capital":50000,"trust":2,"risk":-2,"ttl":0,"capacity":0},"feedback":"The warning reaches people who follow GhIPSS. The callers move to customers of another participant on Sunday."},{"key":"C","text":"Block all reversals until Monday so no caller can claim to be processing one, then restart them in batches.","effects":{"capital":-100000,"trust":-6,"risk":2,"ttl":3,"capacity":0},"feedback":"The calls slow down. So do the refunds, and 212 customers spend the weekend without their money or an explanation."},{"key":"D","text":"Warn XxPay and every participant, publish a scam alert, and watch for mule accounts receiving many small credits.","effects":{"capital":150000,"trust":7,"risk":-8,"ttl":0,"capacity":0},"feedback":"Two mule accounts are frozen by noon. The alert reaches 40 participants and the calls stop by Sunday.","setFlags":["fraud_handled"]}],"mediumLabel":"Service ticket"},"N3.2c":{"id":"N3.2c","kind":"branch","round":3,"title":"The CEO in Reception","owner":"SERVICE","ownerDept":"Shared Services (front office)","accounts":["XXPAY"],"engineStage":"retention","skills":["emotional_resilience","customer_empathy"],"ccp":"A31","medium":"log","from":"frontdesk","subject":"Front desk log, Monday 08:05","situation":"Visitor: Dela Amegashie, Chief Executive, XxPay, with two colleagues. Here for the 09:00 incident review, 55 minutes early, carrying a printout of customer complaints. Says, 'We will wait, but not for long.' The incident owner is on the road; Adwoa Quaye is in the building. Boardroom 1 is set up for 09:00. The second-floor coffee machine is out of order.","data":[{"label":"Arrival","value":"55 minutes early, with two staff","evidence":"A","source":"game figure"},{"label":"Incident timeline","value":"Ready on the shared drive","evidence":"A","source":"game figure"},{"label":"Incident owner","value":"On the road, 25 minutes away","evidence":"A","source":"game figure"},{"label":"XxPay activity on GhIPSS","value":"Fell 18% last month","evidence":"A","source":"game figure"}],"question":"What does the front office do?","options":[{"key":"A","text":"Ask him to come back for the 09:00 review as arranged, and offer the visitors' lounge downstairs until then.","effects":{"capital":-150000,"trust":-10,"risk":2,"ttl":3,"capacity":0},"feedback":"He leaves. The 09:00 review happens by phone, and his first sentence is about the reception.","setFlags":["visitor_fail"]},{"key":"B","text":"Receive him in a prepared room now, and bring Adwoa and the incident owner in within ten minutes with the timeline.","effects":{"capital":150000,"trust":8,"risk":-2,"ttl":0,"capacity":0},"feedback":"He is in Boardroom 1 by 08:10 with the timeline in front of him. The review starts early and ends calmer than it began.","setFlags":["host_win_3"]},{"key":"C","text":"Seat the three of them in the lobby until somebody from the incident team is free, and send down some coffee.","effects":{"capital":-50000,"trust":-5,"risk":0,"ttl":2,"capacity":0},"feedback":"They sit in the lobby for 40 minutes reading the complaints aloud to each other. Staff walk past.","setFlags":["visitor_fail"]},{"key":"D","text":"Walk him straight up to the GhIPSS chief executive's office unannounced, since a chief executive should meet a peer.","effects":{"capital":200000,"trust":-2,"risk":6,"ttl":0,"capacity":0},"feedback":"The chief executive is on a call and has not read the timeline. The meeting happens without the facts in the room."}],"mediumLabel":"Front desk log"},"N3.3":{"id":"N3.3","kind":"default","round":3,"title":"Three Doors at XxPay","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["XXPAY"],"engineStage":"retention","skills":["falling_activity","arg","objection"],"ccp":"A28","medium":"memo","from":"selorm","subject":"XxPay: three growth doors","situation":"XxPay's activity on GhIPSS fell 18% on the prior month. Three growth doors exist: move its wallet flows from bilateral to GIP, add gh-link acceptance on its POS, and add GhanaPay on its request-to-pay POS. Each needs XxPay to change something, and XxPay has just lived through our test. The Executive Office decides what we take to Dela's review.","data":[{"label":"Activity fall","value":"18% on the prior month","evidence":"A","source":"game figure"},{"label":"XxPay POS","value":"Does not accept gh-link; its R2P POS does not accept GhanaPay","evidence":"C","source":"GhIPSS case 5"},{"label":"Wallet flows","value":"Bilateral today","evidence":"C","source":"GhIPSS case 5"},{"label":"Cause of the fall: seasonality, demand, service friction or changed routing","value":"Unknown","evidence":"U","source":null}],"question":"What does the Executive Office propose?","options":[{"key":"A","text":"Test one: route a quarter of wallet flows through GIP for 30 days with daily reliability reports, then grow.","effects":{"capital":200000,"trust":7,"risk":-3,"ttl":-4,"capacity":0},"feedback":"Dela agrees to a quarter, because a quarter can be stopped. The daily report becomes the thing he reads first.","setFlags":["xxpay_test"]},{"key":"B","text":"Propose all three doors as one bundle under a single commercial agreement, so that XxPay only has to decide once.","effects":{"capital":150000,"trust":-3,"risk":4,"ttl":5,"capacity":0},"feedback":"Dela asks which one you would do first. Nobody has an answer, and the bundle goes to a committee at XxPay."},{"key":"C","text":"Push gh-link acceptance on XxPay's POS first, because card transactions earn the most per item for both sides.","effects":{"capital":300000,"trust":0,"risk":4,"ttl":0,"capacity":0},"feedback":"The card case is strong and XxPay listens. Its wallet flows stay bilateral, which is where the volume was."},{"key":"D","text":"Defer any growth conversation to next quarter, and spend the whole review on the incident and its lessons.","effects":{"capital":-150000,"trust":-2,"risk":-2,"ttl":10,"capacity":0},"feedback":"The review is thorough and calm. XxPay's 18% fall becomes 24% while everyone waits for next quarter."}],"mediumLabel":"Internal memo"},"N4.1":{"id":"N4.1","kind":"spine","round":4,"title":"Nineteen Days to Payday","owner":"ENABLEMENT","ownerDept":"Executive","accounts":["ADEPA"],"engineStage":"activation","skills":["negotiation","closing_plan","sales_courage"],"ccp":"A33","medium":"call","from":"yao","lines":[["Yao Dzansi","NDA signed. SLA signed. I have three corporate clients promised a salary run through Adepa at month-end. Nineteen days. Your Legal says done, your Operations says UAT next month, your Finance wants a fee before anything moves. Nobody has given me a date."],["Squad","The usual run from signature to live is about 45 days."],["Yao Dzansi","Then say so and we stay bilateral. Give me a date."]],"data":[{"label":"Done","value":"NDA and SLA executed by Legal","evidence":"C","source":"GhIPSS onboarding chain"},{"label":"Left","value":"ISMS review, connectivity, UAT and certification, CAB after certification, joining fee, go-live","evidence":"C","source":"GhIPSS case 1 and answers"},{"label":"Usual elapsed time","value":"About 45 days","evidence":"A","source":"game figure"},{"label":"Days to payday","value":"19","evidence":"A","source":"game figure"}],"question":"What does the Executive Office tell Adepa?","options":[{"key":"A","text":"Commit to month-end now to keep the deal, and ask every department to pull its own step forward by whatever it takes.","effects":{"capital":350000,"trust":6,"risk":12,"ttl":-15,"capacity":0},"feedback":"Yao tells his clients. Six departments start working backwards from a date none of them agreed to.","route":"N4.2a","setFlags":["date_promised"]},{"key":"B","text":"Conditional exchange: bank salaries by month-end if Adepa finishes UAT scripts in five days and pays at certification.","effects":{"capital":150000,"trust":4,"risk":2,"ttl":-10,"capacity":0},"feedback":"Yao takes the exchange. Adepa's developers finish the scripts in four days, and his finance team now owes a payment.","route":"N4.2b"},{"key":"C","text":"Quote the standard 45 days with the standard sequence, and let Adepa decide whether to wait for it or stay bilateral.","effects":{"capital":-150000,"trust":-6,"risk":-2,"ttl":8,"capacity":0},"feedback":"Yao says he will think about it. His engineers still ask for data-centre access tomorrow, because his clients have not changed their minds.","route":"N4.2d"},{"key":"D","text":"Map the critical path, run ISMS review, connectivity and invoicing in parallel, book the CAB now, then set a conditional date.","effects":{"capital":250000,"trust":7,"risk":-3,"ttl":-15,"capacity":-2},"feedback":"The map shows 23 days if three steps run together. Yao gets a date with conditions, and one of them is his.","route":"N4.2c","setFlags":["path_mapped"],"capacityCost":2,"requires":[{"meter":"capacity","op":">=","value":2,"reason":"Locked: this needs 2 capacity units and the squad has fewer. Settlement returns one unit."}]}],"situation":"Yao Dzansi: NDA signed. SLA signed. I have three corporate
